# Checks every industry-template PR (opened by developers through industry-template-mcp)
# before a human merges it. Read-only token, no secrets: pull_request never exposes
# repository secrets to the PR's code.
name: industry-templates

on:
  pull_request:
    paths:
      - "app/services/industry_templates/**"
      - "app/services/industry_template_catalog.py"
      - ".dockerignore"
      - "tests/test_industry_*"
      - "tests/test_container_release.py"
      - ".github/workflows/industry-templates.yml"

permissions:
  contents: read

jobs:
  industry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders only: app modules read these at import. No test calls a real service.
      SUPABASE_URL: https://ci.invalid
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      GEMINI_API_KEY: ci-placeholder
      OPENAI_API_KEY: ci-placeholder
      DEEPSEEK_API_KEY: ci-placeholder
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Industry catalog, extension files and container allowlist
        run: >-
          python -m pytest -q
          tests/test_industry_template_extensions.py
          tests/test_industry_template_catalog.py
          tests/test_industry_list_single_source.py
          tests/test_industry_template_service.py
          tests/test_business_observation_migration_071.py
          tests/test_container_release.py
