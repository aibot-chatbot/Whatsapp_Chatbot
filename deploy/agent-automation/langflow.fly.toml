# Private editor/API on 7860: reach it with fly proxy or <app>.internal. The only
# public surface is Langflow's built-in MCP endpoint on 8080 (owner decision
# 2026-09-26); the entrypoint 404s every other path there (langflow.Dockerfile).
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "deploy/agent-automation/langflow.Dockerfile"

[env]
  # The image entrypoint binds "::" itself; LANGFLOW_HOST is unused (see langflow.Dockerfile).
  LANGFLOW_PORT = "7860"
  LANGFLOW_PUBLIC_MCP_PORT = "8080"
  LANGFLOW_CONFIG_DIR = "/var/lib/langflow"
  LANGFLOW_SAVE_DB_IN_CONFIG_DIR = "true"
  LANGFLOW_AUTO_LOGIN = "false"
  LANGFLOW_LOG_LEVEL = "WARNING"
  # JSON logs without frame locals. The default rich console traceback prints locals,
  # which put AGENT_INTERNAL_TOKEN in plaintext logs when the bridge step failed.
  LANGFLOW_LOG_ENV = "container"
  LANGFLOW_LOG_TRACE_LOCALS = "false"
  DO_NOT_TRACK = "true"
  LANGFLOW_DO_NOT_TRACK = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # 24/7: the worker calls this machine synchronously over .internal.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "langflow_data"
  destination = "/var/lib/langflow"
  snapshot_retention = 7

[deploy]
  strategy = "immediate"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"

[[restart]]
  policy = "always"

[checks.langflow]
  type = "http"
  port = 7860
  path = "/health_check"
  interval = "30s"
  timeout = "5s"
  grace_period = "300s"
