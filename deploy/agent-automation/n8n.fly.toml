primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  image = "docker.n8n.io/n8nio/n8n:2.39.10@sha256:ae87797ce1556b3a1a2e27ce9f43c49977731d8a067951ec2947bcd4df7744f0"

[env]
  N8N_LISTEN_ADDRESS = "::"
  N8N_PORT = "5678"
  N8N_PROTOCOL = "http"
  N8N_SECURE_COOKIE = "true"
  N8N_DIAGNOSTICS_ENABLED = "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED = "false"
  N8N_PERSONALIZATION_ENABLED = "false"
  N8N_COMMUNITY_PACKAGES_ENABLED = "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE = "true"
  DB_TYPE = "postgresdb"
  DB_POSTGRESDB_SCHEMA = "agent_n8n"
  DB_POSTGRESDB_SSL_ENABLED = "true"
  DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED = "true"
  EXECUTIONS_MODE = "regular"
  N8N_CONCURRENCY_PRODUCTION_LIMIT = "1"
  EXECUTIONS_DATA_SAVE_ON_SUCCESS = "none"
  EXECUTIONS_DATA_SAVE_ON_ERROR = "all"
  EXECUTIONS_DATA_PRUNE = "true"
  EXECUTIONS_DATA_MAX_AGE = "168"
  GENERIC_TIMEZONE = "Asia/Kuala_Lumpur"
  TZ = "Asia/Kuala_Lumpur"
  # Heap cap below the 1 GB VM so memory exhaustion is a clean restart, not an OOM kill.
  NODE_OPTIONS = "--max-old-space-size=700"
  # No volume: workflows, credentials and executions live in the agent_n8n schema, and
  # N8N_ENCRYPTION_KEY is a secret. A root-owned Fly volume would break the `node` user.
  # Required secret DB_POSTGRESDB_SSL_CA (Supabase CA PEM): TLS rejects unauthorized certs.

[deploy]
  strategy = "immediate"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[[restart]]
  policy = "always"

[checks.n8n]
  type = "http"
  port = 5678
  path = "/healthz/readiness"
  interval = "30s"
  timeout = "5s"
  # First boot runs ~140 migrations (90-155 s on a fast local machine).
  grace_period = "300s"
