<!doctype html>
<html lang="en-MY">
<head>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("omnexa-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Admin · Omnexa</title>
  <link rel="stylesheet" href="assets/css/admin-portal.css">
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/platform-admin-api.js" defer></script>
  <script src="assets/js/admin-portal.js" defer></script>
    <link rel="stylesheet" href="assets/css/app-preferences.css">
    <script defer src="assets/js/app-preferences.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <section id="access-state" class="access-state" aria-live="polite" aria-busy="true"><h1>Checking access</h1><p>Confirming your Admin role and assigned permissions.</p></section>
  <div id="admin-app" class="app-shell" hidden>
    <aside class="sidebar" aria-label="Admin workspace">
      <a class="brand" href="#dashboard" aria-label="Omnexa Admin dashboard"><svg class="brand-mark" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M8.2 5h11.4l-3.6 4.7H4.6z" fill="currentColor"/><path d="M6.4 11.7h11.4l-3.6 4.7H2.8z" fill="currentColor"/><path d="M4.6 18.4h11.4l-3.6 4.7H1z" fill="currentColor"/></svg><span>Omnexa</span><span class="workspace-tag">Admin</span></a>
      <button class="search-trigger" data-action="search"><span class="search-icon" aria-hidden="true">⌕</span><span>Search workspace</span><kbd>Ctrl K</kbd></button>
      <div class="nav-label">Workspace</div><nav id="navigation" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom"><div class="scope-caption">Platform operations</div><button class="account-button" data-action="profile"><span class="avatar" aria-hidden="true">A</span><span><strong id="account-role">Admin</strong><small id="account-email"></small></span><span class="account-arrow" aria-hidden="true">⌃</span></button></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb"><button class="mobile-menu icon-button" data-action="menu" aria-label="Toggle navigation" aria-expanded="false">☰</button><span class="muted">Workspace</span><span class="slash">/</span><span id="page-name">Dashboard</span></div><div class="topbar-right"><span class="role-chip"><span class="role-dot"></span>Admin portal</span><button class="icon-button" data-action="help" aria-label="About the Admin portal">?</button></div></header>
      <main id="main" tabindex="-1" data-platform-sensitive></main>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
