<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI CHATBOT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --bg: #030816;
            --card-bg: rgba(15, 23, 42, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Elements */
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
            animation: float 20s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
        }

        .blob-1 { top: -10%; left: -10%; }
        .blob-2 { bottom: -10%; right: -10%; background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%); }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.1); }
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
            animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), #10b981);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 10px 30px var(--primary-glow);
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 20px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.4);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .btn-login {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .btn-login:active { transform: translateY(0); }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            position: absolute;
            left: 50%;
            margin-left: -10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-login.loading .btn-text { visibility: hidden; }
        .btn-login.loading .loader { display: block; }

        .footer-links {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover { text-decoration: underline; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: var(--text-dim);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .btn-google {
            width: 100%;
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s;
            font-family: 'Outfit', sans-serif;
        }
        .btn-google:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        /* Modal overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 36px;
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.3s ease;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .modal-box h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .modal-box p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn-confirm {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Outfit', sans-serif;
            position: relative;
        }
        .btn-confirm:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--primary-glow); }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-container">
        <div class="logo-area">
            <div class="logo-icon">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path><path d="M12 6v6l4 2"></path></svg>
            </div>
            <div class="logo-text">AI CHATBOT</div>
            <p style="color: var(--text-dim); margin-top: 8px; font-size: 0.9rem;">Sign in to your weightless dashboard</p>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@company.com" required autocomplete="off">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px; font-size: 0.85rem; padding: 0 4px;">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                    <input type="checkbox" style="width:16px; height:16px;"> Remember me
                </label>
                <a href="forgot.html" style="color: var(--text-dim); text-decoration:none;">Forgot?</a>
            </div>

            <button type="submit" class="btn-login" id="login-btn">
                <span class="btn-text">Get Started</span>
                <div class="loader"></div>
            </button>
        </form>

        <div class="divider">or continue with</div>

        <button class="btn-google" id="btn-google-login" onclick="handleGoogleLogin()">
            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
            Continue with Google
        </button>

        <div class="footer-links" style="margin-top: 20px;">
            Don't have an account? <a href="register.html">Create one free</a>
        </div>
    </div>

    <!-- Company Name Modal for new Google users -->
    <div class="modal-overlay" id="company-modal">
        <div class="modal-box">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
                <div style="width:42px;height:42px;background:linear-gradient(135deg,var(--primary),#10b981);border-radius:12px;display:flex;align-items:center;justify-content:center;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                </div>
                <h3>One last step 🎉</h3>
            </div>
            <p>Welcome! Since you're new here, please enter your company name to set up your workspace.</p>
            <div class="input-group" style="margin-bottom:20px;">
                <label>Company Name</label>
                <input type="text" id="modal-company-name" placeholder="Your Company Sdn Bhd" style="border-radius:14px;">
            </div>
            <button class="btn-confirm" id="btn-confirm-company" onclick="submitGoogleWithCompany()">
                <span class="btn-confirm-text">Complete Sign Up</span>
                <div class="loader" id="confirm-loader" style="position:absolute;left:50%;margin-left:-10px;"></div>
            </button>
            <button onclick="closeCompanyModal()" style="width:100%;background:none;border:none;color:var(--text-dim);padding:12px;cursor:pointer;font-family:inherit;margin-top:8px;">Cancel</button>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = loginForm.querySelector('input[type="email"]').value;
            const password = loginForm.querySelector('input[type="password"]').value;

            loginBtn.classList.add('loading');

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    if (result.status === "unverified") {
                        sessionStorage.setItem("pending_verification_email", result.email || email);
                        alert(result.message);
                        window.location.href = "verify-email.html";
                        return;
                    }
                    alert(result.error || result.message || "Login failed");
                    loginBtn.classList.remove('loading');
                    return;
                }

                sessionStorage.setItem("isLoggedIn", "true");
                sessionStorage.setItem("user", JSON.stringify(result.user));
                if (result.token) {
                    sessionStorage.setItem("token", result.token);
                }

                window.location.href = "bots.html";

            } catch (error) {
                console.error("Login error:", error);
                alert("Cannot connect to server");
                loginBtn.classList.remove('loading');
            }
        });

        // ---- Google OAuth Logic ----
        let _pendingGoogleCredential = null;

        function handleGoogleLogin() {
            if (typeof google === 'undefined' || !google.accounts) {
                alert('Google Sign-In is not configured yet.\n\nPlease add your GOOGLE_CLIENT_ID to the .env file and set data-client_id on the Google script tag.');
                return;
            }
            google.accounts.id.prompt();
        }

        function onGoogleCredentialResponse(response) {
            sendGoogleCredential(response.credential, null);
        }

        async function sendGoogleCredential(credential, companyName) {
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential, company_name: companyName || '' })
                });
                const result = await res.json();

                if (result.status === 'needs_company') {
                    // Store credential and show modal
                    _pendingGoogleCredential = result.google_credential;
                    document.getElementById('company-modal').classList.add('open');
                    setTimeout(() => document.getElementById('modal-company-name').focus(), 100);
                    return;
                }

                if (result.status === 'success') {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('user', JSON.stringify(result.user));
                    sessionStorage.setItem('token', result.token);
                    window.location.href = 'bots.html';
                } else {
                    alert(result.message || 'Google sign-in failed. Please try again.');
                }
            } catch (err) {
                console.error('Google auth error:', err);
                alert('Cannot connect to server. Please try again.');
            }
        }

        async function submitGoogleWithCompany() {
            const companyName = document.getElementById('modal-company-name').value.trim();
            if (!companyName) {
                document.getElementById('modal-company-name').focus();
                return;
            }
            const btn = document.getElementById('btn-confirm-company');
            btn.querySelector('.btn-confirm-text').style.visibility = 'hidden';
            btn.querySelector('#confirm-loader').style.display = 'block';
            btn.disabled = true;

            await sendGoogleCredential(_pendingGoogleCredential, companyName);

            btn.querySelector('.btn-confirm-text').style.visibility = '';
            btn.querySelector('#confirm-loader').style.display = 'none';
            btn.disabled = false;
        }

        function closeCompanyModal() {
            document.getElementById('company-modal').classList.remove('open');
            _pendingGoogleCredential = null;
        }

        // Allow Enter key in company modal
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('modal-company-name').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') submitGoogleWithCompany();
            });
        });
    </script>

    <!-- Google Identity Services - replace YOUR_CLIENT_ID with your actual Client ID from .env -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <div id="g_id_onload"
         data-client_id="1025611640095-0hl6fnsdmst9vc188sgckq9rika09h70.apps.googleusercontent.com"
         data-callback="onGoogleCredentialResponse"
         data-auto_prompt="false">
    </div>
</body>
</html>
