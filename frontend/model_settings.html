<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Behaviour Studio | Omnexa</title>
    <meta name="robots" content="noindex">
</head>
<body>
    <!-- Tune AI, Message Style and Test Bot were merged into the Behaviour
         Studio on 2026-08-18. This stub keeps old links, bookmarks and the
         sidebar's previous entries working; it carries bot_id through and
         replaces the history entry so Back does not bounce. -->
    <p>Opening the Behaviour Studio&hellip; <a id="go" href="behaviour.html?tab=model">Continue</a></p>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var botId = params.get("bot_id") || sessionStorage.getItem("selectedBotId") || "";
            var target = "behaviour.html?tab=model" + (botId ? "&bot_id=" + encodeURIComponent(botId) : "");
            document.getElementById("go").href = target;
            window.location.replace(target);
        })();
    </script>
</body>
</html>
