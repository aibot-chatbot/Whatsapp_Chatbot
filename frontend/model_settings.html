<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Provider Settings | AI Chatbot</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared-glass.css">
    <script src="assets/js/shared-ui.js"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --bg: #050b18;
            --sidebar-bg: rgba(15, 23, 42, 0.8);
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        .main-container {
            flex-grow: 1;
            padding: 50px 60px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .header p {
            color: var(--text-dim);
            margin-top: 8px;
        }

        /* ===== Glass Cards (from shared-glass.css) ===== */

        .form-group {
            margin-bottom: 30px;
        }

        .form-group label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        .form-group p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        select,
        input[type="text"] {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s;
        }

        select:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: var(--primary);
        }

        .temp-value {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent);
            min-width: 40px;
        }

        .save-btn {
            background: linear-gradient(135deg, var(--primary), #2563eb);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 25px var(--primary-glow);
            width: 100%;
            margin-top: 20px;
        }

        .save-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px var(--primary-glow);
        }

        .save-btn:active {
            transform: translateY(0);
        }

        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 20px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .status-success {
            color: var(--accent);
        }

        .status-error {
            color: #ef4444;
        }
    </style>
</head>

<body>
    <script src="sidebar-component.js"></script>
    <chatbot-sidebar></chatbot-sidebar>

    <main class="main-container">
        <div class="header">
            <h1>AI Provider Settings</h1>
            <p>Configure the brain of your chatbot. Select the best model for your needs.</p>
        </div>

                <div id="plan-info" class="glass-card" style="margin-bottom:20px;padding:16px 20px;display:none;">
            <div style="display:flex;align-items:center;gap:10px;font-size:0.9rem;color:var(--text-dim);">
                <span id="plan-info-text"></span>
            </div>
        </div>
<div class="glass-card" id="configuration-card">
            <div class="form-group">
                <label>AI Provider</label>
                <p>Choose which AI engine will power your chatbot's responses.</p>
                <select id="ai-provider" onchange="onProviderChange()">
                    <option value="deepseek">DeepSeek</option>
                    <option value="openai">ChatGPT / OpenAI</option>
                    <option value="google">Gemini</option>
                    <option value="anthropic">Claude</option>
                    <option value="xai">Grok</option>
                    <option value="qwen">Qwen</option>
                    <option value="mistral">Mistral</option>
                </select>

            </div>

            <div class="form-group">
                <label>Model Name</label>
                <p>Select the specific AI model version for this provider.</p>
                <select id="model-select" onchange="onModelSelectChange()">
                    <!-- Options will be populated by JavaScript -->
                </select>
                <div id="custom-model-container" style="display: none; margin-top: 10px;">
                    <input type="text" id="custom-model-name" placeholder="Enter custom model name (e.g. gpt-4o)">
                </div>
            </div>

            <div class="form-group">
                <label>Temperature (<span id="temp-display">0.7</span>)</label>
                <p>Controls randomness: 0 is precise/deterministic, 1 is creative/varied.</p>
                <div class="slider-container">
                    <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.7"
                        oninput="updateTempDisplay(this.value)">
                    <span class="temp-value" id="temp-val-label">0.7</span>
                </div>
            </div>

            <button class="save-btn" id="save-btn" onclick="saveSettings()">Save Configuration</button>
            <div id="status-msg" class="status-msg"></div>
        </div>
    </main>

    <script src="assets/js/auth.js"></script>
    <script>
        requireLogin();
        requireAdminOrOwner();

        const urlParams = new URLSearchParams(window.location.search);
        const urlBotId = urlParams.get("bot_id");
        const storedBotId = sessionStorage.getItem("selectedBotId");

        let botId = urlBotId;

        if (!urlBotId && storedBotId) {
            window.location.href = `model_settings.html?bot_id=${encodeURIComponent(storedBotId)}`;
            botId = storedBotId;
        }

        if (!botId) {
            window.location.href = "bots.html";
        }

        if (botId) {
            sessionStorage.setItem("selectedBotId", botId);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            if (!botId) {
                return;
            }

            await fetchModelCatalog();
            await fetchSubscriptionAccess();

            await fetchSettings();
        });

        function updateTempDisplay(val) {
            document.getElementById("temp-display").innerText = val;
            document.getElementById("temp-val-label").innerText = val;
        }

                function getBotQuery() { var p = new URLSearchParams(window.location.search); var bId = p.get("bot_id"); return bId ? "?bot_id=" + encodeURIComponent(bId) : ""; }

        let _subscriptionAccess = null;

        let modelOptions = {};
        let modelCatalogReadOnly = false;
        let catalogAccessAllowed = true;
        let catalogDenialReason = null;
        let botLoadFailed = false;

        function setConfigurationControlsDisabled(disabled) {
            const providerSelect = document.getElementById("ai-provider");
            const modelSelect = document.getElementById("model-select");
            const customModel = document.getElementById("custom-model-name");
            const temperature = document.getElementById("temperature");
            const saveBtn = document.getElementById("save-btn");
            if (providerSelect) providerSelect.disabled = disabled;
            if (modelSelect) modelSelect.disabled = disabled;
            if (customModel) customModel.disabled = disabled;
            if (temperature) temperature.disabled = disabled;
            if (saveBtn) saveBtn.disabled = disabled;
        }

        function showBotAccessDeniedState() {
            botLoadFailed = true;
            setConfigurationControlsDisabled(true);

            const card = document.getElementById("configuration-card");
            if (card) card.style.display = "none";

            const planInfo = document.getElementById("plan-info");
            const planInfoText = document.getElementById("plan-info-text");
            if (planInfo) planInfo.style.display = "block";
            if (planInfoText) {
                planInfoText.textContent = "Chatbot not found or you do not have access.";
            }

            const statusMsg = document.getElementById("status-msg");
            if (statusMsg) {
                statusMsg.innerText = "Chatbot not found or you do not have access.";
                statusMsg.className = "status-msg status-error";
                statusMsg.style.display = "block";
            }
        }


        function onProviderChange() {
            if (modelCatalogReadOnly) {
                const modelSelect = document.getElementById("model-select");
                modelSelect.innerHTML = "";
                const deepseekInfo = modelOptions["deepseek"] || {};
                const deepseekModels = deepseekInfo.models || [];
                deepseekModels.forEach(opt => {
                    const el = document.createElement("option");
                    el.value = opt.value;
                    el.textContent = opt.label;
                    modelSelect.appendChild(el);
                });
                if (deepseekModels.length > 0) {
                    modelSelect.value = deepseekModels[0].value;
                }
                onModelSelectChange();
                return;
            }
            const provider = document.getElementById("ai-provider").value;
            const modelSelect = document.getElementById("model-select");
            // Clear current options
            modelSelect.innerHTML = "";
            // Populate new options
            const providerInfo = modelOptions[provider] || {};
            const options = providerInfo.models || [];
            options.forEach(opt => {
                if (!isModelAllowedForAccess(opt)) return;
                const el = document.createElement("option");
                el.value = opt.value;
                el.textContent = opt.label;
                modelSelect.appendChild(el);
            });
            onModelSelectChange();
        }
        function onModelSelectChange() {
            const modelSelect = document.getElementById("model-select");
            const customContainer = document.getElementById("custom-model-container");

            if (modelSelect.value === "custom") {
                customContainer.style.display = "block";
            } else {
                customContainer.style.display = "none";
            }
        }



        async function fetchSubscriptionAccess() {
            try {
                const response = await authenticatedFetch("/api/billing/subscription");
                const result = await response.json();
                if (result.status === "success" && result.data) {
                    _subscriptionAccess = result.data;
                    applyPlanFiltering();
                } else {
                    _subscriptionAccess = null;
                    applyPlanFiltering();
                }
            } catch (error) {
                console.error("Failed to fetch subscription access:", error);
                _subscriptionAccess = null;
                applyPlanFiltering();
            }
        }

        function getMaxModelTier() {
            if (!_subscriptionAccess || !_subscriptionAccess.plan) return null;
            if (_subscriptionAccess.status === "trialing") return null; // trial = DeepSeek only
            return _subscriptionAccess.plan.model_access_tier || "economy";
        }

        function isActiveTrial() {
            return _subscriptionAccess && _subscriptionAccess.status === "trialing";
        }

        function isModelCatalogTrial() {
            return modelCatalogReadOnly;
        }

        function isPaidPlan() {
            if (!_subscriptionAccess || !_subscriptionAccess.plan) return false;
            if (_subscriptionAccess.status !== "active") return false;
            var code = (_subscriptionAccess.plan.code || "").toLowerCase();
            return code === "essential" || code === "advanced" || code === "pro";
        }

        function hasAccessToModels() {
            if (isModelCatalogTrial()) return true;
            return isActiveTrial() || isPaidPlan();
        }

        function isModelAllowedForAccess(model) {
            if (!_subscriptionAccess && !isModelCatalogTrial()) return true; // no data = show all (backend enforces)
            if (isActiveTrial()) {
                // Trial: only DeepSeek models with access "trial_only"
                return model.access === "trial_only";
            }
            if (isPaidPlan()) {
                // Paid: exclude trial_only, filter by tier
                if (model.access === "trial_only") return false;
                var maxTier = getMaxModelTier();
                if (!maxTier) return false;
                var tierRank = { "economy": 0, "standard": 1, "premium": 2 };
                var maxRank = tierRank[maxTier] !== undefined ? tierRank[maxTier] : -1;
                var modelRank = tierRank[model.tier] !== undefined ? tierRank[model.tier] : -1;
                return modelRank >= 0 && modelRank <= maxRank;
            }
            // No access: show nothing
            return false;
        }

        function applyPlanFiltering() {
            var planInfo = document.getElementById("plan-info");
            var planInfoText = document.getElementById("plan-info-text");
            var providerSelect = document.getElementById("ai-provider");
            var modelSelect = document.getElementById("model-select");
            var customContainer = document.getElementById("custom-model-container");
            var saveBtn = document.getElementById("save-btn");

            if (planInfo) planInfo.style.display = "block";
            if (customContainer) customContainer.style.display = "none";

            if (!hasAccessToModels()) {
                // No valid subscription, show all but warn
                if (planInfoText) planInfoText.innerHTML = "Your current plan does not include AI model access. <a href='pricing.html" + getBotQuery() + "' style='color:var(--primary);text-decoration:underline;font-weight:600;'>View plans &amp; upgrade &rarr;</a>";
                if (providerSelect) providerSelect.disabled = true;
                if (modelSelect) modelSelect.disabled = true;
                if (saveBtn) saveBtn.disabled = true;
                return;
            }


            if (isModelCatalogTrial()) {
                if (planInfoText) planInfoText.innerHTML = "Trial uses <strong>DeepSeek V4 Flash</strong> only. <a href='pricing.html" + getBotQuery() + "' style='color:var(--primary);text-decoration:underline;font-weight:600;'>View pricing &amp; upgrade &rarr;</a>";
                if (providerSelect) providerSelect.disabled = true;
                if (modelSelect) modelSelect.disabled = true;
                if (customContainer) customContainer.style.display = "none";
                if (!catalogAccessAllowed) {
                    if (saveBtn) saveBtn.disabled = true;
                    if (catalogDenialReason && planInfoText) {
                        planInfoText.innerHTML = catalogDenialReason + " <a href='pricing.html" + getBotQuery() + "' style='color:var(--primary);text-decoration:underline;font-weight:600;'>View plans &amp; upgrade &rarr;</a>";
                    }
                } else {
                    if (saveBtn) saveBtn.disabled = false;
                }
                populateProviderDropdown();
                if (providerSelect && providerSelect.options.length > 1) {
                    providerSelect.selectedIndex = 1;
                    onProviderChange();
                }
                return;
            }
            if (providerSelect) providerSelect.disabled = false;
            if (modelSelect) modelSelect.disabled = false;
            if (saveBtn) saveBtn.disabled = false;

            if (isActiveTrial()) {
                if (planInfoText) planInfoText.innerHTML = "Trial uses <strong>DeepSeek AI</strong> only. <a href='pricing.html" + getBotQuery() + "' style='color:var(--primary);text-decoration:underline;font-weight:600;'>View pricing &amp; upgrade &rarr;</a>";
                if (customContainer) customContainer.style.display = "none";
            } else if (isPaidPlan()) {
                var planName = _subscriptionAccess.plan.name || "Current";
                var tierName = getMaxModelTier() || "economy";
                var code = (_subscriptionAccess.plan.code || "").toLowerCase();
                var upgradeMsg = "";
                if (code === "essential") {
                    upgradeMsg = " <span style='font-size:0.82rem;color:var(--text-dim);'>Standard models available in <strong>Advanced</strong>. <a href='pricing.html" + getBotQuery() + "' style='color:var(--primary);text-decoration:underline;'>Upgrade &rarr;</a></span>";
                } else if (code === "advanced") {
                    upgradeMsg = " <span style='font-size:0.82rem;color:var(--text-dim);'>Premium models available in <strong>Pro</strong>. <a href='pricing.html" + getBotQuery() + "' style='color:var(--primary);text-decoration:underline;'>Upgrade &rarr;</a></span>";
                }
                if (planInfoText) planInfoText.innerHTML = "<strong>" + planName + "</strong> plan &mdash; model access: <strong>" + tierName.charAt(0).toUpperCase() + tierName.slice(1) + "</strong> tier." + upgradeMsg;
            }

            populateProviderDropdown();
        }
        async function fetchModelCatalog() {
            try {
                const response = await authenticatedFetch("/api/ai-models");
                const result = await response.json();

                if (result.status === "success") {
                    modelOptions = result.data || {};
                    modelCatalogReadOnly = result.read_only === true;
                    catalogAccessAllowed = result.access_allowed !== false;
                    catalogDenialReason = result.denial_reason || null;
                } else {
                    console.error("Failed to load AI model catalog:", result.message);
                }
            } catch (error) {
                console.error("Error loading AI model catalog:", error);
            }
        }

        function populateProviderDropdown() {
            const providerSelect = document.getElementById("ai-provider");
            providerSelect.innerHTML = "";

            const defaultOption = document.createElement("option");
            defaultOption.value = "default";
            defaultOption.textContent = "Select AI Provider (Default)";
            providerSelect.appendChild(defaultOption);

            Object.entries(modelOptions).forEach(([providerKey, providerInfo]) => {
                const option = document.createElement("option");
                option.value = providerKey;
                option.textContent = providerInfo.label || providerKey;
                providerSelect.appendChild(option);
            });
        }


        async function fetchSettings() {
            try {
                const response = await authenticatedFetch(`/api/bots/${botId}`);
                const result = await response.json();

                if (response.status === 403 || response.status === 404 || result.status !== "success") {
                    showBotAccessDeniedState();
                    return;
                }

                if (result.status === "success") {
                    const bot = result.data;

                    if (modelCatalogReadOnly) {
                        // Free/trial: force the enforced provider/model.
                        const providerSelect = document.getElementById("ai-provider");
                        if (providerSelect) providerSelect.value = "deepseek";
                        onProviderChange(); // populates DeepSeek V4 Flash
                        // Temperature is always loaded.
                        const saveBtn = document.getElementById("save-btn");
                        if (!catalogAccessAllowed && saveBtn) {
                            saveBtn.disabled = true;
                            saveBtn.title = catalogDenialReason || "AI access is not available on your current plan.";
                        }
                    } else {
                        if (bot.ai_provider) {
                            document.getElementById("ai-provider").value = bot.ai_provider.toLowerCase();
                        }
                        onProviderChange(); // Populate model list

                        // Try to select the saved model
                        const modelSelect = document.getElementById("model-select");
                        const savedModel = bot.model_name || "";
                        const existingOption = Array.from(modelSelect.options).find(o => o.value === savedModel);
                        if (existingOption) {
                            modelSelect.value = savedModel;
                        } else if (savedModel) {
                            modelSelect.value = "custom";
                            document.getElementById("custom-model-name").value = savedModel;
                        }
                        onModelSelectChange();
                    }

                    if (bot.temperature !== undefined) {
                        document.getElementById("temperature").value = bot.temperature;
                        updateTempDisplay(bot.temperature);
                    }
                }
            } catch (error) {
                console.error("Failed to fetch settings", error);
                showBotAccessDeniedState();
            }
        }

        async function saveSettings() {
            if (botLoadFailed) {
                const statusMsg = document.getElementById("status-msg");
                if (statusMsg) {
                    statusMsg.innerText = "Chatbot not found or you do not have access.";
                    statusMsg.className = "status-msg status-error";
                    statusMsg.style.display = "block";
                }
                return;
            }

            var provider, model_name;
            if (modelCatalogReadOnly) {
                // Free/trial: always submit the enforced values.
                provider = "deepseek";
                model_name = "deepseek-v4-flash";
            } else {
                provider = document.getElementById("ai-provider").value;
                const modelSelectVal = document.getElementById("model-select").value;
                const customModel = document.getElementById("custom-model-name").value.trim();
                model_name = (modelSelectVal === "custom") ? customModel : modelSelectVal;
            }

            const temp = parseFloat(document.getElementById("temperature").value);
            const saveBtn = document.getElementById("save-btn");
            const statusMsg = document.getElementById("status-msg");

            saveBtn.disabled = true;
            saveBtn.innerText = "Saving...";
            statusMsg.style.display = "none";

            try {
                const response = await authenticatedFetch(`/api/bots/${botId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        ai_provider: provider,
                        model_name: model_name,
                        temperature: temp
                    })
                });

                const result = await response.json();

                if (result.status === "success") {
                    statusMsg.innerText = "Settings saved successfully! \u2728";
                    statusMsg.className = "status-msg status-success";
                    window.dispatchEvent(new CustomEvent("recheckBotStatus"));
                } else {
                    statusMsg.innerText = "Failed to save settings: " + result.message;
                    statusMsg.className = "status-msg status-error";
                }
            } catch (error) {
                statusMsg.innerText = "Error connecting to server.";
                statusMsg.className = "status-msg status-error";
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = "Save Configuration";
                statusMsg.style.display = "block";
            }
        }
    </script>
</body>

</html>
