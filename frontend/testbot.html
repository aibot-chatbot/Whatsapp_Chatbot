<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Your Bot | AI CHATBOT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared-glass.css">
    <script src="assets/js/shared-ui.js"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --bg: #050b18;
            --sidebar-bg: rgba(15, 23, 42, 0.8);
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #10b981;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }


        .nav-list { list-style: none; flex-grow: 1; }
        .nav-item { margin-bottom: 8px; }

        .nav-link {
            text-decoration: none;
            color: var(--text-dim);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .nav-link:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-main); transform: translateX(5px); }
        .nav-link.active { background: var(--primary); color: white; box-shadow: 0 4px 20px var(--primary-glow); }

        /* Dropdown Styles */
        .dropdown-container { margin-bottom: 8px; }
        .dropdown-toggle { width: 100%; justify-content: space-between; background: transparent; border: none; cursor: pointer; text-align: left; }
        .dropdown-content { max-height: 0; overflow: hidden; transition: all 0.3s ease-in-out; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
        .dropdown-container.open .dropdown-content { max-height: 500px; margin-top: 8px; padding-bottom: 8px; }
        .chevron { transition: transform 0.3s; opacity: 0.5; }
        .dropdown-container.open .chevron { transform: rotate(180deg); opacity: 1; }
        .sub-link { font-size: 0.9rem; padding: 10px 16px; }

        .logout-btn { margin-top: auto; color: #ef4444; display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; font-weight: 600; border-radius: 12px; transition: background 0.3s; }

        .main-container { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; }
        .chat-interface { flex-grow: 1; display: flex; flex-direction: column; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(10px); margin: 30px; border-radius: 30px; border: 1px solid var(--glass-border); overflow: hidden; }
        .chat-header { padding: 20px 30px; border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .chat-header .status-dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }
        
        .ai-badge {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #60a5fa;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }
        
        .badge-deepseek {
            color: #a855f7;
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
        }

        .badge-openai {
            color: #10b981;
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .badge-google {
            color: #60a5fa;
            border-color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
        }

        .badge-anthropic {
            color: #f97316;
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.1);
        }

        .badge-xai {
            color: #f59e0b;
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.15);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        .badge-qwen {
            color: #06b6d4;
            border-color: #06b6d4;
            background: rgba(6, 182, 212, 0.1);
        }

        .badge-mistral {
            color: #ef4444;
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        @keyframes grok-pulse {
            0% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
            50% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.5); }
            100% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
        }

        .badge-cloudflare { color: #f97316; border-color: #f97316; background: rgba(249, 115, 22, 0.1); }

        .ai-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: currentColor;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }
        .messages-area { flex-grow: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .message { max-width: 80%; padding: 15px 20px; border-radius: 20px; font-size: 0.95rem; line-height: 1.5; }
        .bot { background: rgba(255, 255, 255, 0.05); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--glass-border); }
        .user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px var(--primary-glow); }
        .input-area { padding: 30px; border-top: 1px solid var(--glass-border); display: flex; gap: 15px; }
        .chat-input { flex-grow: 1; background: var(--input-bg); border: 1px solid var(--glass-border); border-radius: 15px; padding: 15px 25px; color: white; outline: none; }
        .send-btn { background: var(--primary); color: white; border: none; padding: 0 25px; border-radius: 15px; cursor: pointer; font-weight: 700; transition: all 0.3s; }
        
        .sim-button {
            background: white;
            color: var(--accent);
            border: 1px solid var(--glass-border);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s;
            width: 100%;
        }
        .sim-button:hover {
            background: #f8fafc;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <script src="sidebar-component.js"></script>
    <chatbot-sidebar></chatbot-sidebar>

    <main class="main-container">
        <div class="chat-interface">
            <div class="chat-header">
                <div class="header-left">
                    <div class="status-dot"></div>
                    <h3 id="bot-header-title" style="font-weight: 600;">Ai Chatbot · Test Instance</h3>
                </div>
                <div id="ai-provider-badge" class="ai-badge" style="display: none;">Gemini</div>
            </div>
            <div class="messages-area" id="chat-messages">
                <div class="message bot">Loading test bot context...</div>
            </div>
            <div class="input-area">
                <input type="text" class="chat-input" id="message-input" placeholder="Type your message here...">
                <button class="send-btn" id="send-btn">Send</button>
            </div>
        </div>
    </main>

    <script src="assets/js/auth.js"></script>
    <script>
        requireLogin();

        const urlParams = new URLSearchParams(window.location.search);
        const urlBotId = urlParams.get("bot_id");
        const storedBotId = sessionStorage.getItem("selectedBotId");

        let selectedBotId = urlBotId;

        if (!urlBotId && storedBotId) {
            window.location.href = `testbot.html?bot_id=${encodeURIComponent(storedBotId)}`;
            selectedBotId = storedBotId;
        }

        if (!selectedBotId) {
            window.location.href = "bots.html";
        }

        if (selectedBotId) {
            sessionStorage.setItem("selectedBotId", selectedBotId);
        }
        console.log("Current Test Bot ID:", selectedBotId);

        const botQuery = `?chatbot_id=${selectedBotId}`;
        let aiModelCatalog = {};

        document.addEventListener('DOMContentLoaded', () => {
            if (!selectedBotId) {
                return;
            }

            initSidebar();

            const sendBtn = document.getElementById('send-btn');
            const input = document.getElementById('message-input');
            const messages = document.getElementById('chat-messages');
            const chatHeader = document.getElementById('bot-header-title');
            const providerBadge = document.getElementById('ai-provider-badge');

            window.simulateButtonClick = function(btnText) {
                const inputField = document.getElementById('message-input');
                const sendButton = document.getElementById('send-btn');
                inputField.value = btnText;
                sendButton.click();
            };

            function appendMessage(role, text, isHtml = false) {
                const msg = document.createElement('div');
                msg.className = `message ${role}`;

                let htmlContent = text;

                // Parse [BUTTON: X] for bot messages
                if (role === 'bot' && !isHtml && text) {
                    const buttonRegex = /\[BUTTON:\s*(.*?)\]/g;
                    let buttons = [];
                    let match;
                    while ((match = buttonRegex.exec(text)) !== null) {
                        buttons.push(match[1].trim());
                    }
                    
                    htmlContent = text.replace(buttonRegex, '').trim();
                    htmlContent = htmlContent.replace(/\n/g, '<br>');

                    if (buttons.length > 0) {
                        htmlContent += '<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">';
                        buttons.forEach(btn => {
                            const safeBtn = btn.replace(/'/g, "\\'");
                            htmlContent += `<button class="sim-button" onclick="window.simulateButtonClick('${safeBtn}')">${btn}</button>`;
                        });
                        htmlContent += '</div>';
                    }
                    isHtml = true;
                }

                if (isHtml) {
                    msg.innerHTML = htmlContent;
                } else {
                    msg.innerText = htmlContent;
                }

                messages.appendChild(msg);
                messages.scrollTop = messages.scrollHeight;
            }

            async function loadModelCatalog() {
                try {
                    const response = await authenticatedFetch("/api/ai-models");
                    const result = await response.json();

                    if (result.status === "success") {
                        aiModelCatalog = result.data || {};
                    }
                } catch (error) {
                    console.error("Failed to load AI model catalog:", error);
                }
            }

            function getProviderLabel(providerKey) {
                const provider = aiModelCatalog[providerKey];
                return provider?.label || providerKey;
            }

            function getModelLabel(providerKey, modelValue) {
                const provider = aiModelCatalog[providerKey];

                if (!provider || !provider.models) {
                    return modelValue || "default";
                }

                const model = provider.models.find(item => item.value === modelValue);
                return model?.label || modelValue || "default";
            }

            async function loadContext() {
                try {
                    const response = await authenticatedFetch(`/api/testbot/context${botQuery}`);
                    const data = await response.json();

                    messages.innerHTML = "";

                    if (data.status === 'success') {
                        const ctx = data.data || {};
                        const botName = ctx.bot_name || 'AI Chatbot';
                        const activeProfile = ctx.active_profile || 'No active profile';
                        const activePdf = ctx.active_pdf || 'No active PDF';

                        const selectedBotRes = await authenticatedFetch(`/api/bots/${selectedBotId}`);
                        const selectedBotData = await selectedBotRes.json();
                        const selectedBotName = selectedBotData.status === "success"
                            ? selectedBotData.data.bot_name
                            : "Selected Bot";

                        chatHeader.textContent = `${botName}`;
                        if (selectedBotData.status === "success" && selectedBotData.data.ai_provider) {
                            const provider = selectedBotData.data.ai_provider;
                            const modelName = selectedBotData.data.model_name;

                            const providerLabel = getProviderLabel(provider);
                            const modelLabel = getModelLabel(provider, modelName);

                            providerBadge.textContent = `${providerLabel} · ${modelLabel}`;
                            
                            // Reset classes
                            providerBadge.className = 'ai-badge';
                            
                            // Add provider-specific class
                            const pLower = provider.toLowerCase();
                            if (pLower === 'deepseek') providerBadge.classList.add('badge-deepseek');
                            else if (pLower === 'openai') providerBadge.classList.add('badge-openai');
                            else if (pLower === 'google') providerBadge.classList.add('badge-google');
                            else if (pLower === 'anthropic') providerBadge.classList.add('badge-anthropic');
                            else if (pLower === 'xai') providerBadge.classList.add('badge-xai');
                            else if (pLower === 'qwen') providerBadge.classList.add('badge-qwen');
                            else if (pLower === 'mistral') providerBadge.classList.add('badge-mistral');
                            
                            providerBadge.style.display = 'flex';
                        }

                        appendMessage(
                            'bot',
                            `<strong>Active Profile:</strong> ${activeProfile}<br><strong>Active PDF:</strong> ${activePdf}`,
                            true
                        );

                        // Auto-load welcome message
                        if (selectedBotData.status === "success" && selectedBotData.data.welcome_message) {
                            setTimeout(() => {
                                appendMessage('bot', selectedBotData.data.welcome_message, false);
                            }, 500);
                        }
                    } else {
                        appendMessage('bot', data.message || 'Failed to load bot context.');
                    }
                } catch (error) {
                    messages.innerHTML = "";
                    appendMessage('bot', 'Failed to load bot context from backend.');
                }
            }

            async function sendMessage() {
                const text = input.value.trim();
                if (!text) return;

                appendMessage('user', text);
                input.value = '';
                sendBtn.disabled = true;
                input.disabled = true;

                const loadingMsg = document.createElement('div');
                loadingMsg.className = 'message bot';
                loadingMsg.innerText = 'Typing...';
                messages.appendChild(loadingMsg);
                messages.scrollTop = messages.scrollHeight;

                try {
                    const response = await authenticatedFetch(`/api/testbot/chat${botQuery}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: text
                        })
                    });

                    const data = await response.json();
                    loadingMsg.remove();

                    if (data.status === 'success') {
                        appendMessage('bot', data.data?.reply || 'No reply received.');
                    } else {
                        appendMessage('bot', data.message || 'Failed to get response.');
                    }
                } catch (error) {
                    loadingMsg.remove();
                    appendMessage('bot', 'Failed to connect to backend.');
                } finally {
                    sendBtn.disabled = false;
                    input.disabled = false;
                    input.focus();
                }
            }

            if (sendBtn) sendBtn.addEventListener('click', sendMessage);
            if (input) {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') sendMessage();
                });
            }

            loadModelCatalog().then(() => {
                loadContext();
            });
        });

        function toggleDropdown(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.toggle('open');
            }
        }

        function initSidebar() {
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            const navLinks = document.querySelectorAll('.nav-link');

            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });

            if (['linksdocs.html', 'prompt.html', 'training.html'].includes(currentPath)) {
                const drop = document.getElementById('training-dropdown');
                if (drop) drop.classList.add('open');
            }

            if (['behaviour.html', 'testbot.html'].includes(currentPath)) {
                const drop = document.getElementById('behaviour-dropdown');
                if (drop) drop.classList.add('open');
            }
        }
    </script>
</body>
</html>
