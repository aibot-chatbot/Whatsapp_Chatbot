<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | AI CHATBOT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --bg: #030816;
            --card-bg: rgba(15, 23, 42, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
            animation: float 20s infinite alternate;
        }
        .blob-1 { top: -10%; left: -10%; }
        .blob-2 { bottom: -10%; right: -10%; background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%); }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .verify-container {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
            text-align: center;
        }

        .icon-box {
            width: 64px;
            height: 64px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--primary);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: var(--primary);
        }

        h2 { font-size: 1.8rem; margin-bottom: 8px; }
        p { color: var(--text-dim); margin-bottom: 30px; font-size: 0.95rem; }

        .otp-inputs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .otp-inputs input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: white;
            outline: none;
            transition: all 0.3s;
        }

        .otp-inputs input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .btn-verify {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-verify:hover { transform: translateY(-2px); box-shadow: 0 10px 25px var(--primary-glow); }
        .btn-verify:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .resend-box { margin-top: 24px; font-size: 0.9rem; color: var(--text-dim); }
        .resend-box a { color: var(--primary); text-decoration: none; font-weight: 600; cursor: pointer; }
        .resend-box a.disabled { opacity: 0.5; pointer-events: none; }
        @media (max-width: 480px) {
            body {
                overflow: auto;
            }
            .verify-container {
                padding: 24px 20px;
                border-radius: 24px;
                max-width: calc(100% - 24px);
                margin: 16px auto;
            }
            .otp-inputs {
                gap: 6px;
            }
            .otp-inputs input {
                width: 40px;
                height: 50px;
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="verify-container">
        <div class="icon-box">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        </div>
        <h2>Verify your email</h2>
        <p>We've sent a 6-digit code to <br><strong id="user-email" style="color: white;">...</strong></p>

        <form id="otp-form">
            <div class="otp-inputs">
                <input type="text" maxlength="1" pattern="\d*" inputmode="numeric" required>
                <input type="text" maxlength="1" pattern="\d*" inputmode="numeric" required>
                <input type="text" maxlength="1" pattern="\d*" inputmode="numeric" required>
                <input type="text" maxlength="1" pattern="\d*" inputmode="numeric" required>
                <input type="text" maxlength="1" pattern="\d*" inputmode="numeric" required>
                <input type="text" maxlength="1" pattern="\d*" inputmode="numeric" required>
            </div>

            <button type="submit" class="btn-verify" id="verify-btn">Verify Account</button>
        </form>

        <div class="resend-box">
            Didn't receive the code? <br>
            <a id="resend-link" onclick="resendOTP()">Resend Code</a> <span id="timer"></span>
        </div>
    </div>

    <script>
        const email = sessionStorage.getItem("pending_verification_email");
        if (!email) {
            window.location.href = "register.html";
        }
        document.getElementById("user-email").innerText = email;

        const inputs = document.querySelectorAll('.otp-inputs input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        document.getElementById('otp-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = Array.from(inputs).map(i => i.value).join('');
            const btn = document.getElementById('verify-btn');
            btn.disabled = true;
            btn.innerText = "Verifying...";

            try {
                const response = await fetch("/api/auth/verify-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, otp })
                });

                const result = await response.json();
                if (response.ok) {
                    alert("Email verified successfully! You can now login.");
                    window.location.href = "login.html";
                } else {
                    alert(result.message || "Verification failed");
                    btn.disabled = false;
                    btn.innerText = "Verify Account";
                }
            } catch (err) {
                alert("Server error");
                btn.disabled = false;
                btn.innerText = "Verify Account";
            }
        });

        let timeLeft = 60;
        function startTimer() {
            const link = document.getElementById('resend-link');
            const timer = document.getElementById('timer');
            link.classList.add('disabled');
            const interval = setInterval(() => {
                timeLeft--;
                timer.innerText = `in ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    link.classList.remove('disabled');
                    timer.innerText = "";
                    timeLeft = 60;
                }
            }, 1000);
        }
        startTimer();

        async function resendOTP() {
            try {
                await fetch("/api/auth/resend-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                alert("New code sent!");
                startTimer();
            } catch (err) {
                alert("Failed to resend");
            }
        }
    </script>
</body>
</html>
