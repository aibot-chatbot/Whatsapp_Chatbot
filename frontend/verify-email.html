<!DOCTYPE html>
<html lang="en">
<head>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("omnexa-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check your email | Omnexa</title>
    <meta name="description" content="Enter the six digit code we sent to confirm your Omnexa account.">
    <meta name="robots" content="noindex,follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Geist:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/auth-volleo.css">
    <link rel="stylesheet" href="assets/css/app-preferences.css">
    <script defer src="assets/js/app-preferences.js"></script>
</head>
<body>
    <div class="auth-shell">
        <main class="auth-main">
            <div class="auth-card">
                <a class="auth-brand" href="landing.html"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4.2h9.8l-3.1 4H3.9z" fill="currentColor"/><path d="M5.5 10h9.8l-3.1 4H2.4z" fill="currentColor"/><path d="M4 15.8h9.8l-3.1 4H0.9z" fill="currentColor"/></svg> Omnexa</a>

                <div class="auth-head">
                    <h1>Check your email</h1>
                    <p>We sent a six digit code to <strong id="user-email">...</strong>. It expires in 10 minutes.</p>
                </div>

                <form id="otp-form" aria-describedby="general-message">
                    <div class="input-group">
                        <label for="otp-code">Verification code</label>
                        <div class="otp-inputs">
                            <input type="text" id="otp-code" placeholder="000000" required autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" aria-describedby="general-message">
                        </div>
                    </div>

                    <div id="general-message" class="login-error" role="alert" aria-live="assertive" aria-atomic="true" style="display: none; border: 1px solid transparent;"></div>

                    <button type="submit" class="btn-auth" id="verify-btn">Verify</button>
                </form>

                <p class="resend-box">
                    Did not get it?
                    <button type="button" id="resend-link" onclick="resendOTP()">Resend code</button> <span id="timer"></span>
                </p>

                <p class="auth-meta"><span>Secure Omnexa auth</span> <span class="auth-meta-ok">TLS 1.3 encrypted</span></p>
            </div>
        </main>
        <aside class="auth-aside">
            <img class="auth-visual" src="https://parjsxypengvubziwwjp.supabase.co/storage/v1/object/public/landing/img/auth-code.webp" alt="" aria-hidden="true" decoding="async" width="540" height="540">
        </aside>
    </div>

    <script src="assets/js/auth-sentry.js"></script>
    <script>
        const email = sessionStorage.getItem("pending_verification_email");
        if (!email) {
            window.location.href = "register.html";
        }
        document.getElementById("user-email").innerText = email;

        function showMessage(msg, isError = true) {
            const el = document.getElementById('general-message');
            el.innerHTML = (isError ? '⚠️ ' : '✅ ') + msg;
            el.style.color = isError ? '#F87171' : '#34D399';
            el.style.background = isError ? 'rgba(239, 68, 68, 0.1)' : 'rgba(16, 185, 129, 0.1)';
            el.style.borderColor = isError ? 'rgba(239, 68, 68, 0.3)' : 'rgba(16, 185, 129, 0.3)';
            el.style.display = 'block';
        }

        const inputs = document.querySelectorAll('.otp-inputs input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                document.getElementById('general-message').style.display = 'none';
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        document.getElementById('otp-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('general-message').style.display = 'none';
            const otp = Array.from(inputs).map(i => i.value).join('');
            const btn = document.getElementById('verify-btn');
            btn.disabled = true;
            btn.innerText = "Verifying...";

            try {
                const response = await fetch("/api/auth/verify-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, otp })
                });

                const result = await response.json();
                if (response.ok) {
                    showMessage("Email verified successfully! You can now login.", false);
                    btn.innerText = "Redirecting...";
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);
                } else {
                    showMessage(result.message || "Verification failed");
                    btn.disabled = false;
                    btn.innerText = "Verify Account";
                }
            } catch (err) {
                showMessage("Server error");
                btn.disabled = false;
                btn.innerText = "Verify Account";
            }
        });

        let timeLeft = 60;
        function startTimer() {
            const link = document.getElementById('resend-link');
            const timer = document.getElementById('timer');
            link.classList.add('disabled');
            const interval = setInterval(() => {
                timeLeft--;
                timer.innerText = `in ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    link.classList.remove('disabled');
                    timer.innerText = "";
                    timeLeft = 60;
                }
            }, 1000);
        }
        startTimer();

        async function resendOTP() {
            try {
                await fetch("/api/auth/resend-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                showMessage("New code sent!", false);
                startTimer();
            } catch (err) {
                showMessage("Failed to resend code");
            }
        }
    </script>
</body>
</html>
