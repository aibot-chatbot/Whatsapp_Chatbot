<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing | AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared-glass.css">
    <script src="assets/js/shared-ui.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-rgb: 59, 130, 246;
            --bg: #050b18;
            --sidebar-bg: rgba(15, 23, 42, 0.8);
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 100% 100%, rgba(59,130,246,0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 0%, rgba(16,185,129,0.1) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }
        .main-container { flex-grow: 1; padding: 50px 60px; max-width: 100%; width: 100%; }
        .header { margin-bottom: 24px; }
        .header h1 { font-size: 1.7rem; font-weight: 700; }
        .header p { color: var(--text-dim); margin-top: 6px; font-size: 0.95rem; }
        .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 30px; }
        .plan-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 28px 24px;
            backdrop-filter: blur(12px);
            transition: all 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .plan-card:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
        .plan-card.current-plan { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary), 0 4px 24px rgba(59,130,246,0.15); }
        .plan-badge {
            position: absolute; top: -10px; right: 20px;
            background: var(--primary); color: white;
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            padding: 4px 12px; border-radius: 20px; letter-spacing: 0.5px;
        }
        .plan-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
        .plan-price { font-size: 1.8rem; font-weight: 700; margin: 8px 0 4px; }
        .plan-price .interval { font-size: 0.85rem; font-weight: 400; color: var(--text-dim); }
        .plan-price .free-text { font-size: 1.2rem; color: var(--accent); }
        .plan-desc { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 16px; }
        .plan-features { list-style: none; flex-grow: 1; margin-bottom: 20px; }
        .plan-features li {
            padding: 8px 0; font-size: 0.88rem;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .plan-features li:last-child { border-bottom: none; }
        .plan-features .check { color: var(--accent); flex-shrink: 0; }
        .plan-features .cross { color: var(--text-dim); opacity: 0.4; flex-shrink: 0; }
        .plan-features .label { color: var(--text-dim); font-size: 0.78rem; }
        .plan-footer { margin-top: auto; }
        .btn-upgrade {
            display: block; width: 100%; text-align: center;
            padding: 12px; border-radius: 12px; border: none;
            font-weight: 600; font-size: 0.9rem; cursor: pointer;
            transition: all 0.15s; text-decoration: none;
        }
        .btn-upgrade.primary-bg {
            background: var(--primary); color: white;
        }
        .btn-upgrade.primary-bg:hover { background: #2563eb; }
        .btn-upgrade.current {
            background: rgba(255,255,255,0.06); color: var(--text-dim);
            cursor: default; border: 1px solid var(--glass-border);
        }
        .btn-upgrade.coming-soon {
            background: rgba(255,255,255,0.04); color: var(--text-dim);
            border: 1px solid var(--glass-border); cursor: default;
            font-size: 0.82rem;
        }
        #pricing-loading, #pricing-error { padding: 40px 0; text-align: center; color: var(--text-dim); }
        #pricing-loading .spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .main-container { padding: 24px 20px; }
            .plans-grid { grid-template-columns: 1fr; }
            .plan-card.current-plan { order: -1; }
        }
    </style>
</head>

<body>
    <chatbot-sidebar></chatbot-sidebar>
    <script src="sidebar-component.js"></script>
    <script src="assets/js/auth.js"></script>

    <div class="main-container">
        <div class="header">
            <h1><i data-lucide="credit-card" style="width:24px;height:24px;vertical-align:middle;margin-right:8px;"></i>Pricing &amp; Plans</h1>
            <p>Compare available plans and features. Upgrade to unlock more capabilities.</p>
        </div>

        <div id="pricing-loading">
            <i data-lucide="loader-2" class="spin" style="width:20px;height:20px;color:var(--primary);"></i>
            <span style="margin-left:8px;">Loading plans...</span>
        </div>
        <div id="pricing-error" style="display:none;">
            Unable to load pricing information. Please try again later.
        </div>
        <div id="pricing-content" style="display:none;">
            <div class="plans-grid" id="plans-grid"></div>
        </div>
    </div>

    <script>
        refreshIcons();

        function formatPrice(price, currency, interval) {
            if (price === null || price === undefined) return '<span class="free-text">Free</span>';
            var num = parseFloat(price);
            if (isNaN(num) || num <= 0) return '<span class="free-text">Free</span>';
            var curr = currency || "MYR";
            var intv = interval || "monthly";
            var label = intv.charAt(0).toUpperCase() + intv.slice(1);
            return "RM " + num.toFixed(2) + ' <span class="interval">/ ' + label + "</span>";
        }

        function formatLimit(val, isStorage) {
            if (val === null || val === undefined) return "Unlimited";
            if (isStorage) {
                if (val >= 1073741824) return (val / 1073741824).toFixed(0) + " GB";
                if (val >= 1048576) return (val / 1048576).toFixed(0) + " MB";
                if (val >= 1024) return (val / 1024).toFixed(0) + " KB";
                return val + " B";
            }
            return val;
        }

        function formatAiCredit(microMyr) {
            if (microMyr === null || microMyr === undefined) return "None";
            var myr = (Number(microMyr) / 1000000).toFixed(2);
            if (myr <= 0) return "None";
            return "RM " + myr;
        }

        function buildFeatureItem(label, value, isStorage) {
            var display = formatLimit(value, isStorage);
            var icon = (value !== null && value !== undefined && value > 0) ? "check" : "cross";
            return '<li><span class="' + icon + '"><i data-lucide="' + icon + '" style="width:16px;height:16px;"></i></span> ' + display + ' <span class="label">' + label + "</span></li>";
        }

        function buildFlagItem(key, enabled) {
            var label = key.replace(/_/g, " ").replace(/\b\w/g, function(l) { return l.toUpperCase(); });
            var icon = enabled ? "check" : "cross";
            return '<li><span class="' + icon + '"><i data-lucide="' + icon + '" style="width:16px;height:16px;"></i></span> ' + label + "</li>";
        }

        function getBotQuery() { var p = new URLSearchParams(window.location.search); var bId = p.get("bot_id"); return bId ? "?bot_id=" + encodeURIComponent(bId) : ""; }

        async function loadPricing() {
            var loading = document.getElementById("pricing-loading");
            var errorDiv = document.getElementById("pricing-error");
            var contentDiv = document.getElementById("pricing-content");
            var grid = document.getElementById("plans-grid");

            try {
                // Fetch plans and current subscription in parallel
                var plansRes = await authenticatedFetch("/api/billing/plans");
                var plansJson = await plansRes.json();
                var plans = plansJson.status === "success" ? (plansJson.data || []) : [];

                var subRes = await authenticatedFetch("/api/billing/subscription");
                var subJson = await subRes.json();
                var subscription = subJson.status === "success" ? subJson.data : null;
                var currentPlanCode = subscription && subscription.plan ? (subscription.plan.code || "").toLowerCase() : null;

                if (loading) loading.style.display = "none";
                if (plans.length === 0) {
                    if (errorDiv) { errorDiv.style.display = "block"; errorDiv.textContent = "No plans available."; }
                    return;
                }
                if (contentDiv) contentDiv.style.display = "block";

                // Sort plans: Free first, then Essential, Advanced, Pro
                var order = { "free": 0, "essential": 1, "advanced": 2, "pro": 3 };
                plans.sort(function(a, b) { return (order[a.code] || 99) - (order[b.code] || 99); });

                var html = "";
                plans.forEach(function(plan) {
                    var code = (plan.code || "").toLowerCase();
                    var isCurrent = code === currentPlanCode;
                    var name = plan.name || code.charAt(0).toUpperCase() + code.slice(1);
                    var priceHtml = formatPrice(plan.price, plan.currency, plan.billing_interval);
                    var desc = plan.description || "";
                    var features = plan.feature_flags || {};
                    var tier = plan.model_access_tier || "economy";

                    var cardClass = "plan-card" + (isCurrent ? " current-plan" : "");
                    var badgeHtml = isCurrent ? '<div class="plan-badge">Current</div>' : "";

                    var featuresHtml = "";
                    featuresHtml += buildFeatureItem("Chatbots", plan.chatbot_limit, false);
                    featuresHtml += buildFeatureItem("Team Members", plan.team_member_limit, false);
                    featuresHtml += buildFeatureItem("Channels", plan.channel_limit, false);
                    featuresHtml += buildFeatureItem("Knowledge Files", plan.knowledge_file_limit, false);
                    featuresHtml += buildFeatureItem("Knowledge Storage", plan.knowledge_storage_limit_bytes, true);
                    featuresHtml += '<li><span class="check"><i data-lucide="check" style="width:16px;height:16px;"></i></span> Model Tier: <span class="label">' + tier.charAt(0).toUpperCase() + tier.slice(1) + "</span></li>";
                    featuresHtml += "<li><span class='check'><i data-lucide='check' style='width:16px;height:16px;'></i></span> AI Credit: <span class='label'>" + formatAiCredit(plan.included_ai_credit_micro_myr) + "</span></li>";

                    // Feature flags
                    if (typeof features === "object" && features !== null) {
                        Object.keys(features).forEach(function(key) {
                            featuresHtml += buildFlagItem(key, features[key] === true);
                        });
                    }

                    var btnHtml = "";
                    var subStatus = subscription ? (subscription.status || "").toLowerCase() : "";
                    var planRank = { "free": 0, "essential": 1, "advanced": 2, "pro": 3 };
                    var currentRank = isCurrent ? (planRank[code] ?? -1) : -1;
                    var prevCurrentCode = currentPlanCode || "";
                    var prevCurrentRank = planRank[prevCurrentCode] ?? -1;
                    var thisRank = planRank[code] ?? -1;
                    var isFree = code === "free";
                    var isTrialOrNoSub = (subStatus === "trialing" || subStatus === "" || subStatus === null || !subscription);

                    if (isCurrent) {
                        // Current plan card
                        if (code === "free" && subStatus === "trialing") {
                            btnHtml = '<div class="btn-upgrade current">Current Trial</div>';
                        } else {
                            btnHtml = '<div class="btn-upgrade current">Current Plan</div>';
                        }
                    } else if (isFree) {
                        // Free card - only relevant for non-free current users
                        if (isTrialOrNoSub) {
                            btnHtml = '<div class="btn-upgrade coming-soon">Free Plan</div>';
                        } else {
                            btnHtml = '<div class="btn-upgrade coming-soon" style="font-size:0.8rem;">Trial plan for new accounts only</div>';
                        }
                    } else if (subStatus === "past_due" || subStatus === "expired") {
                        // Expired/past due paid user
                        if (thisRank > prevCurrentRank) {
                            btnHtml = '<button class="btn-upgrade primary-bg" onclick="handleUpgrade(\u0027' + code + '\u0027)"><i data-lucide="zap" size="18"></i> Renew &amp; Upgrade</button>';
                        } else if (thisRank < prevCurrentRank) {
                            btnHtml = '<button class="btn-upgrade" style="background:rgba(255,255,255,0.06);color:var(--text-dim);border:1px solid var(--glass-border);border-radius:12px;padding:12px;cursor:pointer;width:100%;" onclick="handleDowngrade(\u0027' + code + '\u0027)">Change on Renewal</button>';
                        } else {
                            btnHtml = '<button class="btn-upgrade primary-bg" onclick="handleUpgrade(\u0027' + code + '\u0027)"><i data-lucide="zap" size="18"></i> Renew Plan</button>';
                        }
                    } else if (prevCurrentRank > 0 && thisRank < prevCurrentRank) {
                        // Paid user looking at lower paid plan
                        btnHtml = '<button class="btn-upgrade" style="background:rgba(255,255,255,0.06);color:var(--text-dim);border:1px solid var(--glass-border);border-radius:12px;padding:12px;cursor:pointer;width:100%;" onclick="handleDowngrade(\u0027' + code + '\u0027)"><i data-lucide="arrow-down" size="18"></i> Downgrade</button>';
                    } else {
                        // Upgrade (trial, free without trial, or paid user looking at higher plan)
                        btnHtml = '<button class="btn-upgrade primary-bg" onclick="handleUpgrade(\u0027' + code + '\u0027)"><i data-lucide="zap" size="18"></i> Upgrade</button>';
                    }
                    html += '<div class="' + cardClass + '">' + badgeHtml +
                        '<div class="plan-name">' + name + "</div>" +
                        '<div class="plan-price">' + priceHtml + "</div>" +
                        '<div class="plan-desc">' + desc + "</div>" +
                        '<ul class="plan-features">' + featuresHtml + "</ul>" +
                        '<div class="plan-footer">' + btnHtml + "</div>" +
                        "</div>";
                });
                grid.innerHTML = html;
                refreshIcons();
            } catch (e) {
                console.error("Failed to load pricing:", e);
                if (loading) loading.style.display = "none";
                if (errorDiv) errorDiv.style.display = "block";
            }
        }


        async function handleDowngrade(planCode) {
            try {
                var res = await authenticatedFetch("/api/billing/subscription/downgrade-check/" + encodeURIComponent(planCode));
                var body = await res.json();
                if (body.status === "success" && body.data) {
                    var d = body.data;
                    if (d.eligible) {
                        alert("Downgrade scheduling is not yet available.\n\nYour plan will remain as-is until the end of your current billing period (" + new Date(d.effective_at).toLocaleDateString() + ").\n\nPlease contact support or manage your plan from your profile page to make changes.");
                    } else {
                        var msg = "Cannot downgrade to " + d.target_plan.charAt(0).toUpperCase() + d.target_plan.slice(1) + ".\n\nThe following resources exceed the target plan limits:\n";
                        d.blocking_items.forEach(function(item) {
                            msg += "\n- " + item.resource.replace(/_/g, " ") + ": " + item.used + " used, limit " + item.limit + " (excess: " + item.excess + ")";
                        });
                        msg += "\n\nNo data will be deleted automatically. Please reduce usage before downgrading.";
                        alert(msg);
                    }
                } else {
                    alert("Downgrade check failed: " + (body.message || "Unknown error"));
                }
            } catch (e) {
                console.error("Downgrade check failed:", e);
                alert("Unable to check downgrade eligibility. Please try again.");
            }
        }

        async function handleUpgrade(planCode) {
            try {
                var res = await authenticatedFetch("/api/billing/subscription/checkout", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ plan_code: planCode })
                });
                var body = await res.json();
                if (body.status === "success" && body.data && body.data.checkout_url) {
                    var checkoutUrl = body.data.checkout_url;
                    var orderRef = body.data.order_reference;
                    if (typeof orderRef === "string" && orderRef.length > 0) {
                        sessionStorage.setItem("pending_subscription_order_reference", orderRef);
                    }
                    if (checkoutUrl.indexOf("http://") === 0 || checkoutUrl.indexOf("https://") === 0) {
                        window.location.assign(checkoutUrl);
                    } else {
                        showPricingError("Invalid checkout URL returned. Please try again.");
                    }
                } else {
                    showPricingError(body.message || "Failed to create checkout. Please try again.");
                }
            } catch (e) {
                console.error("Upgrade failed:", e);
                showPricingError("An unexpected error occurred. Please try again.");
            }
        }

        function showPricingError(msg) {
            var errorDiv = document.getElementById("pricing-error");
            if (errorDiv) {
                errorDiv.textContent = msg;
                errorDiv.style.display = "block";
                setTimeout(function() { errorDiv.style.display = "none"; }, 8000);
            }
        }
        loadPricing();
    </script>
</body>
</html>
