<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox & Escalations | AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared-glass.css">
    <script src="assets/js/shared-ui.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>requireLogin();</script>
    <script src="sidebar-component.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --bg: #050b18;
            --sidebar-bg: rgba(15, 23, 42, 0.82);
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #10b981;
            --input-bg: rgba(15, 23, 42, 0.6);
            --bubble-user: var(--primary);
            --bubble-bot: rgba(30, 41, 59, 0.9);
            --bubble-agent: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            color: var(--text-main); min-height: 100vh; display: flex; overflow: hidden;
        }

        .main-container { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; padding: 30px; gap: 20px; }
        .header h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: -1px; margin-bottom: 8px; }
        .header p { color: var(--text-dim); }
        .split-view { display: flex; flex-grow: 1; gap: 20px; min-height: 0; }

        .inbox-pane {
            width: 380px; background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
        }
        .inbox-header { padding: 20px; border-bottom: 1px solid var(--glass-border); }
        
        .escalation-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .escalation-list::-webkit-scrollbar, .chat-transcript::-webkit-scrollbar { width: 6px; }
        .escalation-list::-webkit-scrollbar-track, .chat-transcript::-webkit-scrollbar-track { background: transparent; }
        .escalation-list::-webkit-scrollbar-thumb, .chat-transcript::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        
        .escalation-item {
            padding: 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s; margin-bottom: 8px;
            display: flex; flex-direction: column; gap: 8px; border: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.1);
        }
        .escalation-item:hover { background: rgba(255, 255, 255, 0.05); }
        .escalation-item.active { background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.4); }
        .esc-top { display: flex; justify-content: space-between; align-items: center; }
        .esc-name { font-weight: 600; font-size: 1.05rem; }
        .esc-intent { font-size: 0.75rem; padding: 2px 8px; border-radius: 20px; background: rgba(239, 68, 68, 0.2); color: #fca5a5; font-weight: 600;}
        .esc-time { font-size: 0.75rem; color: var(--text-dim); }
        .esc-reason { font-size: 0.85rem; color: var(--text-dim); line-height: 1.3; }

        .chat-pane {
            flex-grow: 1; background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .chat-header { padding: 20px 24px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.2); }
        .chat-header-info h3 { font-size: 1.2rem; font-weight: 600; }
        .chat-header-info p { font-size: 0.85rem; color: var(--text-dim); }
        .resolve-btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;}
        .resolve-btn:hover { background: #059669; }

        .chat-transcript { flex-grow: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .empty-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); text-align: center; }

        .message-row { display: flex; width: 100%; }
        .message-row.user { justify-content: flex-end; }
        .message-row.bot { justify-content: flex-start; }
        .message-row.agent { justify-content: flex-end; }
        .message-bubble { max-width: 70%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .message-row.user .message-bubble { background: var(--bubble-user); color: white; border-bottom-right-radius: 4px; }
        .message-row.agent .message-bubble { background: var(--bubble-agent); color: white; border-bottom-right-radius: 4px; }
        .message-row.bot .message-bubble { background: var(--bubble-bot); color: var(--text-main); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }
        .message-sender { font-size: 0.7rem; margin-bottom: 4px; opacity: 0.7; }
        
        .reply-box { padding: 20px; border-top: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); display: flex; gap: 12px; }
        .reply-input { flex-grow: 1; background: var(--input-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px 16px; color: white; font-size: 0.95rem; outline: none; }
        .reply-input:focus { border-color: var(--primary); }
        .send-btn { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .send-btn:hover { background: #2563eb; }

    </style>
</head>
<body>
    <chatbot-sidebar></chatbot-sidebar>
    <main class="main-container">
        <div class="header">
            <h1>Inbox & Escalations</h1>
            <p>Review conversations requiring human assistance and reply directly to customers.</p>
        </div>
        <div class="split-view">
            <div class="inbox-pane">
                <div class="inbox-header">
                    <h3>Pending Escalations</h3>
                </div>
                <div class="escalation-list" id="escalation-list">
                    <div class="empty-state">Loading...</div>
                </div>
            </div>
            <div class="chat-pane" id="chat-pane" style="display: none;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <h3 id="chat-title">Customer</h3>
                        <p id="chat-subtitle">Platform</p>
                    </div>
                    <button class="resolve-btn" onclick="resolveEscalation()">
                        <i data-lucide="check-circle"></i> Mark as Resolved
                    </button>
                </div>
                <div class="chat-transcript" id="chat-transcript"></div>
                <div class="reply-box">
                    <input type="text" id="reply-input" class="reply-input" placeholder="Type your reply to the customer..." onkeypress="handleReplyKey(event)">
                    <button class="send-btn" onclick="sendReply()">
                        <i data-lucide="send"></i> Send
                    </button>
                </div>
            </div>
            <div class="chat-pane empty-state" id="no-chat-selected">
                <i data-lucide="message-square" style="width: 48px; height: 48px; opacity: 0.5; margin-bottom: 16px;"></i>
                <h2>No Conversation Selected</h2>
                <p>Select an escalation from the left to view the history and reply.</p>
            </div>
        </div>
    </main>

    <script>
        let escalations = [];
        let currentEscalation = null;

        const urlParams = new URLSearchParams(window.location.search);
        const urlBotId = urlParams.get("bot_id");
        const storedBotId = sessionStorage.getItem("selectedBotId");
        let selectedBotId = urlBotId;

        if (!urlBotId && storedBotId) {
            window.location.href = `inbox.html?bot_id=${encodeURIComponent(storedBotId)}`;
            selectedBotId = storedBotId;
        }
        if (!selectedBotId) {
            window.location.href = "bots.html";
        }
        if (selectedBotId) {
            sessionStorage.setItem("selectedBotId", selectedBotId);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                lucide.createIcons();
            }
            if (selectedBotId) {
                loadEscalations();
            }
        });

        async function loadEscalations() {
            if (!selectedBotId) return;

            try {
                const res = await authenticatedFetch(`/api/agent/escalations?chatbot_id=${selectedBotId}`);
                const json = await res.json();
                if (json.status === 'success') {
                    escalations = json.data;
                    renderEscalations();
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderEscalations() {
            const list = document.getElementById('escalation-list');
            if (escalations.length === 0) {
                list.innerHTML = `<div class="empty-state">No pending escalations! 🎉</div>`;
                return;
            }

            list.innerHTML = escalations.map(e => {
                const customer = e.conversation?.customer_name || e.conversation?.customer_phone || e.conversation?.platform_user_id || 'Unknown User';
                const date = new Date(e.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const isActive = currentEscalation && currentEscalation.id === e.id ? 'active' : '';
                return `
                    <div class="escalation-item ${isActive}" onclick="selectEscalation(${e.id})">
                        <div class="esc-top">
                            <span class="esc-name">${customer}</span>
                            <span class="esc-intent">${(e.intent || 'unknown').replace('_', ' ').toUpperCase()}</span>
                        </div>
                        <div class="esc-reason">${e.reason || 'Requested human assistance'}</div>
                        <div class="esc-time">${date} &bull; ${e.conversation?.source_channel || 'unknown'}</div>
                    </div>
                `;
            }).join('');
        }

        async function selectEscalation(id) {
            currentEscalation = escalations.find(e => e.id === id);
            renderEscalations();
            document.getElementById('no-chat-selected').style.display = 'none';
            document.getElementById('chat-pane').style.display = 'flex';
            
            const customer = currentEscalation.conversation?.customer_name || currentEscalation.conversation?.customer_phone || 'Unknown User';
            document.getElementById('chat-title').innerText = customer;
            document.getElementById('chat-subtitle').innerText = \`Via \${currentEscalation.conversation?.source_channel || 'Unknown Channel'}\`;
            
            await loadChatHistory(currentEscalation.conversation_id);
        }

        async function loadChatHistory(conversationId) {
            const transcript = document.getElementById('chat-transcript');
            transcript.innerHTML = '<div class="empty-state">Loading history...</div>';

            try {
                const res = await authenticatedFetch(`/api/conversations/${conversationId}/messages?chatbot_id=${selectedBotId}`);
                const json = await res.json();
                if (json.status === 'success') {
                    renderMessages(json.data);
                }
            } catch (err) {
                transcript.innerHTML = '<div class="empty-state">Failed to load history</div>';
            }
        }

        function renderMessages(messages) {
            const transcript = document.getElementById('chat-transcript');
            if (!messages || messages.length === 0) {
                transcript.innerHTML = '<div class="empty-state">No messages found.</div>';
                return;
            }

            transcript.innerHTML = messages.map(msg => {
                let rowClass = 'bot';
                let senderName = 'AI Bot';
                if (msg.role === 'user') { rowClass = 'user'; senderName = 'Customer'; }
                if (msg.role === 'assistant' && msg.metadata?.sent_by === 'human_agent') {
                    rowClass = 'agent'; senderName = 'You (Agent)';
                }
                
                return `
                    <div class="message-row ${rowClass}">
                        <div class="message-bubble">
                            <div class="message-sender">${senderName}</div>
                            ${msg.content}
                        </div>
                    </div>
                `;
            }).join('');
            transcript.scrollTop = transcript.scrollHeight;
        }

        async function sendReply() {
            if (!currentEscalation) return;
            const input = document.getElementById('reply-input');
            const text = input.value.trim();
            if (!text) return;

            input.disabled = true;
            try {
                const res = await authenticatedFetch(`/api/conversations/${currentEscalation.conversation_id}/agent-reply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chatbot_id: selectedBotId,
                        text: text,
                        action_id: currentEscalation.id
                    })
                });
                const json = await res.json();
                if (json.status === 'success') {
                    input.value = '';
                    currentEscalation = null;
                    document.getElementById('no-chat-selected').style.display = 'flex';
                    document.getElementById('chat-pane').style.display = 'none';
                    loadEscalations(); // Refresh list
                } else {
                    alert('Error: ' + json.message);
                }
            } catch (err) {
                alert('Failed to send reply');
            }
            input.disabled = false;
            input.focus();
        }

        async function resolveEscalation() {
            if (!currentEscalation) return;
            try {
                const res = await authenticatedFetch(`/api/agent/escalations/${currentEscalation.id}/resolve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatbot_id: selectedBotId })
                });
                const json = await res.json();
                if (json.status === 'success') {
                    currentEscalation = null;
                    document.getElementById('no-chat-selected').style.display = 'flex';
                    document.getElementById('chat-pane').style.display = 'none';
                    loadEscalations();
                }
            } catch (err) {}
        }

        function handleReplyKey(e) {
            if (e.key === 'Enter') sendReply();
        }

        if (selectedBotId) loadEscalations();
    </script>
</body>
</html>
