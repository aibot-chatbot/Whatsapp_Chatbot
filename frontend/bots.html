<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bots | AI Chatbot</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        .sidebar {
    width: 280px;
    background: var(--sidebar-bg);
    backdrop-filter: blur(20px);
    border-right: 1px solid var(--glass-border);
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 40px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-list {
            list-style: none;
            flex-grow: 1;
        }

        .nav-item {
            margin-bottom: 8px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dim);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
            font-weight: 500;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transform: translateX(5px);
        }

        .nav-link.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .dropdown-container {
            margin-bottom: 8px;
        }

        .dropdown-content {
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease-in-out;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dropdown-container.open .dropdown-content {
            max-height: 500px;
            margin-top: 8px;
            padding-bottom: 8px;
        }

        .sub-link {
            font-size: 0.9rem;
            padding: 10px 16px;
        }

        .logout-btn {
            margin-top: auto;
            color: #ef4444;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            text-decoration: none;
            font-weight: 600;
            border-radius: 12px;
        }
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --bg: #050b18;
            --sidebar-bg: rgba(15, 23, 42, 0.8);
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        .main-container {
            flex-grow: 1;
            padding: 50px 60px;
            max-width: 1400px;
        }

        .header {
            margin-bottom: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .header p {
            color: var(--text-dim);
            margin-top: 8px;
        }

        .create-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .bots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 360px));
            gap: 24px;
            align-items: start;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 24px;
            border-radius: 24px;
            transition: all 0.3s;
            width: 100%;
            min-height: 260px;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .bot-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .bot-desc {
            color: var(--text-dim);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .bot-meta {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent);
            margin-top: 10px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .modal-card {
            width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 28px;
        }

        .modal-card h2 {
            margin-bottom: 20px;
        }

        .modal-card label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .modal-card input,
        .modal-card textarea,
        .modal-card select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
        }

        .modal-card textarea {
            min-height: 90px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .cancel-btn {
            background: rgba(148, 163, 184, 0.2);
            color: var(--text-main);
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            cursor: pointer;
        }

        .danger-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <script src="sidebar-component.js"></script>
    <chatbot-sidebar></chatbot-sidebar>

    <main class="main-container">
        <div class="header">
            <div>
                <h1>My Bots</h1>
                <p>Manage all AI chatbots in your system.</p>
            </div>
            <button class="create-btn" onclick="openCreateModal()">+ Create Bot</button>
        </div>

        <div id="bots-grid" class="bots-grid">
            <div class="glass-card">Loading bots...</div>
        </div>

        <div id="create-modal" class="modal-overlay" style="display:none;">
            <div class="modal-card">
                <h2>Create New Bot</h2>

                <label>Bot Name</label>
                <input id="bot-name" type="text" placeholder="Example: Travel Bot">

                <label>Description</label>
                <textarea id="bot-description" placeholder="What is this bot for?"></textarea>

                <label>Language</label>
                <input id="bot-language" type="text" value="English">

                <label>Tone</label>
                <select id="bot-tone">
                    <option value="Friendly">Friendly</option>
                    <option value="Professional">Professional</option>
                    <option value="Formal">Formal</option>
                </select>

                <div class="modal-actions">
                    <button class="cancel-btn" onclick="closeCreateModal()">Cancel</button>
                    <button class="create-btn" onclick="createBot()">Create</button>
                </div>
            </div>
        </div>

        <div id="delete-modal" class="modal-overlay" style="display:none;">
            <div class="modal-card">
                <h2>Delete Bot</h2>
                <p style="color: var(--text-dim); line-height: 1.6;">
                    Are you sure you want to delete this bot? This action cannot be undone.
                </p>

                <div class="modal-actions">
                    <button class="cancel-btn" onclick="closeDeleteModal()">Cancel</button>
                    <button class="danger-btn" onclick="confirmDeleteBot()">Delete</button>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/auth.js"></script>
    <script>
        requireLogin();

        document.addEventListener("DOMContentLoaded", () => {
            fetchBots();
        });

        async function fetchBots() {
            const grid = document.getElementById("bots-grid");

            try {
                const response = await authenticatedFetch("http://127.0.0.1:8000/api/bots");
                const result = await response.json();

                if (result.status !== "success") {
                    grid.innerHTML = `<div class="glass-card">Failed to load bots.</div>`;
                    return;
                }

                const bots = result.data;

                if (!bots || bots.length === 0) {
                    grid.innerHTML = `<div class="glass-card">No bots found. Create your first bot.</div>`;
                    return;
                }

                grid.innerHTML = bots.map(bot => `
                    <div class="glass-card" onclick="openBot(${bot.id})" style="cursor:pointer;">
                        <div class="bot-title">${bot.bot_name || "Unnamed Bot"}</div>
                        <div class="bot-desc">${bot.bot_description || "No description provided."}</div>
                        <div class="bot-meta">Tone: ${bot.tone || "Not set"}</div>
                        <div class="bot-meta">Language: ${bot.language || "Not set"}</div>
                        <span class="badge">${bot.is_active ? "Active" : "Inactive"}</span>

                        <div style="margin-top: 15px; display:flex; gap:10px;">
                            <button class="cancel-btn" onclick="event.stopPropagation(); openEditBot(${bot.id})">Edit</button>
                            <button class="cancel-btn" onclick="event.stopPropagation(); deleteBot(${bot.id})">Delete</button>
                        </div>
                    </div>
                `).join("");

            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div class="glass-card">Error loading bots.</div>`;
            }
        }

        function openBot(botId) {
            sessionStorage.setItem("selectedBotId", botId);
            window.location.href = `index.html?bot_id=${botId}`;
        }

        function openCreateModal() {
            document.getElementById("bot-name").value = "";
            document.getElementById("bot-description").value = "";
            document.getElementById("bot-language").value = "English";
            document.getElementById("bot-tone").value = "Friendly";

            document.querySelector("#create-modal h2").innerText = "Create New Bot";

            const createBtn = document.querySelector("#create-modal .create-btn");
            createBtn.innerText = "Create";
            createBtn.onclick = createBot;

            document.getElementById("create-modal").style.display = "flex";
        }

        function closeCreateModal() {
            document.getElementById("create-modal").style.display = "none";
        }

        async function createBot() {
            const botName = document.getElementById("bot-name").value.trim();
            const botDescription = document.getElementById("bot-description").value.trim();
            const botLanguage = document.getElementById("bot-language").value.trim();
            const botTone = document.getElementById("bot-tone").value;

            if (!botName) {
                alert("Bot name is required");
                return;
            }

            const response = await authenticatedFetch("http://127.0.0.1:8000/api/bots", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    bot_name: botName,
                    bot_description: botDescription,
                    language: botLanguage,
                    tone: botTone
                })
            });

            const result = await response.json();

            if (result.status === "success") {
                document.getElementById("bot-name").value = "";
                document.getElementById("bot-description").value = "";
                document.getElementById("bot-language").value = "English";
                document.getElementById("bot-tone").value = "Friendly";

                closeCreateModal();
                window.location.href = `index.html?bot_id=${result.data.id}`;
            } else {
                alert(result.message || "Failed to create bot");
            }
        }

        // ===== NEW PART =====

        let selectedDeleteBotId = null;

        function deleteBot(botId) {
            selectedDeleteBotId = botId;
            document.getElementById("delete-modal").style.display = "flex";
        }

        function closeDeleteModal() {
            selectedDeleteBotId = null;
            document.getElementById("delete-modal").style.display = "none";
        }

        async function confirmDeleteBot() {
            if (!selectedDeleteBotId) return;

            const response = await authenticatedFetch(`http://127.0.0.1:8000/api/bots/${selectedDeleteBotId}`, {
                method: "DELETE"
            });

            const result = await response.json();

            if (result.status === "success") {
                closeDeleteModal();
                fetchBots();
            } else {
                alert(result.message || "Failed to delete bot");
            }
        }

        async function openEditBot(botId) {
            const response = await authenticatedFetch(`http://127.0.0.1:8000/api/bots/${botId}`);
            const result = await response.json();

            if (result.status !== "success") {
                alert("Failed to load bot");
                return;
            }

            const bot = result.data;

            document.getElementById("bot-name").value = bot.bot_name || "";
            document.getElementById("bot-description").value = bot.bot_description || "";
            document.getElementById("bot-language").value = bot.language || "English";
            document.getElementById("bot-tone").value = bot.tone || "Friendly";

            document.querySelector("#create-modal h2").innerText = "Edit Bot";

            document.getElementById("create-modal").style.display = "flex";

            // change create button to update
            const createBtn = document.querySelector("#create-modal .create-btn");
            createBtn.innerText = "Update";
            createBtn.onclick = () => updateBot(botId);
        }

        async function updateBot(botId) {
            const botName = document.getElementById("bot-name").value.trim();
            const botDescription = document.getElementById("bot-description").value.trim();
            const botLanguage = document.getElementById("bot-language").value.trim();
            const botTone = document.getElementById("bot-tone").value;

            const response = await authenticatedFetch(`http://127.0.0.1:8000/api/bots/${botId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    bot_name: botName,
                    bot_description: botDescription,
                    language: botLanguage,
                    tone: botTone
                })
            });

            const result = await response.json();

            if (result.status === "success") {
                closeCreateModal();
                fetchBots();

                // reset button back to create
                const createBtn = document.querySelector("#create-modal .create-btn");
                createBtn.innerText = "Create";
                createBtn.onclick = createBot;
            } else {
                alert(result.message || "Failed to update bot");
            }
        }

    </script>
</body>
</html>
