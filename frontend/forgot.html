<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | Omnexa</title>
    <meta name="description" content="Reset the password on your Omnexa account.">
    <meta name="robots" content="noindex,follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Geist:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/auth-volleo.css">
</head>
<body>
    <div class="auth-shell">
        <main class="auth-main">
            <div class="auth-card">
                <a class="auth-back" href="login.html"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Back to sign in</a>
                <a class="auth-brand" href="landing.html"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4.2h9.8l-3.1 4H3.9z" fill="currentColor"/><path d="M5.5 10h9.8l-3.1 4H2.4z" fill="currentColor"/><path d="M4 15.8h9.8l-3.1 4H0.9z" fill="currentColor"/></svg> Omnexa</a>

                <div class="auth-head">
                    <h1>Reset your password</h1>
                    <p>Enter the email on your account and we will send you a six digit code.</p>
                </div>

                <div id="alert-box" class="alert alert-error" role="alert" aria-live="assertive" aria-atomic="true"></div>

                <!-- STEP 1: Enter Email -->
                <form id="step-1-form">
                    <div class="input-group">
                        <label for="reset-email">Work email</label>
                        <input type="email" id="reset-email" placeholder="name@company.com" required autocomplete="email" aria-describedby="alert-box">
                    </div>

                    <button type="submit" class="btn-action" id="step-1-btn">
                        <span class="btn-text">Send code</span>
                        <div class="loader"></div>
                    </button>
                </form>

                <!-- STEP 2: Enter OTP & New Password (Hidden initially) -->
                <form id="step-2-form" style="display: none;">
                    <div class="input-group">
                        <div class="auth-row" style="margin-bottom:7px">
                            <label for="reset-otp" style="margin-bottom:0">Verification code</label>
                            <button type="button" id="resend-btn" class="btn-ghost" style="min-height:30px;padding-inline:12px;font-size:.78rem" onclick="resendCode()">Resend code</button>
                        </div>
                        <div class="otp-inputs" style="margin-block:0">
                            <input type="text" id="reset-otp" placeholder="000000" required autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" aria-describedby="alert-box">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="reset-password-input">New password</label>
                        <div class="password-field">
                            <input type="password" id="reset-password-input" placeholder="Create a strong password" required autocomplete="new-password" aria-describedby="strength-text password-rules" oninput="checkPasswordStrength(this.value)">
                            <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePasswordVisibility('reset-password-input', this)">Show</button>
                        </div>
                <div id="password-strength-container" style="display:none">
                    <div class="strength-track">
                        <div id="strength-bar" style="height: 100%; width: 0%; transition: all 0.3s;"></div>
                    </div>
                    <p id="strength-text" class="field-hint" aria-live="polite" aria-atomic="true"></p>
                </div>
                    </div>

                    <div class="input-group">
                        <label for="reset-password-confirm">Confirm new password</label>
                        <div class="password-field">
                            <input type="password" id="reset-password-confirm" placeholder="Re-enter your new password" required autocomplete="new-password" aria-describedby="alert-box">
                            <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePasswordVisibility('reset-password-confirm', this)">Show</button>
                        </div>
                    </div>

                    <ul class="auth-checklist" id="password-rules">
                        <li>At least 12 characters</li>
                        <li>Not a password you have used before</li>
                        <li>Not your email address</li>
                    </ul>

                    <button type="submit" class="btn-action" id="step-2-btn">
                        <span class="btn-text">Update password</span>
                        <div class="loader"></div>
                    </button>
                </form>

                <p class="auth-foot">Remembered it? <a href="login.html">Sign in</a></p>
                <p class="auth-meta">Omnexa identity vault security standards applied</p>
            </div>
        </main>
        <aside class="auth-aside">
            <img class="auth-visual" src="https://parjsxypengvubziwwjp.supabase.co/storage/v1/object/public/landing/img/auth-reset.webp" alt="" aria-hidden="true" decoding="async" width="540" height="540">
        </aside>
    </div>

    <script src="assets/js/auth-sentry.js"></script>
    <script>
        function togglePasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            button.textContent = isHidden ? 'Hide' : 'Show';
            button.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        }

        function checkPasswordStrength(password) {
            const container = document.getElementById('password-strength-container');
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            
            if (!password) {
                container.style.display = 'none';
                return;
            }
            
            container.style.display = 'block';
            let strength = 0;
            let feedback = "";
            
            if (password.length >= 8) strength += 25;
            if (/[A-Z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password)) strength += 25;
            if (/[!@#$%^&*()\-=_+[\]{}|;:,.<>?]/.test(password)) strength += 25;
            
            bar.style.width = strength + "%";
            
            if (strength <= 25) {
                bar.style.background = "#F87171";
                feedback = "Weak (Need 8+ chars, caps, nums, symbols)";
            } else if (strength <= 50) {
                bar.style.background = "#f59e0b";
                feedback = "Moderate";
            } else if (strength <= 75) {
                bar.style.background = "#22D3EE";
                feedback = "Good";
            } else {
                bar.style.background = "#34D399";
                feedback = "Strong Password ✨";
            }
            
            text.innerText = feedback;
        }

        const step1Form = document.getElementById('step-1-form');
        const step2Form = document.getElementById('step-2-form');
        const step1Btn = document.getElementById('step-1-btn');
        const step2Btn = document.getElementById('step-2-btn');
        const alertBox = document.getElementById('alert-box');

        let userEmail = "";
        let resendCooldown = null;

        function startResendCooldown(seconds) {
            const btn = document.getElementById('resend-btn');
            if (!btn) return;
            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.style.cursor = 'not-allowed';
            let remaining = seconds;
            btn.textContent = `Resend in ${remaining}s`;
            resendCooldown = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(resendCooldown);
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                    btn.textContent = 'Resend Code';
                } else {
                    btn.textContent = `Resend in ${remaining}s`;
                }
            }, 1000);
        }

        async function resendCode() {
            if (!userEmail) return;
            const btn = document.getElementById('resend-btn');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });
                const result = await response.json();
                if (response.ok) {
                    showAlert('A new verification code has been sent to your email.', 'success');
                    startResendCooldown(60);
                } else {
                    showAlert(result.message || 'Failed to resend code.');
                    btn.disabled = false;
                    btn.textContent = 'Resend Code';
                }
            } catch (error) {
                showAlert('Cannot connect to server. Please try again.');
                btn.disabled = false;
                btn.textContent = 'Resend Code';
            }
        }

        function showAlert(message, type = "error") {
            alertBox.innerText = message;
            alertBox.style.display = "block";
            alertBox.className = `alert alert-${type}`;
        }

        function hideAlert() {
            alertBox.style.display = "none";
        }

        // STEP 1 Form Handler: Request OTP code
        step1Form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('reset-email').value.trim();
            if (!email) return;

            step1Btn.classList.add('loading');

            try {
                const response = await fetch("/api/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });

                const result = await response.json();

                if (!response.ok) {
                    showAlert(result.message || result.error || "Failed to send reset code.");
                    step1Btn.classList.remove('loading');
                    return;
                }

                userEmail = email;
                showAlert(result.message, "success");
                step1Btn.classList.remove('loading');

                // Switch step forms
                step1Form.style.display = "none";
                step2Form.style.display = "block";
                startResendCooldown(60);

            } catch (error) {
                console.error("Forgot password error:", error);
                showAlert("Cannot connect to the server.");
                step1Btn.classList.remove('loading');
            }
        });

        // STEP 2 Form Handler: Reset password with OTP
        step2Form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();

            const otp = document.getElementById('reset-otp').value.trim();
            const password = document.getElementById('reset-password-input').value;
            const confirmPassword = document.getElementById('reset-password-confirm').value;

            if (password !== confirmPassword) {
                showAlert("Passwords do not match.");
                return;
            }

            step2Btn.classList.add('loading');

            try {
                // First verify OTP
                const verifyRes = await fetch("/api/auth/verify-reset-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: userEmail, otp: otp })
                });

                const verifyResult = await verifyRes.json();

                if (!verifyRes.ok) {
                    showAlert(verifyResult.message || verifyResult.error || "Invalid OTP code.");
                    step2Btn.classList.remove('loading');
                    return;
                }

                // If OTP verified, perform actual password reset
                const resetRes = await fetch("/api/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: userEmail,
                        otp: otp,
                        password: password,
                        confirm_password: confirmPassword
                    })
                });

                const resetResult = await resetRes.json();

                if (!resetRes.ok) {
                    showAlert(resetResult.message || resetResult.error || "Password reset failed.");
                    step2Btn.classList.remove('loading');
                    return;
                }

                showAlert("Password successfully reset! Redirecting to login...", "success");
                step2Btn.classList.remove('loading');

                // Redirect to login page after 3 seconds
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 3000);

            } catch (error) {
                console.error("Password reset error:", error);
                showAlert("An error occurred during password reset.");
                step2Btn.classList.remove('loading');
            }
        });
    </script>
</body>
</html>
