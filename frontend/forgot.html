<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | AI CHATBOT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ef4444; /* Premium crimson/red style for password reset */
            --primary-glow: rgba(239, 68, 68, 0.4);
            --bg: #030816;
            --card-bg: rgba(15, 23, 42, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Elements */
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
            animation: float 20s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
        }

        .blob-1 { top: -10%; left: -10%; }
        .blob-2 { bottom: -10%; right: -10%; background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%); }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.1); }
        }

        .forgot-container {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
            animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 10px 30px var(--primary-glow);
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 20px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.4);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .btn-action {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .btn-action:active { transform: translateY(0); }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            position: absolute;
            left: 50%;
            margin-left: -10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-action.loading .btn-text { visibility: hidden; }
        .btn-action.loading .loader { display: block; }

        .footer-links {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover { text-decoration: underline; }

        .alert {
            padding: 14px 20px;
            border-radius: 16px;
            font-size: 0.9rem;
            margin-bottom: 24px;
            display: none;
            line-height: 1.4;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #34d399;
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="forgot-container">
        <div class="logo-area">
            <div class="logo-icon">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
            </div>
            <div class="logo-text">RESET PASSWORD</div>
            <p style="color: var(--text-dim); margin-top: 8px; font-size: 0.9rem;">Recover your dashboard credentials</p>
        </div>

        <div id="alert-box" class="alert alert-error"></div>

        <!-- STEP 1: Enter Email -->
        <form id="step-1-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="reset-email" placeholder="name@company.com" required autocomplete="off">
            </div>

            <button type="submit" class="btn-action" id="step-1-btn">
                <span class="btn-text">Send Reset Code</span>
                <div class="loader"></div>
            </button>
        </form>

        <!-- STEP 2: Enter OTP & New Password (Hidden initially) -->
        <form id="step-2-form" style="display: none;">
            <div class="input-group">
                <label>Verification Code (OTP)</label>
                <input type="text" id="reset-otp" placeholder="Enter 6-digit code" required autocomplete="off" maxlength="6" style="text-align: center; letter-spacing: 4px; font-weight: 700; font-size: 1.2rem;">
            </div>

            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="reset-password-input" placeholder="••••••••" required autocomplete="new-password" oninput="checkPasswordStrength(this.value)">
                <div id="password-strength-container" style="margin-top: 8px; display: none;">
                    <div style="height: 4px; width: 100%; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;">
                        <div id="strength-bar" style="height: 100%; width: 0%; transition: all 0.3s;"></div>
                    </div>
                    <p id="strength-text" style="font-size: 0.75rem; margin-top: 4px; color: var(--text-dim);"></p>
                </div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="reset-password-confirm" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-action" id="step-2-btn">
                <span class="btn-text">Reset Password</span>
                <div class="loader"></div>
            </button>
        </form>

        <div class="footer-links">
            Remembered your password? <a href="login.html" style="color: #3b82f6;">Sign In</a>
        </div>
    </div>

    <script>
        function checkPasswordStrength(password) {
            const container = document.getElementById('password-strength-container');
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            
            if (!password) {
                container.style.display = 'none';
                return;
            }
            
            container.style.display = 'block';
            let strength = 0;
            let feedback = "";
            
            if (password.length >= 8) strength += 25;
            if (/[A-Z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password)) strength += 25;
            if (/[!@#$%^&*()\-=_+[\]{}|;:,.<>?]/.test(password)) strength += 25;
            
            bar.style.width = strength + "%";
            
            if (strength <= 25) {
                bar.style.background = "#ef4444";
                feedback = "Weak (Need 8+ chars, caps, nums, symbols)";
            } else if (strength <= 50) {
                bar.style.background = "#f59e0b";
                feedback = "Moderate";
            } else if (strength <= 75) {
                bar.style.background = "#3b82f6";
                feedback = "Good";
            } else {
                bar.style.background = "#10b981";
                feedback = "Strong Password ✨";
            }
            
            text.innerText = feedback;
        }

        const step1Form = document.getElementById('step-1-form');
        const step2Form = document.getElementById('step-2-form');
        const step1Btn = document.getElementById('step-1-btn');
        const step2Btn = document.getElementById('step-2-btn');
        const alertBox = document.getElementById('alert-box');

        let userEmail = "";

        function showAlert(message, type = "error") {
            alertBox.innerText = message;
            alertBox.style.display = "block";
            alertBox.className = `alert alert-${type}`;
        }

        function hideAlert() {
            alertBox.style.display = "none";
        }

        // STEP 1 Form Handler: Request OTP code
        step1Form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('reset-email').value.trim();
            if (!email) return;

            step1Btn.classList.add('loading');

            try {
                const response = await fetch("http://127.0.0.1:8000/api/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });

                const result = await response.json();

                if (!response.ok) {
                    showAlert(result.message || result.error || "Failed to send reset code.");
                    step1Btn.classList.remove('loading');
                    return;
                }

                userEmail = email;
                showAlert(result.message, "success");
                step1Btn.classList.remove('loading');

                // Switch step forms
                step1Form.style.display = "none";
                step2Form.style.display = "block";

            } catch (error) {
                console.error("Forgot password error:", error);
                showAlert("Cannot connect to the server.");
                step1Btn.classList.remove('loading');
            }
        });

        // STEP 2 Form Handler: Reset password with OTP
        step2Form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();

            const otp = document.getElementById('reset-otp').value.trim();
            const password = document.getElementById('reset-password-input').value;
            const confirmPassword = document.getElementById('reset-password-confirm').value;

            if (password !== confirmPassword) {
                showAlert("Passwords do not match.");
                return;
            }

            step2Btn.classList.add('loading');

            try {
                // First verify OTP
                const verifyRes = await fetch("http://127.0.0.1:8000/api/auth/verify-reset-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: userEmail, otp: otp })
                });

                const verifyResult = await verifyRes.json();

                if (!verifyRes.ok) {
                    showAlert(verifyResult.message || verifyResult.error || "Invalid OTP code.");
                    step2Btn.classList.remove('loading');
                    return;
                }

                // If OTP verified, perform actual password reset
                const resetRes = await fetch("http://127.0.0.1:8000/api/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: userEmail,
                        otp: otp,
                        password: password,
                        confirm_password: confirmPassword
                    })
                });

                const resetResult = await resetRes.json();

                if (!resetRes.ok) {
                    showAlert(resetResult.message || resetResult.error || "Password reset failed.");
                    step2Btn.classList.remove('loading');
                    return;
                }

                showAlert("Password successfully reset! Redirecting to login...", "success");
                step2Btn.classList.remove('loading');

                // Redirect to login page after 3 seconds
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 3000);

            } catch (error) {
                console.error("Password reset error:", error);
                showAlert("An error occurred during password reset.");
                step2Btn.classList.remove('loading');
            }
        });
    </script>
</body>
</html>
