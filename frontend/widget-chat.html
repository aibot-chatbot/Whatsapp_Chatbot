<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Chat | Omnexa</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --accent: #4F46E5;
    --on-accent: #FFFFFF;
    --bg: #FFFFFF;
    --panel: #F8FAFC;
    --bubble-bot: #F1F5F9;
    --text: #0F172A;
    --muted: #64748B;
    --border: #E2E8F0;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app { display: flex; flex-direction: column; height: 100%; }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; background: var(--accent); color: var(--on-accent);
    flex: 0 0 auto;
  }
  header .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: 0 0 auto;
    background: rgba(255,255,255,.22); display: grid; place-items: center;
    font-weight: 700; font-size: 15px; overflow: hidden;
  }
  header .avatar img { width: 100%; height: 100%; object-fit: cover; }
  header .meta { min-width: 0; flex: 1; }
  header .title { font-weight: 650; font-size: 15px; }
  header .subtitle { font-size: 12.5px; opacity: .85; }
  header .title, header .subtitle {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  header button {
    background: transparent; border: 0; color: inherit; cursor: pointer;
    padding: 6px; border-radius: 8px; line-height: 0; opacity: .9;
  }
  header button:hover { background: rgba(255,255,255,.16); }
  header button svg { width: 20px; height: 20px; }
  body:not(.is-embedded) #closeBtn { display: none; }

  /* ── Message list ───────────────────────────────────────── */
  #log {
    flex: 1 1 auto; overflow-y: auto; padding: 16px;
    background: var(--panel); display: flex; flex-direction: column; gap: 10px;
    overscroll-behavior: contain;
  }

  .msg { max-width: 84%; padding: 10px 13px; border-radius: var(--radius); white-space: pre-wrap; word-wrap: break-word; }
  .msg.bot, .msg.human { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 4px; }
  .msg .sender { display: block; font-size: 12px; font-weight: 650; margin-bottom: 4px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
  .msg.error{ align-self: center; background: #FEF2F2; color: #991B1B; font-size: 13.5px; text-align: center; max-width: 92%; }
  .msg a { color: inherit; text-decoration: underline; }

  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 13px; background: var(--bubble-bot); border-radius: var(--radius); border-bottom-left-radius: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { opacity:.3; transform: translateY(0);} 30% { opacity:1; transform: translateY(-4px);} }

  /* ── Suggested questions ────────────────────────────────── */
  #suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; background: var(--panel); }
  #suggestions button {
    background: #fff; border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 9999px; cursor: pointer; font-size: 13.5px;
  }
  #suggestions button:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Lead form ──────────────────────────────────────────── */
  #leadForm { padding: 16px; background: var(--panel); border-top: 1px solid var(--border); }
  #leadForm p { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
  #leadForm input {
    width: 100%; padding: 10px 12px; margin-bottom: 8px;
    border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit;
  }
  #leadForm input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  #leadForm .row { display: flex; gap: 8px; }
  #leadForm .row button { flex: 1; padding: 10px; border-radius: 10px; border: 0; cursor: pointer; font-size: 14px; font-family: inherit; }
  #leadForm .primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  #leadForm .ghost { background: transparent; color: var(--muted); }

  /* ── Composer ───────────────────────────────────────────── */
  #composer {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 12px 14px; border-top: 1px solid var(--border); background: var(--bg);
    flex: 0 0 auto; padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  #input {
    flex: 1; resize: none; max-height: 120px; min-height: 42px;
    padding: 11px 13px; border: 1px solid var(--border); border-radius: 12px;
    font: inherit; font-size: 14.5px;
  }
  #input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  #send {
    width: 42px; height: 42px; flex: 0 0 auto; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--on-accent); cursor: pointer;
    display: grid; place-items: center;
  }
  #send:disabled { opacity: .45; cursor: not-allowed; }
  #send svg { width: 19px; height: 19px; }

  #branding { text-align: center; font-size: 11.5px; color: var(--muted); padding: 0 0 10px; background: var(--bg); }
  .chat-status { margin: 0; padding: 8px 16px; font-size: 12.5px; color: var(--muted); background: var(--panel); }
  .chat-status:empty { display: none; }

  .hidden { display: none !important; }
  #trial-entry {padding:8px 16px;background:var(--panel)}
  #trial-entry[hidden],#trial-dialog [hidden]{display:none!important}
  #trial-entry button,#trial-dialog button{font:inherit;padding:9px 12px;border:1px solid var(--border);border-radius:9px;cursor:pointer;color:var(--text);background:var(--bg)}
  #trial-dialog{width:min(560px,calc(100vw - 24px));max-height:90vh;margin:auto;padding:20px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:14px;overflow:auto}
  #trial-dialog::backdrop{background:#0007}#trial-dialog h2{margin:0;font-size:20px}
  #trial-dialog .trial-heading{display:flex;gap:12px;align-items:center;justify-content:space-between}
  #trial-dialog label{display:block;margin:12px 0;font-size:14px}#trial-dialog input,#trial-dialog select{display:block;width:100%;min-width:0;margin-top:5px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
  #trial-dialog button:focus-visible,#trial-dialog input:focus-visible,#trial-dialog select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #trial-dialog button:disabled{opacity:.5;cursor:not-allowed}#trial-dialog p{overflow-wrap:anywhere}#trial-dialog .trial-note{font-size:12px;color:var(--muted)}
  #trial-dialog .trial-booking,#trial-review{border-top:1px solid var(--border);margin-top:16px;padding-top:12px}#trial-dialog .trial-booking button{margin:0 8px 8px 0}
  #trial-confirm{background:var(--accent)!important;color:var(--on-accent)!important}#trial-status[data-error=true]{color:#b42318}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar" id="avatar"></div>
    <div class="meta">
      <div class="title" id="title">Chat</div>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <button id="closeBtn" type="button" aria-label="Close chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </header>

  <p id="handoff-status" class="chat-status" role="status" aria-live="polite"></p>
  <p id="connection-status" class="chat-status" role="status" aria-live="polite"></p>
  <div id="log" role="log" aria-live="polite"></div>
  <div id="suggestions"></div>
  <div id="trial-entry" hidden><button id="open-trials" type="button">Book a trial lesson</button></div>

  <form id="leadForm" class="hidden" autocomplete="on">
    <p id="leadPrompt"></p>
    <input id="leadName"  type="text"  name="name"  placeholder="Your name">
    <input id="leadEmail" type="email" name="email" placeholder="Your email">
    <input id="leadPhone" type="tel"   name="phone" placeholder="Your phone">
    <div class="row">
      <button type="submit" class="primary">Continue</button>
      <button type="button" class="ghost" id="leadSkip">Skip</button>
    </div>
  </form>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Type your message..."
              aria-label="Message"></textarea>
    <button id="send" type="submit" aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </form>
  <div id="branding" class="hidden"></div>
</div>
<dialog id="trial-dialog" aria-labelledby="trial-title">
  <div class="trial-heading"><h2 id="trial-title">Trial lessons</h2><button type="button" id="close-trials" aria-label="Close trial lessons">Close</button></div>
  <p class="trial-note">Times are shown in Asia/Kuala_Lumpur (UTC+08:00). A trial is not formal enrollment.</p>
  <p id="trial-status" role="status" aria-live="polite"></p>
  <form id="trial-participant-form"><label>New participant name<input name="label" maxlength="80" required autocomplete="off"></label><button type="submit">Add participant</button></form>
  <form id="trial-prepare-form">
    <label for="trial-participant">Participant</label><select id="trial-participant" name="participant_id" required></select>
    <label for="trial-session">Trial session</label><select id="trial-session" name="session_id" required></select>
    <p id="trial-reschedule-note" hidden></p><button type="button" id="trial-new" hidden>Keep existing booking</button>
    <p class="trial-note">Scheduled reminders are not available in web chat. Save your booking details.</p>
    <button type="submit" id="trial-prepare">Review booking</button>
  </form>
  <section id="trial-review" hidden aria-label="Confirm trial booking"><div id="trial-review-details"></div><button id="trial-confirm" type="button">Confirm booking</button><button id="trial-back" type="button">Back</button></section>
  <h3>Your bookings</h3><button id="trial-refresh" type="button">Refresh bookings</button><div id="trial-bookings"></div>
</dialog>
<script src="/assets/js/widget-tuition.js"></script>
<script>
(function () {
  "use strict";

  var ORIGIN = window.location.origin;
  // Path is either /widget/<key> (iframe) or /chat/<key> (share link).
  var PUBLIC_KEY = decodeURIComponent(
    (window.location.pathname.split("/").filter(Boolean)[1] || "")
  );
  var IS_EMBEDDED = new URLSearchParams(window.location.search).get("embed") === "1";

  var els = {
    log: document.getElementById("log"),
    input: document.getElementById("input"),
    send: document.getElementById("send"),
    composer: document.getElementById("composer"),
    suggestions: document.getElementById("suggestions"),
    title: document.getElementById("title"),
    subtitle: document.getElementById("subtitle"),
    connectionStatus: document.getElementById("connection-status"),
    handoffStatus: document.getElementById("handoff-status"),
    avatar: document.getElementById("avatar"),
    branding: document.getElementById("branding"),
    closeBtn: document.getElementById("closeBtn"),
    leadForm: document.getElementById("leadForm"),
    leadPrompt: document.getElementById("leadPrompt"),
    leadName: document.getElementById("leadName"),
    leadEmail: document.getElementById("leadEmail"),
    leadPhone: document.getElementById("leadPhone"),
    leadSkip: document.getElementById("leadSkip")
  };

  var STORAGE_KEY = "widget-chat:" + ORIGIN + ":" + PUBLIC_KEY;
  var MAX_SAVED_MESSAGES = 80;
  var state = {
    config: null, sessionId: null, sending: false, leadDone: false,
    messages: [], lastMessageId: 0, polling: false,
    pollTimer: null, pollController: null, stopped: false, pageHidden: false
  };

  if (IS_EMBEDDED) document.body.classList.add("is-embedded");

  // ── Rendering ─────────────────────────────────────────────
  function scrollToEnd() { els.log.scrollTop = els.log.scrollHeight; }

  /* Escapes first, then linkifies - never inserts untrusted HTML. */
  function renderText(node, text) {
    var urlPattern = /(https?:\/\/[^\s<>"']+)/g;
    var lastIndex = 0;
    var match;

    while ((match = urlPattern.exec(text)) !== null) {
      if (match.index > lastIndex) {
        node.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
      }
      var a = document.createElement("a");
      a.href = match[0];
      a.target = "_blank";
      a.rel = "noopener noreferrer nofollow";
      a.textContent = match[0];
      node.appendChild(a);
      lastIndex = urlPattern.lastIndex;
    }
    if (lastIndex < text.length) {
      node.appendChild(document.createTextNode(text.slice(lastIndex)));
    }
  }

  function addMessage(text, kind, id, restoring) {
    if (!text) return null;
    var bubble = document.createElement("div");
    bubble.className = "msg " + (kind || "bot");
    if (kind === "human") {
      var sender = document.createElement("span");
      sender.className = "sender";
      sender.textContent = "Support team";
      bubble.appendChild(sender);
      bubble.dataset.messageId = String(id);
    }
    renderText(bubble, String(text));
    els.log.appendChild(bubble);
    scrollToEnd();
    if (!restoring && kind !== "error") {
      state.messages = state.messages.concat({ text: String(text), kind: kind || "bot", id: id || null }).slice(-MAX_SAVED_MESSAGES);
      saveSession();
    }
    return bubble;
  }

  function saveSession() {
    if (!state.sessionId) return;
    try {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
        sessionId: state.sessionId, messages: state.messages,
        lastMessageId: state.lastMessageId, leadDone: state.leadDone
      }));
    } catch (_) { /* Private browsing or a full store must not interrupt this chat. */ }
  }

  function restoreSession() {
    var raw;
    try { raw = sessionStorage.getItem(STORAGE_KEY); } catch (_) { return false; }
    if (!raw) return false;
    try {
      var saved = JSON.parse(raw);
      if (!saved || !/^web_[0-9a-zA-Z_-]{16,64}$/.test(saved.sessionId || "")) throw new Error("Invalid saved session");
      state.sessionId = saved.sessionId;
      state.lastMessageId = Number.isSafeInteger(saved.lastMessageId) && saved.lastMessageId >= 0 ? saved.lastMessageId : 0;
      state.leadDone = saved.leadDone === true;
      state.messages = (Array.isArray(saved.messages) ? saved.messages : []).filter(function (message) {
        return message && typeof message.text === "string" && ["bot", "user", "human"].includes(message.kind)
          && (message.kind !== "human" || Number.isSafeInteger(message.id));
      }).slice(-MAX_SAVED_MESSAGES);
      state.messages.forEach(function (message) { addMessage(message.text, message.kind, message.id, true); });
    } catch (_) {
      stopChat("This saved chat could not be restored. Please contact the support team.");
    }
    return true;
  }

  function showTyping() {
    var node = document.createElement("div");
    node.className = "typing";
    node.innerHTML = "<i></i><i></i><i></i>";
    els.log.appendChild(node);
    scrollToEnd();
    return node;
  }

  function setBusy(busy) {
    state.sending = busy;
    els.send.disabled = busy || state.stopped;
    els.input.disabled = busy || state.stopped;
  }

  function applyTheme(config) {
    var root = document.documentElement.style;
    root.setProperty("--accent", config.primary_color || "#4F46E5");
    root.setProperty("--on-accent", config.text_color || "#FFFFFF");

    var name = config.display_name || "Chat";
    document.title = name;
    els.title.textContent = name;
    els.subtitle.textContent = config.subtitle || "";
    els.input.placeholder = config.input_placeholder || "Type your message...";

    if (config.avatar_url) {
      var img = document.createElement("img");
      img.src = config.avatar_url;
      img.alt = "";
      els.avatar.appendChild(img);
    } else {
      els.avatar.textContent = name.trim().charAt(0).toUpperCase() || "?";
    }

    if (config.show_branding && config.branding_text) {
      els.branding.textContent = config.branding_text;
      els.branding.classList.remove("hidden");
    }
  }

  function renderSuggestions(questions) {
    els.suggestions.innerHTML = "";
    if (!questions || !questions.length) return;

    questions.forEach(function (question) {
      var button = document.createElement("button");
      button.type = "button";
      button.textContent = question;
      button.addEventListener("click", function () {
        els.suggestions.innerHTML = "";
        sendMessage(question);
      });
      els.suggestions.appendChild(button);
    });
  }

  // ── Networking ────────────────────────────────────────────
  function api(path, options) {
    return fetch(ORIGIN + "/api/widget/" + encodeURIComponent(PUBLIC_KEY) + path,
      Object.assign({ credentials: "omit" }, options || {}))
      .then(function (response) {
        return response.json().catch(function () { return {}; })
          .then(function (body) {
            if (!response.ok || body.status !== "success") {
              var err = new Error(body.message || "Request failed");
              err.code = body.code;
              err.status = response.status;
              throw err;
            }
            return body.data || {};
          });
      });
  }

  function stopChat(message) {
    state.stopped = true;
    window.WidgetTuition?.setBlocked(true);
    clearTimeout(state.pollTimer);
    if (state.pollController) state.pollController.abort();
    els.connectionStatus.textContent = message;
    els.handoffStatus.textContent = "";
    els.suggestions.innerHTML = "";
    els.leadForm.classList.add("hidden");
    setBusy(false);
    saveSession();
  }

  function sessionUnavailable(error) {
    return [403, 404, 410].includes(error.status) || [
      "invalid_session", "widget_disabled", "widget_not_found", "chatbot_inactive", "chatbot_not_found"
    ].includes(error.code);
  }

  function schedulePoll(delay) {
    clearTimeout(state.pollTimer);
    if (state.stopped || state.pageHidden || !state.sessionId) return;
    state.pollTimer = setTimeout(pollMessages, delay === undefined
      ? (document.visibilityState === "hidden" ? 15000 : 3000) : delay);
  }

  function requestPoll() {
    clearTimeout(state.pollTimer);
    if (state.polling) return;
    pollMessages();
  }

  async function pollMessages() {
    if (state.polling || state.stopped || state.pageHidden || !state.sessionId) return;
    state.polling = true;
    var hasMore = false;
    var controller = new AbortController();
    state.pollController = controller;
    var timeout = setTimeout(function () { controller.abort(); }, 12000);
    try {
      var data = await api("/messages", {
        method: "POST", headers: { "Content-Type": "application/json" }, signal: controller.signal,
        body: JSON.stringify({ session_id: state.sessionId, after_id: state.lastMessageId })
      });
      if (state.pageHidden || state.stopped) return;
      if (!Array.isArray(data.messages) || !Number.isSafeInteger(data.last_message_id)
          || data.last_message_id < state.lastMessageId || data.messages.some(function (message) {
            return !message || !Number.isSafeInteger(message.id) || message.id <= 0
              || message.id > data.last_message_id || message.sender_type !== "human" || typeof message.message_text !== "string";
          })) throw new Error("Unreadable chat updates");
      var seen = new Set(state.messages.filter(function (message) { return message.kind === "human"; }).map(function (message) { return message.id; }));
      data.messages.slice().sort(function (a, b) { return a.id - b.id; }).forEach(function (message) {
        if (message.id > state.lastMessageId && !seen.has(message.id)) {
          addMessage(message.message_text, "human", message.id);
          seen.add(message.id);
        }
      });
      hasMore = data.has_more === true && data.last_message_id > state.lastMessageId;
      state.lastMessageId = data.last_message_id;
      saveSession();
      els.connectionStatus.textContent = "";
      els.handoffStatus.textContent = data.awaiting_human ? "Waiting for the support team. Replies will appear here." : "";
      window.WidgetTuition?.setBlocked(data.awaiting_human === true);
    } catch (error) {
      if (!state.pageHidden && !state.stopped) {
        if (sessionUnavailable(error)) stopChat(error.message || "This chat is unavailable.");
        else els.connectionStatus.textContent = "Reconnecting to chat updates. Your messages will stay here.";
      }
    } finally {
      clearTimeout(timeout);
      state.pollController = null;
      state.polling = false;
      if (hasMore && !state.stopped && !state.pageHidden) pollMessages();
      else schedulePoll();
    }
  }

  function sendMessage(text) {
    var message = (text !== undefined ? text : els.input.value).trim();
    if (!message || state.sending || state.stopped || !state.sessionId) return;

    els.suggestions.innerHTML = "";
    addMessage(message, "user");
    els.input.value = "";
    els.input.style.height = "auto";
    setBusy(true);

    var typing = showTyping();

    api("/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: state.sessionId, message: message })
    })
      .then(function (data) {
        typing.remove();
        addMessage(data.reply, "bot");
        renderSuggestions(data.buttons);
      })
      .catch(function (error) {
        typing.remove();
        if (sessionUnavailable(error)) { stopChat(error.message || "This chat is unavailable."); return; }
        addMessage(error.message || "Something went wrong. Please try again.", "error");
        if (error.code === "session_limit_reached") {
          els.composer.classList.add("hidden");
        }
      })
      .finally(function () {
        setBusy(false);
        requestPoll();
        if (!state.stopped && (!IS_EMBEDDED || document.hasFocus())) els.input.focus();
      });
  }

  // ── Lead form ─────────────────────────────────────────────
  function maybeShowLeadForm() {
    var config = state.config;
    if (!config.collect_lead || state.leadDone) return false;

    els.leadPrompt.textContent = config.lead_prompt || "May I have your details?";
    els.leadName.classList.toggle("hidden", !config.lead_require_name);
    els.leadEmail.classList.toggle("hidden", !config.lead_require_email);
    els.leadPhone.classList.toggle("hidden", !config.lead_require_phone);
    els.leadForm.classList.remove("hidden");
    els.composer.classList.add("hidden");
    return true;
  }

  function dismissLeadForm() {
    if (state.stopped) return;
    state.leadDone = true;
    saveSession();
    els.leadForm.classList.add("hidden");
    els.composer.classList.remove("hidden");
    renderSuggestions(state.config.suggested_questions);
    els.input.focus();
  }

  els.leadForm.addEventListener("submit", function (event) {
    event.preventDefault();

    api("/lead", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session_id: state.sessionId,
        name: els.leadName.value,
        email: els.leadEmail.value,
        phone: els.leadPhone.value
      })
    })
      .then(dismissLeadForm)
      .catch(function (error) {
        els.leadPrompt.textContent = error.message || "Please check your details.";
      });
  });

  els.leadSkip.addEventListener("click", dismissLeadForm);

  // ── Composer behaviour ────────────────────────────────────
  els.composer.addEventListener("submit", function (event) {
    event.preventDefault();
    sendMessage();
  });

  els.input.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  els.input.addEventListener("input", function () {
    els.input.style.height = "auto";
    els.input.style.height = Math.min(els.input.scrollHeight, 120) + "px";
  });

  els.closeBtn.addEventListener("click", function () {
    if (window.parent !== window) {
      window.parent.postMessage({ type: "aichat:close" }, "*");
    }
  });

  window.addEventListener("message", function (event) {
    if ((event.data || {}).type === "aichat:focus") { els.input.focus(); requestPoll(); }
  });

  window.addEventListener("focus", function () { if (document.visibilityState !== "hidden") requestPoll(); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") schedulePoll();
    else requestPoll();
  });
  window.addEventListener("pagehide", function () {
    state.pageHidden = true;
    clearTimeout(state.pollTimer);
    if (state.pollController) state.pollController.abort();
    saveSession();
  });
  window.addEventListener("pageshow", function () {
    if (!state.pageHidden) return;
    state.pageHidden = false;
    requestPoll();
  });

  // ── Boot ──────────────────────────────────────────────────
  if (!PUBLIC_KEY) {
    addMessage("This chat link is not valid.", "error");
    els.composer.classList.add("hidden");
    return;
  }

  var restored = restoreSession();
  setBusy(true);

  api("/config", { method: "GET" })
    .then(function (config) {
      state.config = config;
      applyTheme(config);
      if (state.stopped) return {};
      if (state.sessionId) return { session_id: state.sessionId };
      return api("/session", { method: "POST" });
    })
    .then(function (session) {
      if (state.stopped) return;
      if (!/^web_[0-9a-zA-Z_-]{16,64}$/.test(session.session_id || "")) throw new Error("This chat session is unavailable.");
      state.sessionId = session.session_id;
      window.WidgetTuition?.init(PUBLIC_KEY, state.sessionId);
      saveSession();
      setBusy(false);

      if (!restored && state.config.welcome_message) {
        addMessage(state.config.welcome_message, "bot");
      }

      if (!maybeShowLeadForm()) {
        renderSuggestions(
          session.suggested_questions || state.config.suggested_questions
        );
        if (!IS_EMBEDDED) els.input.focus();
      }
      requestPoll();
    })
    .catch(function (error) {
      stopChat(error.message || "This chatbot is not available right now.");
    });
})();
</script>
</body>
</html>
