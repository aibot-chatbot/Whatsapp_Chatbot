<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared-glass.css">
    <script src="assets/js/shared-ui.js"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #050b18;
            --sidebar-bg: rgba(15, 23, 42, 0.8);
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #10b981;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        .main-container {
            flex-grow: 1;
            padding: 50px 60px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .header p {
            color: var(--text-dim);
            margin-top: 8px;
        }

        /* ===== Glass Cards (from shared-glass.css) ===== */

        .report-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .report-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .report-select {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .primary-btn,
        .secondary-btn {
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--primary), #2563eb);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
        }

        .primary-btn:disabled,
        .secondary-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .report-output {
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(15, 23, 42, 0.4);
            border: 1px dashed var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            color: var(--text-dim);
            line-height: 1.6;
        }

        .status-pill {
            color: var(--accent);
            font-weight: 600;
            padding: 10px 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .main-container {
                padding: 30px 20px;
            }

            .header,
            .report-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>
    <script src="sidebar-component.js"></script>
    <chatbot-sidebar></chatbot-sidebar>

    <main class="main-container">
        <div class="header">
            <div>
                <h1 id="page-title">Reports</h1>
                <p>Generate AI-powered chatbot performance reports.</p>
            </div>
            <div class="glass-card status-pill">
                <span id="bot-name">Loading bot...</span>
            </div>
        </div>

        <div class="glass-card">
            <div class="report-toolbar">
                <div>
                    <h2 style="margin: 0; font-size: 1.2rem;">AI Chatbot Insights & Report</h2>
                    <p style="margin: 8px 0 0 0; color: var(--text-dim); font-size: 0.9rem;">
                        Select a range, generate a report, then download it as PDF.
                    </p>
                </div>
                <div class="report-actions">
                    <select id="report-days" class="report-select">
                        <option value="7" selected>Last 7 Days</option>
                        <option value="14">Last 14 Days</option>
                        <option value="30">Last 30 Days</option>
                        <option value="9999">All Time</option>
                    </select>
                    <button id="btn-generate-report" class="primary-btn" onclick="generateReport()">
                        Generate AI Report
                    </button>
                    <button id="btn-download-pdf" class="secondary-btn" onclick="downloadReportPDF()" style="display: none;">
                        Download PDF
                    </button>
                </div>
            </div>

            <div id="report-container" class="report-output">
                <div style="text-align: center; font-size: 0.95rem;">
                    Select the report range above and click <strong>Generate AI Report</strong> to run log analysis.
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/auth.js"></script>
    <script>
        requireLogin();

        const urlParams = new URLSearchParams(window.location.search);
        const urlBotId = urlParams.get("bot_id");
        const storedBotId = sessionStorage.getItem("selectedBotId");

        let selectedBotId = urlBotId;

        if (!urlBotId && storedBotId) {
            window.location.href = `reports.html?bot_id=${encodeURIComponent(storedBotId)}`;
            selectedBotId = storedBotId;
        }

        if (!selectedBotId) {
            window.location.href = "bots.html";
        }

        if (selectedBotId) {
            sessionStorage.setItem("selectedBotId", selectedBotId);
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (!selectedBotId) {
                return;
            }

            fetchSelectedBot();
        });

        async function fetchSelectedBot() {
            try {
                const response = await authenticatedFetch(`/api/bots/${selectedBotId}`);
                const result = await response.json();

                if (!response.ok || result.status !== "success" || !result.data) {
                    alert("You do not have access to this bot.");
                    window.location.href = "bots.html";
                    return;
                }

                const botName = result.data.bot_name || "Selected Bot";
                document.getElementById("page-title").textContent = `${botName} Reports`;
                document.getElementById("bot-name").textContent = botName;
            } catch (err) {
                console.error("Failed to fetch selected bot", err);
                alert("Failed to load bot. Please select a bot again.");
                window.location.href = "bots.html";
            }
        }

        function parseMarkdown(text) {
            if (!text) return "";

            let escapedText = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            let lines = escapedText.split('\n');
            let processedLines = [];
            let inTable = false;
            let tableHeaders = [];
            let tableRows = [];

            function formatInlineMarkdown(value) {
                return value.replace(/\*\*(.*?)\*\*/g, '<strong style="color: var(--text-main); font-weight: 600;">$1</strong>');
            }

            function formatHTMLTable(headers, rows) {
                let tableHTML = '<table style="width:100%; border-collapse:collapse; margin:20px 0; background:rgba(15,23,42,0.3); border:1px solid var(--glass-border); border-radius:12px; overflow:hidden; font-size:0.9rem;">';
                tableHTML += '<thead style="background:rgba(59,130,246,0.15); border-bottom:1px solid var(--glass-border);"><tr>';
                headers.forEach(header => {
                    tableHTML += `<th style="padding:12px 16px; text-align:left; font-weight:600; color:var(--text-main);">${header}</th>`;
                });
                tableHTML += '</tr></thead><tbody>';

                rows.forEach((row, index) => {
                    const rowBg = index % 2 === 0 ? "transparent" : "rgba(255,255,255,0.02)";
                    tableHTML += `<tr style="background:${rowBg}; border-bottom:1px solid rgba(255,255,255,0.05);">`;
                    for (let i = 0; i < headers.length; i++) {
                        tableHTML += `<td style="padding:12px 16px; color:var(--text-dim); text-align:left; vertical-align:top;">${row[i] || ""}</td>`;
                    }
                    tableHTML += '</tr>';
                });

                tableHTML += '</tbody></table>';
                return tableHTML;
            }

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();

                if (line.startsWith('|') && line.endsWith('|')) {
                    if (line.replace(/[\s|:\-]/g, '') === '') {
                        continue;
                    }

                    let cells = line.split('|').map(cell => cell.trim());
                    if (cells[0] === '') cells.shift();
                    if (cells[cells.length - 1] === '') cells.pop();

                    if (!inTable) {
                        inTable = true;
                        tableHeaders = cells;
                    } else {
                        tableRows.push(cells);
                    }
                    continue;
                }

                if (inTable) {
                    processedLines.push(formatHTMLTable(tableHeaders, tableRows));
                    inTable = false;
                    tableHeaders = [];
                    tableRows = [];
                }
                processedLines.push(lines[i]);
            }

            if (inTable) {
                processedLines.push(formatHTMLTable(tableHeaders, tableRows));
            }

            let finalBlocks = [];
            let currentParagraph = [];

            function flushParagraph() {
                if (!currentParagraph.length) return;
                const paragraphText = formatInlineMarkdown(currentParagraph.join(' '));
                finalBlocks.push(`<p style="margin-bottom: 12px; page-break-inside: avoid; break-inside: avoid;">${paragraphText}</p>`);
                currentParagraph = [];
            }

            processedLines.forEach(rawLine => {
                const line = rawLine.trim();

                if (line === '') {
                    flushParagraph();
                } else if (line.startsWith('<table')) {
                    flushParagraph();
                    finalBlocks.push(rawLine);
                } else if (line.startsWith('#')) {
                    flushParagraph();
                    const match = line.match(/^(#{1,6})\s*(.*)$/);
                    const level = match ? match[1].length : 3;
                    const headingText = formatInlineMarkdown(match ? match[2] : line);
                    const tag = level === 1 ? "h2" : level === 2 ? "h3" : "h4";
                    finalBlocks.push(`<${tag} style="color: var(--text-main); margin: 24px 0 12px 0; font-weight: 700; page-break-after: avoid; break-after: avoid;">${headingText}</${tag}>`);
                } else if (line === '---') {
                    flushParagraph();
                    finalBlocks.push('<hr style="border: none; border-top: 1px solid var(--glass-border); margin: 20px 0;">');
                } else if (line.startsWith('-') || line.startsWith('*') || line.startsWith('•')) {
                    flushParagraph();
                    const listText = formatInlineMarkdown(line.replace(/^(?:[-*•])\s*/, ''));
                    finalBlocks.push(`<li style="margin-left: 20px; margin-bottom: 6px; list-style-type: disc; page-break-inside: avoid; break-inside: avoid;">${listText}</li>`);
                } else {
                    currentParagraph.push(rawLine);
                }
            });

            flushParagraph();

            return `<div style="font-family: inherit; font-size: 0.95rem; text-align: left; color: #cbd5e1; max-width: 100%; overflow-x: auto;">${finalBlocks.join('\n')}</div>`;
        }

        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function generateReport() {
            const container = document.getElementById("report-container");
            const btn = document.getElementById("btn-generate-report");
            const days = document.getElementById("report-days").value;

            btn.disabled = true;
            btn.textContent = "Generating...";
            container.style.borderStyle = "solid";
            container.innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0;">
                    <div style="width: 30px; height: 30px; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
                    <span style="font-size: 0.95rem;">Analyzing database logs and generating report... This may take up to 20 seconds.</span>
                </div>
            `;

            try {
                const response = await authenticatedFetch(`/api/analytics/report?chatbot_id=${selectedBotId}&days=${days}`);
                const result = await response.json();

                if (response.ok && result.status === "success" && result.data?.report) {
                    container.style.borderStyle = "solid";
                    container.innerHTML = parseMarkdown(result.data.report);
                    document.getElementById("btn-download-pdf").style.display = "flex";
                } else {
                    container.style.borderStyle = "dashed";
                    container.innerHTML = "";
                    const errorEl = document.createElement("div");
                    errorEl.style.color = "#f87171";
                    errorEl.style.textAlign = "center";
                    errorEl.textContent = `Failed to generate report: ${result.message || "Unknown error occurred"}`;
                    container.appendChild(errorEl);
                    document.getElementById("btn-download-pdf").style.display = "none";
                }
            } catch (err) {
                console.error("Report generation failed", err);
                container.style.borderStyle = "dashed";
                container.innerHTML = "";
                const errorEl = document.createElement("div");
                errorEl.style.color = "#f87171";
                errorEl.style.textAlign = "center";
                errorEl.textContent = "Network error or request failed while generating the report.";
                container.appendChild(errorEl);
                document.getElementById("btn-download-pdf").style.display = "none";
            } finally {
                btn.disabled = false;
                btn.textContent = "Generate AI Report";
            }
        }

        async function downloadReportPDF() {
            const container = document.getElementById("report-container");
            if (!container || container.innerText.trim().includes("Select the report range")) {
                alert("Please generate a report first.");
                return;
            }

            const downloadBtn = document.getElementById("btn-download-pdf");
            const originalText = downloadBtn.textContent;
            downloadBtn.disabled = true;
            downloadBtn.textContent = "Preparing PDF...";

            try {
                if (typeof html2pdf === "undefined") {
                    const script = document.createElement("script");
                    script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
                    document.head.appendChild(script);
                    await new Promise(resolve => {
                        script.onload = resolve;
                    });
                }

                const botTitle = document.getElementById("bot-name").innerText || "AI Chatbot";
                const safeBotTitle = escapeHtml(botTitle);
                const dateStr = new Date().toLocaleDateString();
                const printElement = document.createElement("div");
                printElement.style.padding = "0px";
                printElement.style.width = "710px";
                printElement.style.boxSizing = "border-box";
                printElement.style.color = "#1e293b";
                printElement.style.backgroundColor = "#ffffff";
                printElement.style.fontFamily = "'Outfit', 'Segoe UI', sans-serif";
                printElement.style.lineHeight = "1.6";

                printElement.innerHTML = `
                    <div style="border-bottom: 2px solid #3b82f6; padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end;">
                        <div>
                            <h1 style="font-size: 1.8rem; font-weight: 700; color: #1e3a8a; margin: 0;">AI Chatbot Performance & Insights Report</h1>
                            <p style="font-size: 0.95rem; color: #64748b; margin: 6px 0 0 0;">${safeBotTitle}</p>
                        </div>
                        <div style="text-align: right; font-size: 0.85rem; color: #64748b;">
                            <div>Date: ${dateStr}</div>
                            <div style="font-weight: 600; color: #3b82f6; margin-top: 4px;">CONFIDENTIAL</div>
                        </div>
                    </div>
                    <div class="report-content" style="font-size: 1rem;">${container.innerHTML}</div>
                    <div style="margin-top: 50px; border-top: 1px solid #e2e8f0; padding-top: 15px; text-align: center; font-size: 0.8rem; color: #94a3b8;">
                        This analytics report was automatically compiled by the AI Chatbot System. All rights reserved.
                    </div>
                `;

                printElement.querySelectorAll("table").forEach(table => {
                    table.style.width = "100%";
                    table.style.backgroundColor = "#ffffff";
                    table.style.border = "1px solid #1e293b";
                    table.style.borderRadius = "0px";
                    table.style.margin = "20px 0";
                    table.style.fontSize = "0.9rem";
                });

                printElement.querySelectorAll("th").forEach(th => {
                    th.style.padding = "10px 14px";
                    th.style.color = "#0f172a";
                    th.style.border = "1px solid #cbd5e1";
                    th.style.fontWeight = "600";
                    th.style.textAlign = "left";
                });

                printElement.querySelectorAll("td").forEach(td => {
                    td.style.padding = "10px 14px";
                    td.style.color = "#334155";
                    td.style.border = "1px solid #cbd5e1";
                    td.style.verticalAlign = "top";
                    td.style.textAlign = "left";
                    td.style.wordBreak = "break-word";
                    td.style.overflowWrap = "break-word";
                });

                printElement.querySelectorAll("h1, h2, h3, h4, h5, h6, strong").forEach(el => {
                    el.style.color = "#0f172a";
                });

                printElement.querySelectorAll("p, li, tr").forEach(el => {
                    el.style.pageBreakInside = "avoid";
                    el.style.breakInside = "avoid";
                });

                const opt = {
                    margin: [5, 10, 5, 10],
                    filename: `AI_Chatbot_Insights_Report_${botTitle.replace(/\s+/g, '_')}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: {
                        scale: 2,
                        useCORS: true,
                        logging: false
                    },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
                };

                await html2pdf().from(printElement).set(opt).save();
            } catch (err) {
                console.error("PDF generation failed:", err);
                alert("Failed to generate PDF. Please try again.");
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.textContent = originalText;
            }
        }
    </script>
</body>

</html>
