<!DOCTYPE html>
<html lang="en" style="color-scheme: dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Performance | AI Chatbot</title>
    <meta name="theme-color" content="#0e0f11">
    <script src="assets/js/shared-ui.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="sidebar-component.js"></script>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0f11; color: #f2f3f4; font: 14px system-ui, sans-serif; }
    </style>
</head>
<body>
    <p role="status">Opening Performance in Insights &amp; Actions…</p>
    <script>
        const destination = new URL("crm.html", window.location.href);
        const current = new URLSearchParams(window.location.search);
        const selectedBotId = current.get("bot_id") || sessionStorage.getItem("selectedBotId");
        if (selectedBotId) destination.searchParams.set("bot_id", selectedBotId);
        destination.searchParams.set("view", "performance");
        window.location.replace(destination.href);
    </script>
</body>
</html>
