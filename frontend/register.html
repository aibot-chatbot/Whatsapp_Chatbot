<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | AI CHATBOT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --bg: #030816;
            --card-bg: rgba(15, 23, 42, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
        }

        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
            animation: float 20s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
        }

        .blob-1 { top: -10%; left: -10%; }
        .blob-2 { bottom: -10%; right: -10%; background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%); }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.1); }
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            margin: auto;
            padding: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
            animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), #10b981);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 10px 30px var(--primary-glow);
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 6px;
            margin-left: 4px;
        }

        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px 18px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.4);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 72px;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-dim);
            border-radius: 9px;
            padding: 5px 9px;
            font-family: inherit;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
        }

        .password-toggle:hover {
            color: white;
            border-color: rgba(255, 255, 255, 0.24);
            background: rgba(255, 255, 255, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn-register {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            position: absolute;
            left: 50%;
            margin-left: -10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-register.loading .btn-text { visibility: hidden; }
        .btn-register.loading .loader { display: block; }

        .footer-links {
            margin-top: 24px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover { text-decoration: underline; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-dim);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .btn-google {
            width: 100%;
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 13px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s;
            font-family: 'Outfit', sans-serif;
        }
        .btn-google:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 36px;
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.3s ease;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .modal-box h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
        .modal-box p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5; }
        .btn-confirm {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Outfit', sans-serif;
            position: relative;
        }
        .btn-confirm:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--primary-glow); }
        @media (max-width: 480px) {
            body {
                overflow: auto;
            }
            .register-container {
                padding: 24px 20px;
                border-radius: 24px;
                max-width: calc(100% - 24px);
                margin: 16px auto;
            }
            .logo-area {
                margin-bottom: 24px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0px;
            }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="register-container">
        <div class="logo-area">
            <div class="logo-icon">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path><path d="M12 6v6l4 2"></path></svg>
            </div>
            <div class="logo-text">AI CHATBOT</div>
            <p style="color: var(--text-dim); margin-top: 8px; font-size: 0.9rem;">Create your account to get started</p>
        </div>

        <form id="register-form">
            <div class="form-row">
                <div class="input-group">
                    <label>First Name</label>
                    <input type="text" id="first_name" placeholder="John" required>
                </div>
                <div class="input-group">
                    <label>Last Name</label>
                    <input type="text" id="last_name" placeholder="Doe" required>
                </div>
            </div>

            <div class="input-group">
                <label>Company Name</label>
                <input type="text" id="company_name" placeholder="Your Company Sdn Bhd" required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@company.com" required oninput="document.getElementById('email-error').style.display='none'">
                <p id="email-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 8px; display: none; background: rgba(239, 68, 68, 0.1); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.3); font-weight: 600;"></p>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="password-field">
                    <input type="password" id="password" placeholder="••••••••" required oninput="checkPasswordStrength(this.value)">
                    <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePasswordVisibility('password', this)">Show</button>
                </div>
                <div id="password-strength-container" style="margin-top: 8px; display: none;">
                    <div style="height: 4px; width: 100%; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;">
                        <div id="strength-bar" style="height: 100%; width: 0%; transition: all 0.3s;"></div>
                    </div>
                    <p id="strength-text" style="font-size: 0.75rem; margin-top: 4px; color: var(--text-dim);"></p>
                </div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <div class="password-field">
                    <input type="password" id="confirm_password" placeholder="••••••••" required oninput="document.getElementById('password-match-error').style.display='none'">
                    <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePasswordVisibility('confirm_password', this)">Show</button>
                </div>
                <p id="password-match-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 6px; display: none;">Passwords do not match.</p>
            </div>

            <div style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 24px; padding: 0 4px; line-height: 1.4;">
                By signing up, you agree to our <a href="#" style="color: var(--primary); text-decoration: none;">Terms of Service</a> and <a href="#" style="color: var(--primary); text-decoration: none;">Privacy Policy</a>.
            </div>

            <div id="general-error" style="color: #ef4444; font-size: 0.9rem; margin-bottom: 16px; display: none; background: rgba(239, 68, 68, 0.1); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.3); font-weight: 600; text-align: center;"></div>

            <button type="submit" class="btn-register" id="submit-btn">
                <span class="btn-text">Create Account</span>
                <div class="loader"></div>
            </button>
        </form>

        <div class="footer-links">
            Already have an account? <a href="login.html">Sign In</a>
        </div>

        <div class="divider">or sign up with</div>

        <div style="display: flex; justify-content: center; width: 100%;">
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="continue_with"
                 data-size="large"
                 data-width="400">
            </div>
        </div>
    </div>

    <!-- Company Name Modal -->
    <div class="modal-overlay" id="company-modal">
        <div class="modal-box">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
                <div style="width:42px;height:42px;background:linear-gradient(135deg,var(--primary),#10b981);border-radius:12px;display:flex;align-items:center;justify-content:center;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                </div>
                <h3>One last step 🎉</h3>
            </div>
            <p>Welcome! Since you're new here, please enter your company name to complete your setup.</p>
            <div class="input-group" style="margin-bottom:20px;">
                <label>Company Name</label>
                <input type="text" id="modal-company-name" placeholder="Your Company Sdn Bhd" style="border-radius:14px;">
            </div>
            <button class="btn-confirm" id="btn-confirm-company" onclick="submitGoogleWithCompany()">
                <span class="btn-confirm-text">Complete Sign Up</span>
                <div class="loader" id="confirm-loader" style="position:absolute;left:50%;margin-left:-10px;"></div>
            </button>
            <button onclick="closeCompanyModal()" style="width:100%;background:none;border:none;color:var(--text-dim);padding:12px;cursor:pointer;font-family:inherit;margin-top:8px;">Cancel</button>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script>
        function togglePasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            button.textContent = isHidden ? 'Hide' : 'Show';
            button.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        }

        function checkPasswordStrength(password) {
            const container = document.getElementById('password-strength-container');
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            
            if (!password) {
                container.style.display = 'none';
                return;
            }
            
            container.style.display = 'block';
            let strength = 0;
            let feedback = "";
            
            if (password.length >= 8) strength += 25;
            if (/[A-Z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password)) strength += 25;
            if (/[!@#$%^&*()\-=_+[\]{}|;:,.<>?]/.test(password)) strength += 25;
            
            bar.style.width = strength + "%";
            
            if (strength <= 25) {
                bar.style.background = "#ef4444";
                feedback = "Weak (Need 8+ chars, caps, nums, symbols)";
            } else if (strength <= 50) {
                bar.style.background = "#f59e0b";
                feedback = "Moderate";
            } else if (strength <= 75) {
                bar.style.background = "#3b82f6";
                feedback = "Good";
            } else {
                bar.style.background = "#10b981";
                feedback = "Strong Password ✨";
            }
            
            text.innerText = feedback;
        }

        const regForm = document.getElementById('register-form');
        const submitBtn = document.getElementById('submit-btn');

        regForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.classList.add('loading');
            document.getElementById('general-error').style.display = 'none';

            const firstName = document.getElementById("first_name").value.trim();
            const lastName = document.getElementById("last_name").value.trim();
            const companyName = document.getElementById("company_name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm_password").value;

            const matchError = document.getElementById('password-match-error');
            if (password !== confirmPassword) {
                matchError.style.display = 'block';
                submitBtn.classList.remove('loading');
                return;
            } else {
                matchError.style.display = 'none';
            }

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        first_name: firstName,
                        last_name: lastName,
                        company_name: companyName,
                        email: email,
                        password: password,
                        confirm_password: confirmPassword
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    const errorMsg = result.message || result.error || "Registration failed.";
                    if (errorMsg.toLowerCase().includes("email") || errorMsg.toLowerCase().includes("user already exists") || errorMsg.toLowerCase().includes("registered")) {
                        const emailError = document.getElementById('email-error');
                        emailError.innerHTML = '⚠️ ' + errorMsg;
                        emailError.style.display = 'block';
                    } else {
                        const generalError = document.getElementById('general-error');
                        generalError.innerHTML = '⚠️ ' + errorMsg;
                        generalError.style.display = 'block';
                    }
                    submitBtn.classList.remove('loading');
                    return;
                }

                // Store email in sessionStorage for the verification page
                sessionStorage.setItem("pending_verification_email", email);
                
                const generalMsg = document.getElementById('general-error');
                generalMsg.innerHTML = '✅ ' + result.message;
                generalMsg.style.color = '#10b981';
                generalMsg.style.background = 'rgba(16, 185, 129, 0.1)';
                generalMsg.style.borderColor = 'rgba(16, 185, 129, 0.3)';
                generalMsg.style.display = 'block';
                
                submitBtn.classList.remove('loading');
                submitBtn.innerHTML = 'Redirecting...';
                
                setTimeout(() => {
                    window.location.href = "verify-email.html";
                }, 1500);

            } catch (error) {
                console.error("Register error:", error);
                alert("Cannot connect to server.");
                submitBtn.classList.remove('loading');
            }
        });

        // ---- Google OAuth Logic ----
        let _pendingGoogleCredential = null;

        function handleGoogleLogin() {
            if (typeof google === 'undefined' || !google.accounts) {
                alert('Google Sign-In is not configured yet.\n\nPlease add your GOOGLE_CLIENT_ID to the .env file.');
                return;
            }
            google.accounts.id.prompt();
        }

        function onGoogleCredentialResponse(response) {
            sendGoogleCredential(response.credential, null);
        }

        async function sendGoogleCredential(credential, companyName) {
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential, company_name: companyName || '' })
                });
                const result = await res.json();

                if (result.status === 'needs_company') {
                    _pendingGoogleCredential = credential;
                    document.getElementById('company-modal').classList.add('open');
                    setTimeout(() => document.getElementById('modal-company-name').focus(), 100);
                    return;
                }

                if (result.status === 'success') {
                    if (!establishAuthenticatedSession(result.user, result.token)) {
                        alert('Sign-up could not be completed. Please try again.');
                        return;
                    }
                    window.location.href = 'bots.html';
                } else {
                    alert(result.message || 'Google sign-up failed. Please try again.');
                }
            } catch (err) {
                console.error('Google auth error:', err);
                alert('Cannot connect to server. Please try again.');
            }
        }

        async function submitGoogleWithCompany() {
            const companyName = document.getElementById('modal-company-name').value.trim();
            if (!companyName) { document.getElementById('modal-company-name').focus(); return; }

            const btn = document.getElementById('btn-confirm-company');
            btn.querySelector('.btn-confirm-text').style.visibility = 'hidden';
            btn.querySelector('#confirm-loader').style.display = 'block';
            btn.disabled = true;

            await sendGoogleCredential(_pendingGoogleCredential, companyName);

            btn.querySelector('.btn-confirm-text').style.visibility = '';
            btn.querySelector('#confirm-loader').style.display = 'none';
            btn.disabled = false;
        }

        function closeCompanyModal() {
            document.getElementById('company-modal').classList.remove('open');
            _pendingGoogleCredential = null;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('modal-company-name').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') submitGoogleWithCompany();
            });
        });
    </script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <div id="g_id_onload"
         data-client_id="255732339270-qo1r1j1il5kkifb5igh8n1dvbl3cl49n.apps.googleusercontent.com"
         data-callback="onGoogleCredentialResponse"
         data-auto_prompt="false">
    </div>
</body>
</html>
