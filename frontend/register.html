<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | AI CHATBOT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --bg: #030816;
            --card-bg: rgba(15, 23, 42, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
            animation: float 20s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
        }

        .blob-1 { top: -10%; left: -10%; }
        .blob-2 { bottom: -10%; right: -10%; background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%); }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.1); }
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            padding: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
            animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), #10b981);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 10px 30px var(--primary-glow);
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 6px;
            margin-left: 4px;
        }

        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px 18px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.4);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn-register {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            position: absolute;
            left: 50%;
            margin-left: -10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-register.loading .btn-text { visibility: hidden; }
        .btn-register.loading .loader { display: block; }

        .footer-links {
            margin-top: 24px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="register-container">
        <div class="logo-area">
            <div class="logo-icon">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path><path d="M12 6v6l4 2"></path></svg>
            </div>
            <div class="logo-text">AI CHATBOT</div>
            <p style="color: var(--text-dim); margin-top: 8px; font-size: 0.9rem;">Create your account to get started</p>
        </div>

        <form id="register-form">
            <div class="form-row">
                <div class="input-group">
                    <label>First Name</label>
                    <input type="text" id="first_name" placeholder="John" required>
                </div>
                <div class="input-group">
                    <label>Last Name</label>
                    <input type="text" id="last_name" placeholder="Doe" required>
                </div>
            </div>

            <div class="input-group">
                <label>Company Name</label>
                <input type="text" id="company_name" placeholder="Your Company Sdn Bhd" required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@company.com" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required oninput="checkPasswordStrength(this.value)">
                <div id="password-strength-container" style="margin-top: 8px; display: none;">
                    <div style="height: 4px; width: 100%; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;">
                        <div id="strength-bar" style="height: 100%; width: 0%; transition: all 0.3s;"></div>
                    </div>
                    <p id="strength-text" style="font-size: 0.75rem; margin-top: 4px; color: var(--text-dim);"></p>
                </div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm_password" placeholder="••••••••" required>
            </div>

            <div style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 24px; padding: 0 4px; line-height: 1.4;">
                By signing up, you agree to our <a href="#" style="color: var(--primary); text-decoration: none;">Terms of Service</a> and <a href="#" style="color: var(--primary); text-decoration: none;">Privacy Policy</a>.
            </div>

            <button type="submit" class="btn-register" id="submit-btn">
                <span class="btn-text">Create Account</span>
                <div class="loader"></div>
            </button>
        </form>

        <div class="footer-links">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <script>
        function checkPasswordStrength(password) {
            const container = document.getElementById('password-strength-container');
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            
            if (!password) {
                container.style.display = 'none';
                return;
            }
            
            container.style.display = 'block';
            let strength = 0;
            let feedback = "";
            
            if (password.length >= 8) strength += 25;
            if (/[A-Z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password)) strength += 25;
            if (/[!@#$%^&*()\-=_+[\]{}|;:,.<>?]/.test(password)) strength += 25;
            
            bar.style.width = strength + "%";
            
            if (strength <= 25) {
                bar.style.background = "#ef4444";
                feedback = "Weak (Need 8+ chars, caps, nums, symbols)";
            } else if (strength <= 50) {
                bar.style.background = "#f59e0b";
                feedback = "Moderate";
            } else if (strength <= 75) {
                bar.style.background = "#3b82f6";
                feedback = "Good";
            } else {
                bar.style.background = "#10b981";
                feedback = "Strong Password ✨";
            }
            
            text.innerText = feedback;
        }

        const regForm = document.getElementById('register-form');
        const submitBtn = document.getElementById('submit-btn');

        regForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.classList.add('loading');

            const firstName = document.getElementById("first_name").value.trim();
            const lastName = document.getElementById("last_name").value.trim();
            const companyName = document.getElementById("company_name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm_password").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                submitBtn.classList.remove('loading');
                return;
            }

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        first_name: firstName,
                        last_name: lastName,
                        company_name: companyName,
                        email: email,
                        password: password,
                        confirm_password: confirmPassword
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    alert(result.message || result.error || "Registration failed.");
                    submitBtn.classList.remove('loading');
                    return;
                }

                // Store email in sessionStorage for the verification page
                sessionStorage.setItem("pending_verification_email", email);
                
                alert(result.message);
                window.location.href = "verify-email.html";

            } catch (error) {
                console.error("Register error:", error);
                alert("Cannot connect to server.");
                submitBtn.classList.remove('loading');
            }
        });
    </script>
</body>
</html>
