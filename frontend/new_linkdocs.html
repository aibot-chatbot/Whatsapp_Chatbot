                                    type="button"
                                    onClick={() => setQuestions([])}
                                    disabled={submitting}
                                >
                                    Clear
                                </button>
                                <button
                                    className="btn btn-primary"
                                    type="submit"
                                    disabled={submitting}
                                >
                                    {submitting ? (
                                        <span>
                                            <span className="spinner"></span> Saving Refinements...
                                        </span>
                                    ) : "Save Refinements & Update AI"}
                                </button>
                            </div>
                        </form>
                    )}
                </div>
            );
        }

        function App() {
            const [file, setFile] = useState(null);
            const [status, setStatus] = useState({ type: "", text: "", action: "" });
            const [isUploading, setIsUploading] = useState(false);
            const [files, setFiles] = useState([]);
            const [activeFile, setActiveFile] = useState("");
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [fileToDelete, setFileToDelete] = useState(null);
            const [activeTab, setActiveTab] = useState("file");
            const [linkUrl, setLinkUrl] = useState("");
            const [activeViewTab, setActiveViewTab] = useState("sources");
            const [subscription, setSubscription] = useState(null);
            const [loadingSub, setLoadingSub] = useState(true);

            const fetchSubscription = async () => {
                try {
                    const res = await authenticatedFetch("/api/billing/subscription");
                    const data = await res.json();
                    if (res.ok && data.status === "success") {
                        setSubscription(data.data);
                    }
                } catch (err) {
                    console.error("Failed to load subscription info:", err);
                } finally {
                    setLoadingSub(false);
                }
            };

            const planCode = subscription?.plan?.code || "free";
            const planFeatureFlags = subscription?.plan?.feature_flags || {};

            const hasFeatureAccess = (featureKey) => {
                if (planFeatureFlags && typeof planFeatureFlags === "object" && featureKey in planFeatureFlags) {
                    return planFeatureFlags[featureKey] === true;
                }
                if (window.SubscriptionPlanCatalog && window.SubscriptionPlanCatalog.plans) {
                    const planDef = window.SubscriptionPlanCatalog.plans.find(p => p.code === planCode);
                    if (planDef && planDef.feature_flags) {
                        return planDef.feature_flags[featureKey] === true;
                    }
                }
                return false;
            };


            // Interactive Crawler State Variables
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [analyzedLinks, setAnalyzedLinks] = useState([]);
            const [selectedLinks, setSelectedLinks] = useState({});
            const [crawlStep, setCrawlStep] = useState("input"); // "input", "select", or "refine"
            const [refinedText, setRefinedText] = useState("");
            const [isExtracting, setIsExtracting] = useState(false);
            const [extractedPrimaryUrl, setExtractedPrimaryUrl] = useState("");

            // README View State Variables
            const [isReadmeOpen, setIsReadmeOpen] = useState(false);
            const [readmeText, setReadmeText] = useState("");
            const [loadingReadme, setLoadingReadme] = useState(false);
            const [readmeSearchQuery, setReadmeSearchQuery] = useState("");
            const [readmeMatchIndices, setReadmeMatchIndices] = useState([]);
            const [readmeCurrentMatchIdx, setReadmeCurrentMatchIdx] = useState(-1);

            // History Log State Variables
            const [isHistoryOpen, setIsHistoryOpen] = useState(false);
            const [historyLogs, setHistoryLogs] = useState([]);
            const [loadingHistory, setLoadingHistory] = useState(false);
            const [activeHistoryFilter, setActiveHistoryFilter] = useState("All");
            const [expandedHistoryIdx, setExpandedHistoryIdx] = useState(null);

            const urlParams = new URLSearchParams(window.location.search);
            const urlBotId = urlParams.get("bot_id");
            const storedBotId = sessionStorage.getItem("selectedBotId");

            if (!urlBotId && storedBotId) {
                window.location.href = `new_linkdocs.html?bot_id=${encodeURIComponent(storedBotId)}`;
                return null;
            }

            if (!urlBotId) {
                window.location.href = "bots.html";
                return null;
            }

            const selectedBotId = urlBotId;
            sessionStorage.setItem("selectedBotId", selectedBotId);
            const botQuery = `?chatbot_id=${selectedBotId}`;
            const pageQuery = `?bot_id=${selectedBotId}`;
            const [botName, setBotName] = useState("");

            const fetchBotInfo = async () => {
                try {
                    const response = await authenticatedFetch(`/api/bots/${selectedBotId}`);
                    const data = await response.json();

                    if (data.status === "success") {
                        setBotName(data.data.bot_name || "Bot");
                    }
                } catch (error) {
                    setBotName("Bot");
                }
            };

            const getKnowledgeType = (item) => {
                const explicitType = (item?.file_type || "").toLowerCase();
                if (explicitType) return explicitType;

                const name = item?.file_name || item?.name || "";
                return name.startsWith("http://") || name.startsWith("https://") ? "url" : "pdf";
            };

            const isWebsiteKnowledge = (item) => getKnowledgeType(item) === "url";
            const isSourceEnabled = (item) => item?.is_enabled !== false;

            const openModal = () => {
                setStatus({ type: "", text: "", action: "" });
                setFile(null);
                setLinkUrl("");
                setActiveTab("file");
                setIsModalOpen(true);
                // Reset crawler states
                setIsAnalyzing(false);
                setAnalyzedLinks([]);
                setSelectedLinks({});
                setCrawlStep("input");
                setRefinedText("");
                setIsExtracting(false);
                setExtractedPrimaryUrl("");
            };

            const closeModal = () => {
                if (isUploading || isAnalyzing || isExtracting) return;
                setIsModalOpen(false);
                setFile(null);
                setLinkUrl("");
                setActiveTab("file");
                // Reset crawler states
                setIsAnalyzing(false);
                setAnalyzedLinks([]);
                setSelectedLinks({});
                setCrawlStep("input");
                setRefinedText("");
                setIsExtracting(false);
                setExtractedPrimaryUrl("");
            };

            const handleFileSelect = (input) => {
                const selectedFile = input?.files?.[0];
                if (!selectedFile) return;

                if (selectedFile.name.length > 60) {
                    setStatus({
                        type: "error",
                        text: `Filename is too long (${selectedFile.name.length} chars). Maximum allowed is 60 characters.`,
                        action: ""
                    });
                    return;
                }

                if (selectedFile.type !== "application/pdf") {
                    setStatus({ type: "error", text: "Please select a valid PDF file.", action: "" });
                    return;
                }

                setFile(selectedFile);
                setStatus({ type: "", text: "", action: "" });
            };

            const fetchFiles = async () => {
                try {
                    const res = await authenticatedFetch(`/api/knowledge/files${botQuery}`);
                    const data = await res.json();

                    const activeRes = await authenticatedFetch(`/api/knowledge/active${botQuery}`);
                    const activeData = await activeRes.json();

                    if (data.status === "success") {
                        setFiles(data.data || []);
                    }

                    if (activeData.status === "success") {
                        setActiveFile(activeData.data?.file_name || "");
                    }
                } catch (error) {
                    setStatus({ type: "error", text: "Failed to load files from backend.", action: "" });
                }
            };

            const closeReadmeModal = () => {
                setIsReadmeOpen(false);
                setReadmeSearchQuery("");
                setReadmeMatchIndices([]);
                setReadmeCurrentMatchIdx(-1);
            };

            const openReadmeModal = async (fileId) => {
                setLoadingReadme(true);
                setIsReadmeOpen(true);
                setReadmeText("");
                setReadmeSearchQuery("");
                setReadmeMatchIndices([]);
                setReadmeCurrentMatchIdx(-1);
                try {
                    const response = await authenticatedFetch(`/api/knowledge/readme${botQuery}&file_id=${fileId}`);
                    const result = await response.json();
                    if (response.ok && result.status === "success") {
                        setReadmeText(result.data?.content || "No readme content generated yet.");
                    } else {
                        setReadmeText("Failed to load readme content: " + (result.message || "Unknown error"));
                    }
                } catch (err) {
                    setReadmeText("Network error. Failed to load readme.");
                } finally {
                    setLoadingReadme(false);
                }
            };

            const openHistoryModal = async (fileId) => {
                setLoadingHistory(true);
                setIsHistoryOpen(true);
                setHistoryLogs([]);
                setActiveHistoryFilter("All");
                setExpandedHistoryIdx(null);
                try {
                    const response = await authenticatedFetch(`/api/knowledge/history${botQuery}&file_id=${fileId}`);
                    const result = await response.json();
                    if (response.ok && result.status === "success") {
                        setHistoryLogs(result.data?.logs || []);
                    } else {
                        alert("Failed to load history logs: " + (result.message || "Unknown error"));
                    }
                } catch (err) {
                    alert("Network error. Failed to load history logs.");
                } finally {
                    setLoadingHistory(false);
                }
            };

            const renderMarkdownContent = (md) => {
                if (!md) return null;
                const lines = md.split('\n');
                let inList = false;
                let listItems = [];
                let inTable = false;
                let tableHeaders = [];
                let tableRows = [];
                const rendered = [];
                const query = readmeSearchQuery;
                const activeLineIdx = readmeCurrentMatchIdx >= 0 ? readmeMatchIndices[readmeCurrentMatchIdx] : -1;
                let tableHeaderIdx = null;

                const flushList = (key) => {
                    if (listItems.length > 0) {
                        rendered.push(
                            <ul key={`ul-${key}`} style={{ listStyleType: "disc", paddingLeft: "24px", marginBottom: "16px", color: "var(--text-dim)" }}>
                                {listItems}
                            </ul>
                        );
                        listItems = [];
                    }
                };

                const flushTable = (key) => {
                    if (tableRows.length > 0 || tableHeaders.length > 0) {
                        rendered.push(
                            <div key={`table-wrapper-${key}`} style={{ overflowX: "auto", marginBottom: "20px", border: "1px solid var(--glass-border)", borderRadius: "12px", background: "rgba(0,0,0,0.15)" }}>
                                <table style={{ width: "100%", borderCollapse: "collapse", textAlign: "left", fontSize: "0.88rem" }}>
                                    {tableHeaders.length > 0 && (
                                        <thead>
                                            <tr id={tableHeaderIdx !== null ? `readme-line-${tableHeaderIdx}` : undefined} style={{ borderBottom: "2px solid var(--glass-border)", background: "rgba(255,255,255,0.03)" }}>
                                                {tableHeaders}
                                            </tr>
                                        </thead>
                                    )}
                                    <tbody>
                                        {tableRows}
                                    </tbody>
                                </table>
                            </div>
                        );
                        tableHeaders = [];
                        tableRows = [];
                        tableHeaderIdx = null;
                    }
                };

                lines.forEach((line, idx) => {
                    let cleanLine = line.trim();
                    let text = line;

                    if (cleanLine.startsWith("# ")) {
                        flushList(idx);
                        flushTable(idx);
                        inList = false;
                        inTable = false;
                        rendered.push(<h1 key={idx} id={`readme-line-${idx}`} style={{ fontSize: "1.5rem", fontWeight: "700", marginTop: "24px", marginBottom: "12px", color: "var(--text)" }}>{highlightNode(cleanLine.substring(2), query, idx === activeLineIdx)}</h1>);
                        return;
                    }
                    if (cleanLine.startsWith("## ")) {
                        flushList(idx);
                        flushTable(idx);
                        inList = false;
                        inTable = false;
                        rendered.push(<h2 key={idx} id={`readme-line-${idx}`} style={{ fontSize: "1.25rem", fontWeight: "700", marginTop: "20px", marginBottom: "10px", color: "var(--text)", borderBottom: "1px solid rgba(255,255,255,0.08)", paddingBottom: "6px" }}>{highlightNode(cleanLine.substring(3), query, idx === activeLineIdx)}</h2>);
                        return;
                    }
                    if (cleanLine.startsWith("### ")) {
                        flushList(idx);
                        flushTable(idx);
                        inList = false;
                        inTable = false;
                        rendered.push(<h3 key={idx} id={`readme-line-${idx}`} style={{ fontSize: "1.08rem", fontWeight: "600", marginTop: "16px", marginBottom: "8px", color: "var(--text)" }}>{highlightNode(cleanLine.substring(4), query, idx === activeLineIdx)}</h3>);
                        return;
                    }

                    if (cleanLine.startsWith("- ") || cleanLine.startsWith("* ")) {
                        flushTable(idx);
                        inTable = false;
                        inList = true;
                        let itemText = cleanLine.substring(2);
                        let parts = [];
                        let regex = /\*\*(.*?)\*\*/g;
                        let match;
                        let lastIdx = 0;
                        while ((match = regex.exec(itemText)) !== null) {
                            if (match.index > lastIdx) {
                                parts.push(itemText.substring(lastIdx, match.index));
                            }
                            parts.push(<strong key={match.index} style={{ color: "#fff" }}>{match[1]}</strong>);
                            lastIdx = regex.lastIndex;
                        }
                        if (lastIdx < itemText.length) {
                            parts.push(itemText.substring(lastIdx));
                        }
                        listItems.push(
                            <li key={idx} id={`readme-line-${idx}`} style={{ marginBottom: "6px", lineHeight: "1.5" }}>
                                {highlightNode(parts.length > 0 ? parts : itemText, query, idx === activeLineIdx)}
                            </li>
                        );
                        return;
                    }

                    if (cleanLine.startsWith("|")) {
                        flushList(idx);
                        inList = false;
                        inTable = true;
                        if (cleanLine.includes("---")) {
                            return;
                        }
                        const cells = line.split("|").map(c => c.trim()).filter((c, i, arr) => i > 0 && i < arr.length - 1);
                        if (tableHeaders.length === 0 && tableRows.length === 0) {
                            tableHeaderIdx = idx;
                            tableHeaders = cells.map((cell, cIdx) => (
                                <th key={cIdx} style={{ padding: "10px 14px", fontWeight: "600", color: "var(--text-dim)", borderBottom: "1px solid var(--glass-border)" }}>
                                    {highlightNode(cell, query, idx === activeLineIdx)}
                                </th>
                            ));
                        } else {
                            tableRows.push(
                                <tr key={idx} id={`readme-line-${idx}`} style={{ borderBottom: "1px solid rgba(255,255,255,0.03)" }}>
                                    {cells.map((cell, cIdx) => (
                                        <td key={cIdx} style={{ padding: "10px 14px", color: "var(--text-dim)" }}>
                                            {highlightNode(cell, query, idx === activeLineIdx)}
                                        </td>
                                    ))}
                                </tr>
                            );
                        }
                        return;
                    }

                    if (!cleanLine) {
                        flushList(idx);
                        flushTable(idx);
                        inList = false;
                        inTable = false;
                        rendered.push(<div key={idx} id={`readme-line-${idx}`} style={{ height: "8px" }}></div>);
                        return;
                    }

                    flushList(idx);
                    flushTable(idx);
                    inList = false;
                    inTable = false;

                    let parts = [];
                    let regex = /\*\*(.*?)\*\*/g;
                    let match;
                    let lastIdx = 0;
                    while ((match = regex.exec(text)) !== null) {
                        if (match.index > lastIdx) {
                            parts.push(text.substring(lastIdx, match.index));
                        }
                        parts.push(<strong key={match.index} style={{ color: "#fff" }}>{match[1]}</strong>);
                        lastIdx = regex.lastIndex;
                    }
                    if (lastIdx < text.length) {
                        parts.push(text.substring(lastIdx));
                    }

                    rendered.push(
                        <p key={idx} id={`readme-line-${idx}`} style={{ marginBottom: "12px", lineHeight: "1.6", color: "var(--text-dim)" }}>
                            {highlightNode(parts.length > 0 ? parts : text, query, idx === activeLineIdx)}
                        </p>
                    );
                });

                flushList("end");
                flushTable("end");
                return rendered;
            };

            const matchesUploadedPdfName = (candidateName, originalName) => {
                if (!candidateName || !originalName) return false;
                return candidateName === originalName || candidateName.endsWith(`_${originalName}`);
            };

            const findUploadedPdfAfterRejectedRequest = async (originalName, maxAttempts = 6, delayMs = 3000) => {
                for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
                    if (attempt > 0) {
                        await new Promise(resolve => setTimeout(resolve, delayMs));
                    }

                    try {
                        const filesRes = await authenticatedFetch(`/api/knowledge/files${botQuery}`);
                        const filesData = await filesRes.json();
                        const listedFiles = filesData.status === "success" ? (filesData.data || []) : [];
                        const matchedFile = listedFiles.find(item => matchesUploadedPdfName(item.file_name || item.name || "", originalName));

                        const activeRes = await authenticatedFetch(`/api/knowledge/active${botQuery}`);
                        const activeData = await activeRes.json();
                        const activeName = activeData.status === "success" ? (activeData.data?.file_name || "") : "";

                        if (matchedFile || matchesUploadedPdfName(activeName, originalName)) {
                            if (filesData.status === "success") {
                                setFiles(listedFiles);
                            }
                            if (activeData.status === "success") {
                                setActiveFile(activeName);
                            }
                            return true;
                        }
                    } catch (pollError) {
                        // Keep polling; the original upload may still complete while the connection recovers.
                    }
                }

                return false;
            };

            const handleAnalyze = async () => {
                if (!linkUrl) {
                    setStatus({ type: "error", text: "Please enter a website URL.", action: "" });
                    return;
                }
                setIsAnalyzing(true);
                setStatus({ type: "", text: "", action: "" });
                setAnalyzedLinks([]);
                setSelectedLinks({});

                try {
                    const response = await authenticatedFetch(`/api/knowledge/scrape-analyze${botQuery}`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ url: linkUrl }),
                    });

                    const data = await response.json();

                    if (response.ok) {
                        const links = data.data?.links || [];
                        setAnalyzedLinks(links);

                        // Select all by default if batch is allowed, else select only the primary (first) link
                        const initialSelected = {};
                        if (hasFeatureAccess("batch_website_scraping")) {
                            links.forEach(l => {
                                initialSelected[l] = true;
                            });
                        } else if (links.length > 0) {
                            initialSelected[links[0]] = true;
                        }
                        setSelectedLinks(initialSelected);
                        setCrawlStep("select");
                    } else {
                        setStatus({ type: "error", text: `Analysis failed: ${data.message || "Unknown error"}`, action: "" });
                    }
                } catch (error) {
                    setStatus({ type: "error", text: "Network connection failed. Is the backend running?", action: "" });
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const handleToggleLink = (link) => {
                setSelectedLinks(prev => {
                    const isCurrentlySelected = !!prev[link];
                    if (!isCurrentlySelected && !hasFeatureAccess("batch_website_scraping")) {
                        // In single scraping mode, toggle resets other selections to limit to 1
                        return { [link]: true };
                    }
                    return {
                        ...prev,
                        [link]: !isCurrentlySelected
                    };
                });
            };

            const handleToggleAllLinks = () => {
                if (!hasFeatureAccess("batch_website_scraping")) {
                    alert("Batch website scraping is a Pro feature. Upgrade your plan to crawl and select all pages at once.");
                    return;
                }
                const allSelected = analyzedLinks.every(l => selectedLinks[l]);
                const nextSelected = {};
                analyzedLinks.forEach(l => {
                    nextSelected[l] = !allSelected;
                });
                setSelectedLinks(nextSelected);
            };

            const handleExtractContent = async () => {
                const selectedUrls = analyzedLinks.filter(l => selectedLinks[l]);
                if (selectedUrls.length === 0) {
                    setStatus({ type: "error", text: "Please select at least one page to ingest.", action: "" });
                    return;
                }

                setIsExtracting(true);
                setStatus({ type: "", text: "", action: "" });

                try {
                    const response = await authenticatedFetch(`/api/knowledge/scrape-extract${botQuery}`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ urls: selectedUrls }),
                    });

                    const data = await response.json();

                    if (response.ok) {
                        setRefinedText(data.data?.extracted_text || "");
                        setExtractedPrimaryUrl(data.data?.primary_url || selectedUrls[0]);
                        setCrawlStep("refine");
                    } else {
                        setStatus({ type: "error", text: `Extraction failed: ${data.message || "Unknown error"}`, action: "" });
                    }
                } catch (error) {
                    setStatus({ type: "error", text: "Network connection failed. Is the backend running?", action: "" });
                } finally {
                    setIsExtracting(false);
                }
            };

            const handleConfirmIngest = async () => {
                if (!refinedText.trim()) {
                    setStatus({ type: "error", text: "Refined text cannot be empty.", action: "" });
                    return;
                }

                setIsUploading(true);
                setStatus({ type: "", text: "", action: "" });

                try {
                    const response = await authenticatedFetch(`/api/knowledge/scrape-embed${botQuery}`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            text_content: refinedText,
                            primary_url: extractedPrimaryUrl,
                            file_name: extractedPrimaryUrl
                        }),
                    });

                    const data = await response.json();

                    if (response.ok) {
                        setStatus({ type: "success", text: data.data?.message || "Website saved as supporting knowledge.", action: "upload" });
                        setLinkUrl("");
                        setIsModalOpen(false);
                        await fetchFiles();
                    } else {
                        setStatus({ type: "error", text: `Ingestion failed: ${data.message || "Unknown error"}`, action: "" });
                    }
                } catch (error) {
                    setStatus({ type: "error", text: "Network connection failed. Is the backend running?", action: "" });
                } finally {
                    setIsUploading(false);
                }
            };

            const handleUpload = async () => {
                if (!file) {
                    setStatus({ type: "error", text: "Please select a PDF file first.", action: "" });
                    return;
                }

                setIsUploading(true);
                setStatus({ type: "", text: "", action: "" });
                const originalFileName = file.name;

                const formData = new FormData();
                formData.append("pdf_file", file);

                try {
                    const response = await authenticatedFetch(`/upload-pdf${botQuery}`, {
                        method: "POST",
                        body: formData,
                    });

                    if (response.ok) {
                        setStatus({ type: "success", text: "PDF uploaded and set as primary knowledge.", action: "upload" });
                        setFile(null);
                        setIsModalOpen(false);
                        await fetchFiles();
                    } else {
                        const data = await response.json();
                        setStatus({ type: "error", text: `Upload failed: ${data.message || "Unknown error"}`, action: "" });
                    }
                } catch (error) {
                    setStatus({
                        type: "error",
                        text: "Upload is taking longer than expected. The PDF may still be processing. Checking status...",
                        action: ""
                    });

                    const recovered = await findUploadedPdfAfterRejectedRequest(originalFileName);
                    if (recovered) {
                        setStatus({
                            type: "success",
                            text: "PDF uploaded successfully. Processing completed or is available now.",
                            action: "upload"
                        });
                        setFile(null);
                        setIsModalOpen(false);
                        await fetchFiles();
                    } else {
                        setStatus({
                            type: "error",
                            text: "Upload may still be processing. Please refresh this page before retrying to avoid duplicate uploads.",
                            action: ""
                        });
                    }
                } finally {
                    setIsUploading(false);
                }
            };

            const handleSetActive = async (fileName) => {
                try {
                    const response = await authenticatedFetch(`/api/knowledge/set-active${botQuery}`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ file_name: fileName }),
                    });

                    const data = await response.json();

                    if (response.ok) {
                        setStatus({ type: "success", text: data.data?.message || `${fileName} is now the active primary knowledge.`, action: "setActive" });
                        await fetchFiles();
                    } else {
                        setStatus({ type: "error", text: data.message || "Failed to set primary knowledge.", action: "" });
                    }
                } catch (error) {
                    setStatus({ type: "error", text: "Failed to connect to backend.", action: "" });
                }
            };

            const handleToggleSupport = async (fileName, nextEnabled) => {
                try {
                    const response = await authenticatedFetch(`/api/knowledge/toggle-support${botQuery}`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            file_name: fileName,
                            is_enabled: nextEnabled,
                        }),
                    });

                    const data = await response.json();

                    if (response.ok) {
                        setStatus({
                            type: "success",
                            text: data.data?.message || (nextEnabled ? "Supporting website enabled." : "Supporting website disabled."),
                            action: "toggleSupport"
                        });
                        await fetchFiles();
                    } else {
                        setStatus({ type: "error", text: data.message || "Failed to update supporting website.", action: "" });
                    }
                } catch (error) {
                    setStatus({ type: "error", text: "Failed to connect to backend.", action: "" });
                }
            };

            const triggerDeleteFile = (fileName) => {
                setFileToDelete(fileName);
            };

            const confirmDeleteFile = async () => {
                if (!fileToDelete) return;
                const fileName = fileToDelete;
                setFileToDelete(null);

                try {
                    const response = await authenticatedFetch(`/api/knowledge/files/${encodeURIComponent(fileName)}${botQuery}`, {
                        method: "DELETE",
                    });

                    const data = await response.json();

                    if (response.ok) {
                        setStatus({ type: "deleted", text: data.data?.message || `${fileName} deleted successfully.`, action: "delete" });
                        await fetchFiles();
                    } else {
                        setStatus({ type: "error", text: data.message || "Failed to delete knowledge source.", action: "" });
                    }
                } catch (error) {
                    setStatus({ type: "error", text: "Failed to connect to backend.", action: "" });
                }
            };

            const escapeRegExp = (string) => {
                return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            };

            const highlightText = (text, query, isActiveLine) => {
                if (!query || !query.trim() || !text) return text;
                const queryEscaped = escapeRegExp(query);
                const regex = new RegExp(`(${queryEscaped})`, 'gi');
                const textStr = typeof text === 'string' ? text : String(text);
                const textParts = textStr.split(regex);

                return textParts.map((part, index) => {
                    if (part.toLowerCase() === query.toLowerCase()) {
                        return (
                            <mark
                                key={index}
                                style={{
                                    background: isActiveLine ? "#f97316" : "#eab308",
                                    color: "#000",
                                    padding: "0 2px",
                                    borderRadius: "2px",
                                    fontWeight: "bold"
                                }}
                            >
                                {part}
                            </mark>
                        );
                    }
                    return part;
                });
            };

            const highlightNode = (node, query, isActiveLine) => {
                if (typeof node === 'string') {
                    return highlightText(node, query, isActiveLine);
                }
                if (Array.isArray(node)) {
                    return node.map((child, i) => highlightNode(child, query, isActiveLine));
                }
                if (React.isValidElement(node)) {
                    const children = node.props.children;
                    if (children !== undefined) {
                        return React.cloneElement(node, { key: node.key }, highlightNode(children, query, isActiveLine));
                    }
                }
                return node;
            };

            // Effect to calculate search matches when query or text changes
            useEffect(() => {
                if (!readmeSearchQuery.trim() || !readmeText) {
                    setReadmeMatchIndices([]);
                    setReadmeCurrentMatchIdx(-1);
                    return;
                }
                const lines = readmeText.split('\n');
                const query = readmeSearchQuery.toLowerCase();
                const matches = [];
                lines.forEach((line, idx) => {
                    if (line.toLowerCase().includes(query)) {
                        matches.push(idx);
                    }
                });
                setReadmeMatchIndices(matches);
                setReadmeCurrentMatchIdx(matches.length > 0 ? 0 : -1);
            }, [readmeSearchQuery, readmeText]);

            const scrollToMatch = (matchIdx) => {
                if (matchIdx < 0 || matchIdx >= readmeMatchIndices.length) return;
                const lineIdx = readmeMatchIndices[matchIdx];
                const element = document.getElementById(`readme-line-${lineIdx}`);
                if (element) {
                    element.scrollIntoView({ behavior: "smooth", block: "center" });
                }
            };

            // Effect to scroll to the active match
            useEffect(() => {
                if (readmeCurrentMatchIdx >= 0 && readmeMatchIndices.length > 0) {
                    const timer = setTimeout(() => {
                        scrollToMatch(readmeCurrentMatchIdx);
                    }, 50);
                    return () => clearTimeout(timer);
                }
            }, [readmeCurrentMatchIdx]);

            useEffect(() => {
                fetchBotInfo();
                fetchFiles();
                fetchSubscription();
            }, []);

            const totalItems = files.length;
            const trainedCount = files.length;
            const pendingCount = 0;
            const failedCount = 0;
            const totalChars = files.reduce((sum, f) => sum + Number(f.size || 0), 0);

            return (
                <>
                    <chatbot-sidebar></chatbot-sidebar>

                    <main className="main-container">
                        <div className="header">
                            <h1>Knowledge Sources ({botName || "Bot"})</h1>
                            <p>Manage the primary PDF and supporting website sources your AI chatbot uses.</p>
                        </div>

                        {status.text && (
                            <div className={`status-message ${status.type}`}>
                                {status.type === "success" ? "✨" : status.type === "deleted" ? "🗑️" : "⚠️"} {status.text}
                            </div>
                        )}

                        {status.type === "success" && status.action === "setActive" && (
                            <div
                                style={{
                                    marginBottom: "20px",
                                    padding: "18px",
                                    borderRadius: "16px",
                                    background: "rgba(37, 99, 235, 0.08)",
                                    border: "1px solid var(--glass-border)",
                                    textAlign: "left"
                                }}
                            >
                                <div style={{ fontSize: "18px", fontWeight: "700", marginBottom: "8px" }}>
                                    Next step
                                </div>
                                <div style={{ fontSize: "15px", color: "var(--text-dim)", marginBottom: "14px", lineHeight: "1.5" }}>
                                    Please review Bot Configuration so the chatbot matches this primary knowledge source.
                                </div>
                                <a
                                    href={`new_prompt.html${pageQuery}`}
                                    style={{
                                        display: "inline-block",
                                        padding: "10px 16px",
                                        borderRadius: "10px",
                                        textDecoration: "none",
                                        background: "var(--primary)",
                                        color: "white",
                                        fontSize: "14px",
                                        fontWeight: "600"
                                    }}
                                >
                                    Open Bot Configuration
                                </a>
                            </div>
                        )}

                        <div className="stats-row">
                            <div className="glass-card">
                                <div className="stat-label">Files</div>
                                <div className="stat-value">{totalItems}</div>
                            </div>
                            <div className="glass-card">
                                <div className="stat-label">Trained</div>
                                <div className="stat-value">{trainedCount}</div>
                            </div>
                            <div className="glass-card">
                                <div className="stat-label">Pending</div>
                                <div className="stat-value">{pendingCount}</div>
                            </div>
                            <div className="glass-card">
                                <div className="stat-label">Failed</div>
                                <div className="stat-value">{failedCount}</div>
                            </div>
                            <div className="glass-card">
                                <div className="stat-label">Total Size</div>
                                <div className="stat-value">{(totalChars / 1024).toFixed(1)} KB</div>
                            </div>
                        </div>

                        <div className="tabs-nav">
                            <div
                                className={`tab-item ${activeViewTab === "sources" ? "active" : ""}`}
                                onClick={() => setActiveViewTab("sources")}
                                style={{ cursor: "pointer" }}
                            >
                                Primary PDF / Supporting Websites
                            </div>
                            <div
                                className={`tab-item ${activeViewTab === "graph" ? "active" : ""}`}
                                onClick={() => setActiveViewTab("graph")}
                                style={{ cursor: "pointer" }}
                            >
                                Knowledge Graph
                            </div>
                            <div
                                className={`tab-item ${activeViewTab === "refinement" ? "active" : ""}`}
                                onClick={() => setActiveViewTab("refinement")}
                                style={{ cursor: "pointer" }}
                            >
                                Knowledge Refinement Q&A
                            </div>
                        </div>

                        {activeViewTab === "sources" && (
                            <>
                                <div className="action-bar">
                                    <div style={{ display: "flex", gap: "12px", alignItems: "center", flexWrap: "wrap" }}>
                                        <span style={{ fontWeight: 500, fontSize: "0.95rem", marginRight: "12px" }}>
                                            Total sources: {totalItems}
                                        </span>
                                    </div>

                                    <button className="btn btn-primary" type="button" onClick={openModal}>
                                        ➕ Add Knowledge Source
                                    </button>
                                </div>

                                <div className="table-area">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Name</th>
                                                <th>Size</th>
                                                <th>Status</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {files.length === 0 ? (
                                                <tr>
                                                    <td colSpan="4" style={{ color: "var(--text-dim)" }}>
                                                        No knowledge sources added yet.
                                                    </td>
                                                </tr>
                                            ) : (
                                                files.map((f, index) => {
                                                    const websiteSource = isWebsiteKnowledge(f);
                                                    const sourceEnabled = isSourceEnabled(f);
                                                    const isPrimary = !websiteSource && f.is_active;

                                                    return (
                                                        <tr key={index}>
                                                            <td>
                                                                <div className="name-cell">
                                                                    <span>{websiteSource ? "🔗" : "📄"}</span>
                                                                    <span>{f.file_name}</span>
                                                                </div>
                                                            </td>
                                                            <td className="char-count">
                                                                {f.size ? `${(Number(f.size) / 1024).toFixed(1)} KB` : "-"}
                                                            </td>
                                                            <td>
                                                                <span
                                                                    className={`status-badge ${isPrimary || (websiteSource && sourceEnabled) ? "" : "inactive"}`}
                                                                    title={websiteSource ? "Websites are supporting knowledge and cannot be set as primary." : ""}
                                                                >
                                                                    {websiteSource ? `SUPPORTING ${sourceEnabled ? "ENABLED" : "DISABLED"}` : isPrimary ? "ACTIVE PRIMARY" : "AVAILABLE"}
                                                                </span>
                                                            </td>
                                                            <td>
                                                                <div className="table-actions">
                                                                    {!websiteSource && (
                                                                        <React.Fragment>
                                                                            <button
                                                                                className="btn btn-primary"
                                                                                type="button"
                                                                                onClick={() => handleSetActive(f.file_name)}
                                                                                disabled={isPrimary}
                                                                                title={isPrimary ? "This PDF is already the active primary knowledge." : "Set this PDF as primary knowledge"}
                                                                            >
                                                                                {isPrimary ? "Active Primary" : "Set as Primary"}
                                                                            </button>
                                                                            <button
                                                                                className="btn"
                                                                                type="button"
                                                                                onClick={() => openReadmeModal(f.id)}
                                                                                title="Read compiled README knowledge representation"
                                                                                style={{
                                                                                    display: "inline-flex",
                                                                                    alignItems: "center",
                                                                                    justifyContent: "center",
                                                                                    padding: "8px 12px",
                                                                                    marginLeft: "6px",
                                                                                    background: "rgba(255,255,255,0.06)",
                                                                                    border: "1px solid var(--glass-border)",
                                                                                    color: "white",
                                                                                    borderRadius: "10px",
                                                                                    fontSize: "1rem"
                                                                                }}
                                                                            >
                                                                                📖
                                                                            </button>
                                                                            <button
                                                                                className="btn"
                                                                                type="button"
                                                                                onClick={() => openHistoryModal(f.id)}
                                                                                title="Check modification history logs"
                                                                                style={{
                                                                                    display: "inline-flex",
                                                                                    alignItems: "center",
                                                                                    justifyContent: "center",
                                                                                    padding: "8px 12px",
                                                                                    marginLeft: "6px",
                                                                                    background: "rgba(255,255,255,0.06)",
                                                                                    border: "1px solid var(--glass-border)",
                                                                                    color: "white",
                                                                                    borderRadius: "10px",
                                                                                    fontSize: "1rem"
                                                                                }}
                                                                            >
                                                                                📜
                                                                            </button>
                                                                        </React.Fragment>
                                                                    )}

                                                                    {websiteSource && (
                                                                        <button
                                                                            className="btn"
                                                                            type="button"
                                                                            onClick={() => handleToggleSupport(f.file_name, !sourceEnabled)}
                                                                            title={sourceEnabled ? "Temporarily disable this supporting website in AI answers" : "Enable this supporting website for AI answers"}
                                                                        >
                                                                            {sourceEnabled ? "Disable" : "Enable"}
                                                                        </button>
                                                                    )}

                                                                    <button
                                                                        className="btn btn-danger"
                                                                        type="button"
                                                                        onClick={() => triggerDeleteFile(f.file_name)}
                                                                        title={websiteSource ? "Delete this supporting website source" : "Delete this PDF"}
                                                                    >
                                                                        Delete
                                                                    </button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    );
                                                })
                                            )}
                                        </tbody>
                                    </table>
                                </div>

                                <div style={{ marginTop: "12px", textAlign: "right", fontSize: "0.8rem", opacity: 0.6 }}>
                                    {files.length === 0 ? "0 items" : `1-${files.length} of ${files.length} items`}
                                </div>
                            </>
                        )}
                        {activeViewTab === "graph" && (
                            <GraphVisualizer botId={selectedBotId} activeFile={activeFile} />
                        )}
                        {activeViewTab === "refinement" && (
                            <KnowledgeRefinement botId={selectedBotId} hasAccess={hasFeatureAccess("knowledge_refinement")} />
                        )}
                    </main>

                    <div className={`modal-backdrop ${isModalOpen ? "open" : ""}`} onClick={(e) => { if (e.target === e.currentTarget) closeModal(); }}>
                        <div className="modal-content">
                            <h2 style={{ marginBottom: "8px" }}>Add Knowledge Source</h2>
                            <p style={{ color: "var(--text-dim)", fontSize: "0.9rem", marginBottom: "24px" }}>
                                Add a primary PDF or supporting website source.
                            </p>

                            <div className="modal-tabs">
                                <button
                                    className={`modal-tab ${activeTab === "link" ? "active" : ""}`}
                                    type="button"
                                    onClick={() => setActiveTab("link")}
                                    disabled={isUploading || isAnalyzing}
                                >
                                    Supporting Website
                                </button>
                                <button
                                    className={`modal-tab ${activeTab === "file" ? "active" : ""}`}
                                    type="button"
                                    onClick={() => setActiveTab("file")}
                                    disabled={isUploading || isAnalyzing}
                                >
                                    Primary PDF
                                </button>
                            </div>

                            {activeTab === "link" ? (
                                !hasFeatureAccess("single_website_scraping") ? (
                                    <div style={{ padding: "20px 10px", textAlign: "center", width: "100%" }}>
                                        <div style={{ fontSize: "36px", marginBottom: "12px" }}>🔒</div>
                                        <h3 style={{ fontSize: "1.15rem", fontWeight: "700", color: "#f8fafc", marginBottom: "8px" }}>
                                            Website Scraping Requires Upgrade
                                        </h3>
                                        <p style={{ color: "var(--text-dim)", fontSize: "0.88rem", lineHeight: "1.45", marginBottom: "20px", maxWidth: "400px", marginLeft: "auto", marginRight: "auto" }}>
                                            Automatically crawling websites and ingesting pages as supporting knowledge is available starting from the Advanced plan.
                                        </p>
                                        <a href={`pricing.html?bot_id=${urlBotId || storedBotId}`} className="btn btn-primary" style={{ display: "inline-flex", textDecoration: "none", borderRadius: "8px", padding: "8px 20px" }}>
                                            💳 View Pricing & Upgrade
                                        </a>
                                    </div>
                                ) : crawlStep === "input" ? (
                                    <div className="input-group">
                                        <label>Website URL</label>
                                        <input
                                            type="text"
                                            className="modal-input"
                                            value={linkUrl}
                                            onChange={(e) => setLinkUrl(e.target.value)}
                                            placeholder="https://example.com/blog/article-1"
                                            disabled={isAnalyzing}
                                        />
                                        <div style={{ marginTop: "10px", color: "var(--text-dim)", fontSize: "0.85rem" }}>
                                            Enter a website URL to save as supporting knowledge.
                                        </div>
                                        {isAnalyzing && (
                                            <div style={{ marginTop: "15px", display: "flex", alignItems: "center", gap: "10px", color: "var(--primary)" }}>
                                                <span className="spinner"></span>
                                                <span style={{ fontSize: "0.9rem", fontWeight: "600" }}>Finding subpages... (discovered links will load shortly)</span>
                                            </div>
                                        )}
                                    </div>
                                ) : crawlStep === "select" ? (
                                    <div className="input-group">
                                        <label style={{ fontSize: "0.95rem", fontWeight: "700", color: "var(--text-main)", marginBottom: "4px" }}>
                                            Discovered {analyzedLinks.length} subpages
                                        </label>
                                        <div style={{ color: "var(--text-dim)", fontSize: "0.85rem", marginBottom: "15px" }}>
                                            Select which pages from <strong>{linkUrl}</strong> you want to save as supporting knowledge.
                                        </div>

                                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
                                            <span style={{ fontSize: "0.8rem", fontWeight: "700", color: "var(--text-dim)", textTransform: "uppercase", letterSpacing: "0.5px" }}>
                                                Available Pages
                                            </span>
                                            <button
                                                type="button"
                                                onClick={handleToggleAllLinks}
                                                style={{
                                                    background: "transparent",
                                                    border: "none",
                                                    color: "var(--primary)",
                                                    cursor: "pointer",
                                                    fontSize: "0.85rem",
                                                    fontWeight: "600",
                                                    padding: "0"
                                                }}
                                            >
                                                {analyzedLinks.length > 0 && analyzedLinks.every(l => selectedLinks[l]) ? "Deselect All" : "Select All"}
                                            </button>
                                        </div>

                                        {analyzedLinks.length === 0 ? (
                                            <div style={{ padding: "20px", textAlign: "center", color: "var(--text-dim)", fontSize: "0.9rem", border: "1px solid var(--glass-border)", borderRadius: "12px" }}>
                                                No subpages found. You can still ingest the main page.
                                            </div>
                                        ) : (
                                            <div className="link-list-container">
                                                {analyzedLinks.map((link, idx) => (
                                                    <div key={idx} className="link-list-item">
                                                        <input
                                                            type="checkbox"
                                                            id={`link-chk-${idx}`}
                                                            checked={!!selectedLinks[link]}
                                                            onChange={() => handleToggleLink(link)}
                                                        />
                                                        <label htmlFor={`link-chk-${idx}`}>{link}</label>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                        {isExtracting && (
                                            <div style={{ marginTop: "15px", display: "flex", alignItems: "center", gap: "10px", color: "var(--primary)" }}>
                                                <span className="spinner"></span>
                                                <span style={{ fontSize: "0.9rem", fontWeight: "600" }}>Extracting business facts via Gemini... Please wait...</span>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="input-group">
                                        <label style={{ fontSize: "0.95rem", fontWeight: "700", color: "var(--text-main)", marginBottom: "4px" }}>
                                            Review & Refine Extracted Knowledge
                                        </label>
                                        <div style={{ color: "var(--text-dim)", fontSize: "0.85rem", marginBottom: "15px" }}>
                                            Verify and edit the AI-extracted supporting knowledge details below to ensure absolute correctness.
                                        </div>
                                        <textarea
                                            className="modal-input"
                                            value={refinedText}
                                            onChange={(e) => setRefinedText(e.target.value)}
                                            style={{
                                                width: "100%",
                                                height: "220px",
                                                fontFamily: "monospace",
                                                fontSize: "0.85rem",
                                                lineHeight: "1.5",
                                                resize: "vertical"
                                            }}
                                            disabled={isUploading}
                                        />
                                    </div>
                                )
                            ) : (
                                <div>
                                    <div className="drop-zone" onClick={() => document.getElementById("file-input").click()}>
                                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{ marginBottom: "12px", opacity: 0.5 }}>
                                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                            <polyline points="17 8 12 3 7 8"></polyline>
                                            <line x1="12" y1="3" x2="12" y2="15"></line>
                                        </svg>
                                        <p>Click to Upload PDF</p>
                                        <input
                                            type="file"
                                            id="file-input"
                                            style={{ display: "none" }}
                                            accept=".pdf"
                                            onChange={(e) => handleFileSelect(e.target)}
                                        />
                                    </div>

                                    {file && (
                                        <div style={{ marginTop: "12px", fontSize: "0.85rem", color: "var(--primary)", fontWeight: 600 }}>
                                            📄 Selected: {file.name}
                                        </div>
                                    )}
                                    {isUploading && (
                                        <div style={{ marginTop: "12px", fontSize: "0.88rem", color: "var(--text-dim)", lineHeight: "1.45" }}>
                                            Uploading and training your PDF. This may take a few minutes. Please keep this page open and do not refresh.
                                        </div>
                                    )}
                                </div>
                            )}

                            <div className="modal-footer">
                                {activeTab === "link" && crawlStep === "select" && (
                                    <button
                                        className="btn"
                                        type="button"
                                        onClick={() => setCrawlStep("input")}
                                        disabled={isExtracting}
                                        style={{ marginRight: "auto" }}
                                    >
                                        Back
                                    </button>
                                )}
                                {activeTab === "link" && crawlStep === "refine" && (
                                    <button
                                        className="btn"
                                        type="button"
                                        onClick={() => setCrawlStep("select")}
                                        disabled={isUploading}
                                        style={{ marginRight: "auto" }}
                                    >
                                        Back
                                    </button>
                                )}
                                <button className="btn" type="button" onClick={closeModal} disabled={isUploading || isAnalyzing || isExtracting}>
                                    Cancel
                                </button>
                                {activeTab === "link" ? (
                                    !hasFeatureAccess("single_website_scraping") ? null : (
                                        crawlStep === "input" ? (
                                            <button
                                                className="btn btn-primary"
                                                type="button"
                                                onClick={handleAnalyze}
                                                disabled={isAnalyzing || !linkUrl.trim()}
                                            >
                                                {isAnalyzing ? (
                                                    <span>
                                                        <span className="spinner"></span> Analyzing...
                                                    </span>
                                                ) : "Analyze Website"}
                                            </button>
                                        ) : crawlStep === "select" ? (
                                            <button
                                                className="btn btn-primary"
                                                type="button"
                                                onClick={handleExtractContent}
                                                disabled={isExtracting || Object.values(selectedLinks).filter(Boolean).length === 0}
                                            >
                                                {isExtracting ? (
                                                    <span>
                                                        <span className="spinner"></span> Extracting...
                                                    </span>
                                                ) : `Extract & Review (${Object.values(selectedLinks).filter(Boolean).length} Selected)`}
                                            </button>
                                        ) : (
                                            <button
                                                className="btn btn-primary"
                                                type="button"
                                                onClick={handleConfirmIngest}
                                                disabled={isUploading || !refinedText.trim()}
                                            >
                                                {isUploading ? (
                                                    <span>
                                                        <span className="spinner"></span> Ingesting...
                                                    </span>
                                                ) : "Confirm & Ingest"}
                                            </button>
                                        )
                                    )
                                ) : (
                                    <button
                                        className="btn btn-primary"
                                        type="button"
                                        onClick={handleUpload}
                                        disabled={isUploading || !file}
                                    >
                                        {isUploading ? (
                                            <span>
                                                <span className="spinner"></span> Uploading...
                                            </span>
                                        ) : "Add Resource"}
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Readme Pop-out Modal */}
                    <div className={`modal-backdrop ${isReadmeOpen ? "open" : ""}`} onClick={closeReadmeModal}>
                        <div className="modal-content" style={{ maxWidth: "800px", width: "90%", maxHeight: "85vh", display: "flex", flexDirection: "column", padding: "30px", border: "1px solid var(--glass-border)", background: "var(--card-bg)" }} onClick={(e) => e.stopPropagation()}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid var(--glass-border)", paddingBottom: "12px", marginBottom: "16px" }}>
                                <h3 style={{ margin: 0, fontSize: "1.2rem", fontWeight: "700" }}>Knowledge Source README.md</h3>
                                <button className="btn" onClick={closeReadmeModal} style={{ padding: "4px 12px", fontSize: "0.85rem", background: "rgba(255,255,255,0.05)", border: "1px solid var(--glass-border)" }}>✕ Close</button>
                            </div>

                            {/* Search bar row */}
                            {!loadingReadme && readmeText && (
                                <div style={{
                                    display: "flex",
                                    alignItems: "center",
                                    gap: "12px",
                                    marginBottom: "16px",
                                    background: "rgba(15, 23, 42, 0.4)",
                                    border: "1px solid var(--glass-border)",
                                    borderRadius: "16px",
                                    padding: "10px 16px",
                                    flexWrap: "wrap"
                                }}>
                                    <div style={{ position: "relative", flex: 1, minWidth: "200px" }}>
                                        <span style={{ position: "absolute", left: "12px", top: "50%", transform: "translateY(-50%)", opacity: 0.5, pointerEvents: "none" }}>🔍</span>
                                        <input
                                            type="text"
                                            placeholder="Search word in README..."
                                            value={readmeSearchQuery}
                                            onChange={(e) => setReadmeSearchQuery(e.target.value)}
                                            style={{
                                                width: "100%",
                                                background: "transparent",
                                                border: "none",
                                                padding: "8px 8px 8px 36px",
                                                color: "#fff",
                                                outline: "none",
                                                fontSize: "0.9rem"
                                            }}
                                        />
                                        {readmeSearchQuery && (
                                            <button
                                                onClick={() => setReadmeSearchQuery("")}
                                                style={{
                                                    position: "absolute",
                                                    right: "8px",
                                                    top: "50%",
                                                    transform: "translateY(-50%)",
                                                    background: "transparent",
                                                    border: "none",
                                                    color: "var(--text-dim)",
                                                    cursor: "pointer",
                                                    fontSize: "0.9rem"
                                                }}
                                            >
                                                ✕
                                            </button>
                                        )}
                                    </div>

                                    {readmeSearchQuery.trim() && (
                                        <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
