<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links & Documents | AI CHATBOT</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Import Vis.js for Knowledge Graph visualization -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared-glass.css">
    <script src="assets/js/shared-ui.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>requireLogin();requireAdminOrOwner();</script>
    <script src="sidebar-component.js"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --bg: #050b18;
            --sidebar-bg: rgba(15, 23, 42, 0.82);
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #10b981;
            --input-bg: rgba(15, 23, 42, 0.6);
            --error: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        #root {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }


        .nav-list {
            list-style: none;
            flex-grow: 1;
        }

        .nav-item {
            margin-bottom: 8px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dim);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transform: translateX(5px);
        }

        .nav-link.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .dropdown-container {
            margin-bottom: 8px;
        }

        .dropdown-toggle {
            width: 100%;
            justify-content: space-between;
            background: transparent;
            border: none;
            cursor: pointer;
            text-align: left;
        }

        .dropdown-content {
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease-in-out;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dropdown-container.open .dropdown-content {
            max-height: 500px;
            margin-top: 8px;
            padding-bottom: 8px;
        }

        .chevron {
            transition: transform 0.3s;
            opacity: 0.5;
        }

        .dropdown-container.open .chevron {
            transform: rotate(180deg);
            opacity: 1;
        }

        .sub-link {
            font-size: 0.9rem;
            padding: 10px 16px;
        }

        .logout-btn {
            margin-top: auto;
            color: #ef4444;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            text-decoration: none;
            font-weight: 600;
            border-radius: 12px;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .main-container {
            flex: 1;
            padding: 50px 60px;
            display: flex;
            flex-direction: column;
        }

        .header {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .header p {
            color: var(--text-dim);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        /* ===== Glass Cards (from shared-glass.css) ===== */

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .tabs-nav {
            display: flex;
            gap: 30px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
        }

        .tab-item {
            padding-bottom: 12px;
            color: var(--text-dim);
            font-weight: 600;
            position: relative;
            cursor: pointer;
            transition: color 0.3s;
        }

        .tab-item:hover {
            color: var(--text-main);
        }

        .tab-item.active {
            color: var(--text-main);
            font-weight: 700;
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary);
            border-radius: 4px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transition: all 0.3s;
        }

        .btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-primary:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 6px 20px var(--primary-glow);
            background: var(--primary);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.08);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .table-area {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            flex-grow: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(0, 0, 0, 0.2);
        }

        th {
            text-align: left;
            padding: 16px 24px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
        }

        .status-badge.pending {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .status-badge.inactive {
            background: rgba(148, 163, 184, 0.12);
            color: var(--text-dim);
        }

        .status-message {
            margin-bottom: 18px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }

        .status-message.success {
            color: var(--accent);
        }

        .status-message.error {
            color: var(--error);
        }

        .status-message.deleted {
            color: var(--error);
        }

        .name-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 300px;
            word-break: break-all;
            overflow-wrap: anywhere;
        }

        .table-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .table-actions .btn {
            padding: 8px 14px;
            font-size: 0.84rem;
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            width: 100%;
            max-width: 540px;
            padding: 40px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .modal-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
        }

        .modal-tab {
            padding-bottom: 10px;
            cursor: pointer;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
            background: transparent;
            border: none;
        }

        .modal-tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .modal-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .modal-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .drop-zone {
            border: 2px dashed var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            color: var(--text-dim);
            cursor: pointer;
            transition: 0.3s;
        }

        .drop-zone:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 1200px) {
            .stats-row {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }

            .main-container {
                padding: 28px 20px;
            }
        }

        @media (max-width: 700px) {
            .stats-row {
                grid-template-columns: 1fr;
            }

            th:nth-child(2),
            td:nth-child(2),
            th:nth-child(4),
            td:nth-child(4) {
                display: none;
            }
        }

        .link-list-container {
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.4);
            padding: 8px 12px;
            margin-top: 10px;
        }

        .link-list-container::-webkit-scrollbar {
            width: 6px;
        }

        .link-list-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .link-list-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .link-list-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .link-list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
        }

        .link-list-item:last-child {
            border-bottom: none;
        }

        .link-list-item label {
            margin: 0;
            cursor: pointer;
            display: block;
            word-break: break-all;
            flex: 1;
            color: var(--text-main);
        }

        .link-list-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function GraphVisualizer({ botId, activeFile }) {
            const [loadingStatus, setLoadingStatus] = useState("fetching"); // "fetching", "stabilizing", "done"
            const [stabilizationPercent, setStabilizationPercent] = useState(0);
            const [error, setError] = useState("");
            const [selectedNode, setSelectedNode] = useState(null);
            const [hoveredNode, setHoveredNode] = useState(null);
            
            // Graph Data States
            const [rawNodes, setRawNodes] = useState([]);
            const [rawEdges, setRawEdges] = useState([]);
            const [activeFilters, setActiveFilters] = useState(new Set());
            const [nodeCounts, setNodeCounts] = useState({});

            // 1. Fetch graph data once
            useEffect(() => {
                setLoadingStatus("fetching");
                setStabilizationPercent(0);
                setError("");
                setSelectedNode(null);
                setHoveredNode(null);

                authenticatedFetch(`/api/knowledge/graph?chatbot_id=${botId}`)
                    .then(res => res.json())
                    .then(result => {
                        if (result.status === "success") {
                            const nodes = result.data.nodes || [];
                            const edges = result.data.edges || [];
                            setRawNodes(nodes);
                            setRawEdges(edges);

                            if (nodes.length === 0) {
                                setError("No knowledge graph nodes generated yet. Upload a PDF or add website sources to populate the graph.");
                                setLoadingStatus("done");
                                return;
                            }

                            // Calculate node counts for each category
                            const counts = {};
                            const initialFilters = new Set();
                            nodes.forEach(node => {
                                counts[node.group] = (counts[node.group] || 0) + 1;
                                initialFilters.add(node.group);
                            });
                            setNodeCounts(counts);
                            setActiveFilters(initialFilters);
                        } else {
                            setError(result.message || "Failed to load graph data.");
                            setLoadingStatus("done");
                        }
                    })
                    .catch(err => {
                        setLoadingStatus("done");
                        setError("Error connecting to backend API.");
                    });
            }, [botId, activeFile]);

            // 2. Render and manage vis.js network when activeFilters change
            useEffect(() => {
                if (rawNodes.length === 0) return;

                const container = document.getElementById("network-graph-canvas");
                if (!container) return;

                // Filter nodes based on active checkboxes
                const filteredNodes = rawNodes.filter(n => activeFilters.has(n.group));
                
                // Filter edges to only keep connections where both source & target exist in active nodes
                const activeNodeIds = new Set(filteredNodes.map(n => n.id));
                const filteredEdges = rawEdges.filter(e => activeNodeIds.has(e.from) && activeNodeIds.has(e.to));

                if (filteredNodes.length === 0) {
                    container.innerHTML = "<div style='display:flex;width:100%;height:100%;align-items:center;justify-content:center;color:var(--text-dim);font-size:0.9rem;'>No categories selected. Check the filters on the right.</div>";
                    setLoadingStatus("done");
                    return;
                }

                // Define colors
                const groupColors = {
                    "Company": "#3b82f6",
                    "Brand": "#60a5fa",
                    "Category": "#93c5fd",
                    "Product": "#10b981",
                    "Service": "#8b5cf6",
                    "Package": "#f59e0b",
                    "Accessory": "#34d399",
                    "Price": "#06b6d4",
                    "Warranty": "#14b8a6",
                    "Promotion": "#fb7185",
                    "Branch": "#ec4899",
                    "Supplier": "#a855f7",
                    "Customer Segment": "#c084fc",
                    "Policy": "#ef4444",
                    "FAQ": "#f97316",
                    "Staff": "#fbbf24",
                    "Schedule": "#a7f3d0",
                    "Location": "#22c55e",
                    "Requirement": "#f43f5e",
                    "Event": "#d946ef"
                };

                const nodesWithColors = filteredNodes.map(node => {
                    const color = groupColors[node.group] || "#94a3b8";
                    return {
                        ...node,
                        size: 22,
                        color: {
                            background: "#0f172a", // Solid dark background so line lines don't bleed through
                            border: color,
                            highlight: {
                                background: color,
                                border: "#ffffff"
                            },
                            hover: {
                                background: "rgba(30, 41, 59, 1)",
                                border: "#ffffff"
                            }
                        },
                        font: { 
                            color: "#ffffff", 
                            face: "Outfit", 
                            size: 13, 
                            strokeWidth: 4, 
                            strokeColor: "#050b18" // Outlines label text for extreme readability on dark background
                        },
                        borderWidth: 3,
                        borderWidthSelected: 5
                    };
                });

                const graphData = {
                    nodes: new vis.DataSet(nodesWithColors),
                    edges: new vis.DataSet(filteredEdges)
                };

                const options = {
                    nodes: {
                        shape: "dot",
                    },
                    edges: {
                        width: 2, // Thicker relation lines
                        font: { 
                            size: 10, 
                            align: "top", 
                            color: "#cbd5e1", // Light gray for relationship text
                            strokeWidth: 3, 
                            strokeColor: "#050b18", // Outline for relationship text
                            face: "Outfit" 
                        },
                        arrows: { to: { enabled: true, scaleFactor: 0.6 } },
                        color: { color: "rgba(255, 255, 255, 0.35)", highlight: "#3b82f6", hover: "rgba(255, 255, 255, 0.6)" },
                        smooth: { enabled: true, type: "dynamic", roundness: 0.5 }
                    },
                    interaction: {
                        hover: true,
                        hoverConnectedEdges: true,
                        selectConnectedEdges: true
                    },
                    physics: {
                        enabled: true,
                        solver: "forceAtlas2Based",
                        forceAtlas2Based: {
                            gravitationalConstant: -100,
                            centralGravity: 0.015,
                            springLength: 120,
                            springConstant: 0.08
                        },
                        stabilization: {
                            enabled: true,
                            iterations: 200,
                            updateInterval: 10
                        }
                    }
                };

                const network = new vis.Network(container, graphData, options);

                network.on("stabilizationProgress", function (params) {
                    setLoadingStatus("stabilizing");
                    const progress = Math.round((params.iterations / params.total) * 100);
                    setStabilizationPercent(progress);
                });

                network.on("stabilizationIterationsDone", function () {
                    setLoadingStatus("done");
                });

                // Fallback timeout to guarantee loading overlay disappears after 2 seconds
                const fallbackTimeout = setTimeout(() => {
                    setLoadingStatus("done");
                }, 2000);

                network.on("click", function (params) {
                    if (params.nodes.length > 0) {
                        const nodeId = params.nodes[0];
                        const nodeObj = rawNodes.find(n => n.id === nodeId);
                        setSelectedNode(nodeObj);
                    } else {
                        setSelectedNode(null);
                    }
                });

                network.on("hoverNode", function (params) {
                    const nodeId = params.node;
                    const nodeObj = rawNodes.find(n => n.id === nodeId);
                    setHoveredNode(nodeObj);
                });

                network.on("blurNode", function () {
                    setHoveredNode(null);
                });

                return () => {
                    clearTimeout(fallbackTimeout);
                    network.destroy();
                };
            }, [rawNodes, rawEdges, activeFilters]);

            const handleToggleFilter = (group) => {
                const nextFilters = new Set(activeFilters);
                if (nextFilters.has(group)) {
                    nextFilters.delete(group);
                } else {
                    nextFilters.add(group);
                }
                setActiveFilters(nextFilters);
            };

            const handleSelectAllFilters = () => {
                const allGroups = new Set(rawNodes.map(n => n.group));
                setActiveFilters(allGroups);
            };

            const handleClearAllFilters = () => {
                setActiveFilters(new Set());
            };

            // Get relations for the selected node
            const getSelectedNodeRelations = () => {
                if (!selectedNode) return [];
                const nodeId = selectedNode.id;
                const relations = [];

                rawEdges.forEach(edge => {
                    if (edge.from === nodeId) {
                        relations.push({
                            type: "source",
                            rel: edge.label || edge.title || "CONNECTED_TO",
                            target: edge.to
                        });
                    } else if (edge.to === nodeId) {
                        relations.push({
                            type: "target",
                            rel: edge.label || edge.title || "CONNECTED_TO",
                            source: edge.from
                        });
                    }
                });

                return relations;
            };

            const selectedRelations = getSelectedNodeRelations();
            const categories = Object.keys(nodeCounts).sort();

            const groupColors = {
                "Company": "#3b82f6",
                "Brand": "#60a5fa",
                "Category": "#93c5fd",
                "Product": "#10b981",
                "Service": "#8b5cf6",
                "Package": "#f59e0b",
                "Accessory": "#34d399",
                "Price": "#06b6d4",
                "Warranty": "#14b8a6",
                "Promotion": "#fb7185",
                "Branch": "#ec4899",
                "Supplier": "#a855f7",
                "Customer Segment": "#c084fc",
                "Policy": "#ef4444",
                "FAQ": "#f97316",
                "Staff": "#fbbf24",
                "Schedule": "#a7f3d0",
                "Location": "#22c55e",
                "Requirement": "#f43f5e",
                "Event": "#d946ef"
            };

            return (
                <div style={{ display: "flex", gap: "20px", height: "650px", position: "relative", marginTop: "10px" }}>
                    {loadingStatus !== "done" && (
                        <div style={{ position: "absolute", top: "0", left: "0", width: "100%", height: "100%", background: "rgba(5, 11, 24, 0.7)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: "12px", zIndex: 10, borderRadius: "24px", backdropFilter: "blur(4px)" }}>
