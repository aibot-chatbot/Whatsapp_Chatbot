<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links & Documents | AI CHATBOT</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Import Vis.js for Knowledge Graph visualization -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared-glass.css">
    <script src="assets/js/shared-ui.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/plan-catalog.js"></script>
    <script>requireLogin();requireAdminOrOwner();</script>
    <script src="sidebar-component.js"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --bg: #050b18;
            --sidebar-bg: rgba(15, 23, 42, 0.82);
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #10b981;
            --input-bg: rgba(15, 23, 42, 0.6);
            --error: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        #root {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }


        .nav-list {
            list-style: none;
            flex-grow: 1;
        }

        .nav-item {
            margin-bottom: 8px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dim);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transform: translateX(5px);
        }

        .nav-link.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .dropdown-container {
            margin-bottom: 8px;
        }

        .dropdown-toggle {
            width: 100%;
            justify-content: space-between;
            background: transparent;
            border: none;
            cursor: pointer;
            text-align: left;
        }

        .dropdown-content {
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease-in-out;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dropdown-container.open .dropdown-content {
            max-height: 500px;
            margin-top: 8px;
            padding-bottom: 8px;
        }

        .chevron {
            transition: transform 0.3s;
            opacity: 0.5;
        }

        .dropdown-container.open .chevron {
            transform: rotate(180deg);
            opacity: 1;
        }

        .sub-link {
            font-size: 0.9rem;
            padding: 10px 16px;
        }

        .logout-btn {
            margin-top: auto;
            color: #ef4444;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            text-decoration: none;
            font-weight: 600;
            border-radius: 12px;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .main-container {
            flex: 1;
            padding: 50px 60px;
            display: flex;
            flex-direction: column;
        }

        .header {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .header p {
            color: var(--text-dim);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        /* ===== Glass Cards (from shared-glass.css) ===== */

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .tabs-nav {
            display: flex;
            gap: 30px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
        }

        .tab-item {
            padding-bottom: 12px;
            color: var(--text-dim);
            font-weight: 600;
            position: relative;
            cursor: pointer;
            transition: color 0.3s;
        }

        .tab-item:hover {
            color: var(--text-main);
        }

        .tab-item.active {
            color: var(--text-main);
            font-weight: 700;
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary);
            border-radius: 4px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transition: all 0.3s;
        }

        .btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-primary:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 6px 20px var(--primary-glow);
            background: var(--primary);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.08);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .table-area {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            flex-grow: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(0, 0, 0, 0.2);
        }

        th {
            text-align: left;
            padding: 16px 24px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
        }

        .status-badge.pending {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .status-badge.inactive {
            background: rgba(148, 163, 184, 0.12);
            color: var(--text-dim);
        }

        .status-message {
            margin-bottom: 18px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }

        .status-message.success {
            color: var(--accent);
        }

        .status-message.error {
            color: var(--error);
        }

        .status-message.deleted {
            color: var(--error);
        }

        .name-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 300px;
            word-break: break-all;
            overflow-wrap: anywhere;
        }

        .table-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .table-actions .btn {
            padding: 8px 14px;
            font-size: 0.84rem;
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            width: 100%;
            max-width: 540px;
            padding: 40px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .modal-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
        }

        .modal-tab {
            padding-bottom: 10px;
            cursor: pointer;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
            background: transparent;
            border: none;
        }

        .modal-tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .modal-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .modal-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .drop-zone {
            border: 2px dashed var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            color: var(--text-dim);
            cursor: pointer;
            transition: 0.3s;
        }

        .drop-zone:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 1200px) {
            .stats-row {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }

            .main-container {
                padding: 28px 20px;
            }
        }

        @media (max-width: 700px) {
            .stats-row {
                grid-template-columns: 1fr;
            }

            th:nth-child(2),
            td:nth-child(2),
            th:nth-child(4),
            td:nth-child(4) {
                display: none;
            }
        }

        .link-list-container {
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.4);
            padding: 8px 12px;
            margin-top: 10px;
        }

        .link-list-container::-webkit-scrollbar {
            width: 6px;
        }

        .link-list-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .link-list-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .link-list-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .link-list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
        }

        .link-list-item:last-child {
            border-bottom: none;
        }

        .link-list-item label {
            margin: 0;
            cursor: pointer;
            display: block;
            word-break: break-all;
            flex: 1;
            color: var(--text-main);
        }

        .link-list-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        @keyframes scaleUp {
            from {
                transform: scale(0.95);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function GraphVisualizer({ botId, activeFile }) {
            const [loadingStatus, setLoadingStatus] = useState("fetching"); // "fetching", "stabilizing", "done"
            const [stabilizationPercent, setStabilizationPercent] = useState(0);
            const [error, setError] = useState("");
            const [selectedNode, setSelectedNode] = useState(null);
            const [hoveredNode, setHoveredNode] = useState(null);

            // Graph Data States
            const [rawNodes, setRawNodes] = useState([]);
            const [rawEdges, setRawEdges] = useState([]);
            const [activeFilters, setActiveFilters] = useState(new Set());
            const [nodeCounts, setNodeCounts] = useState({});

            // Graph CRUD/Editing States
            const [isEditingNode, setIsEditingNode] = useState(false);
            const [editName, setEditName] = useState("");
            const [editGroup, setEditGroup] = useState("");
            const [editDesc, setEditDesc] = useState("");
            const [editError, setEditError] = useState("");
            const [editSuccess, setEditSuccess] = useState("");
            const [isSaving, setIsSaving] = useState(false);

            // Add Node States
            const [isAddingNode, setIsAddingNode] = useState(false);
            const [newName, setNewName] = useState("");
            const [newGroup, setNewGroup] = useState("Company");
            const [newDesc, setNewDesc] = useState("");

            // Add Relationship States
            const [newRelType, setNewRelType] = useState("CONNECTED_TO");
            const [newRelTarget, setNewRelTarget] = useState("");
            const [customRelType, setCustomRelType] = useState("");

            // Confirm Relation Modal States
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [confirmDetails, setConfirmDetails] = useState({ sourceLabel: "", targetLabel: "", relType: "" });
            const [deleteNodeTarget, setDeleteNodeTarget] = useState(null);
            const [deleteRelationTarget, setDeleteRelationTarget] = useState(null);
            const [isDeletingGraphItem, setIsDeletingGraphItem] = useState(false);

            const ALLOWED_GROUPS = [
                "Company", "Brand", "Category", "Product", "Service", "Package", "Accessory",
                "Price", "Warranty", "Promotion", "Branch", "Supplier", "Customer Segment",
                "Policy", "FAQ", "Staff", "Schedule", "Location", "Requirement", "Event"
            ];

            const COMMON_RELATIONS = [
                "CONNECTED_TO", "HAS_PRICE", "LOCATED_IN", "WARRANTY_FOR", "PROMOTION_FOR",
                "OFFERS", "FAQ_FOR", "SUPPLIED_BY", "HAS_SCHEDULE", "MEMBER_OF", "ACCESSIBLE_BY"
            ];

            // Helper to capitalize first letter
            const capitalize = (str) => {
                if (!str) return "";
                return str.charAt(0).toUpperCase() + str.slice(1);
            };

            // Load graph data from backend
            const loadGraphData = () => {
                setLoadingStatus("fetching");
                setStabilizationPercent(0);
                setError("");
                setSelectedNode(null);
                setHoveredNode(null);
                setIsEditingNode(false);
                setIsAddingNode(false);

                authenticatedFetch(`/api/knowledge/graph?chatbot_id=${botId}`)
                    .then(async res => {
                        const isJson = res.headers.get("content-type")?.includes("application/json");
                        const data = isJson ? await res.json() : null;
                        if (!res.ok) {
                            const msg = data?.message || `HTTP ${res.status}: Failed to load graph data.`;
                            return { status: "error", message: msg, statusCode: res.status };
                        }
                        return data || { status: "error", message: "Empty response from server." };
                    })
                    .then(result => {
                        if (result.status === "success") {
                            const nodes = result.data.nodes || [];
                            const edges = result.data.edges || [];
                            setRawNodes(nodes);
                            setRawEdges(edges);

                            if (nodes.length === 0) {
                                setError("No knowledge graph nodes generated yet. Upload a PDF or add website sources to populate the graph.");
                                setLoadingStatus("done");
                                return;
                            }

                            // Calculate node counts for each category
                            const counts = {};
                            const initialFilters = new Set();
                            nodes.forEach(node => {
                                counts[node.group] = (counts[node.group] || 0) + 1;
                                initialFilters.add(node.group);
                            });
                            setNodeCounts(counts);
                            setActiveFilters(initialFilters);
                        } else {
                            let errMsg = result.message || "Failed to load graph data.";
                            if (result.statusCode === 402 && !errMsg.includes("402")) {
                                errMsg = `[402 Payment Required] ${errMsg}`;
                            }
                            setError(errMsg);
                            setLoadingStatus("done");
                        }
                    })
                    .catch(err => {
                        setLoadingStatus("done");
                        setError("Error connecting to backend API. " + err.message);
                    });
            };

            // Fetch graph data on mount or change of chatbot / file
            useEffect(() => {
                loadGraphData();
            }, [botId, activeFile]);

            // Render and manage vis.js network when activeFilters change
            useEffect(() => {
                if (rawNodes.length === 0) return;

                const container = document.getElementById("network-graph-canvas");
                if (!container) return;

                // Filter nodes based on active checkboxes
                const filteredNodes = rawNodes.filter(n => activeFilters.has(n.group));

                // Filter edges to only keep connections where both source & target exist in active nodes
                const activeNodeIds = new Set(filteredNodes.map(n => n.id));
                const filteredEdges = rawEdges
                    .filter(e => activeNodeIds.has(e.from) && activeNodeIds.has(e.to))
                    .map((e, idx) => ({
                        ...e,
                        id: e.id || `edge-${e.from}-${e.to}-${idx}`
                    }));

                if (filteredNodes.length === 0) {
                    container.innerHTML = "<div style='display:flex;width:100%;height:100%;align-items:center;justify-content:center;color:var(--text-dim);font-size:0.9rem;'>No categories selected. Check the filters on the right.</div>";
                    setLoadingStatus("done");
                    return;
                }

                // Define colors
                const groupColors = {
                    "Company": "#3b82f6",
                    "Brand": "#60a5fa",
                    "Category": "#93c5fd",
                    "Product": "#10b981",
                    "Service": "#8b5cf6",
                    "Package": "#f59e0b",
                    "Accessory": "#34d399",
                    "Price": "#06b6d4",
                    "Warranty": "#14b8a6",
                    "Promotion": "#fb7185",
                    "Branch": "#ec4899",
                    "Supplier": "#a855f7",
                    "Customer Segment": "#c084fc",
                    "Policy": "#ef4444",
                    "FAQ": "#f97316",
                    "Staff": "#fbbf24",
                    "Schedule": "#a7f3d0",
                    "Location": "#22c55e",
                    "Requirement": "#f43f5e",
                    "Event": "#d946ef"
                };

                const nodesWithColors = filteredNodes.map(node => {
                    const color = groupColors[node.group] || "#94a3b8";
                    return {
                        ...node,
                        size: 22,
                        color: {
                            background: "#0f172a", // Solid dark background so line lines don't bleed through
                            border: color,
                            highlight: {
                                background: color,
                                border: "#ffffff"
                            },
                            hover: {
                                background: "rgba(30, 41, 59, 1)",
                                border: "#ffffff"
                            }
                        },
                        font: {
                            color: "#ffffff",
                            face: "Outfit",
                            size: 13,
                            strokeWidth: 4,
                            strokeColor: "#050b18" // Outlines label text for extreme readability on dark background
                        },
                        borderWidth: 3,
                        borderWidthSelected: 5
                    };
                });

                const graphData = {
                    nodes: new vis.DataSet(nodesWithColors),
                    edges: new vis.DataSet(filteredEdges)
                };

                const options = {
                    nodes: {
                        shape: "dot",
                    },
                    edges: {
                        width: 2, // Thicker relation lines
                        font: {
                            size: 10,
                            align: "top",
                            color: "#cbd5e1", // Light gray for relationship text
                            strokeWidth: 3,
                            strokeColor: "#050b18", // Outline for relationship text
                            face: "Outfit"
                        },
                        arrows: { to: { enabled: true, scaleFactor: 0.6 } },
                        color: { color: "rgba(255, 255, 255, 0.35)", highlight: "#3b82f6", hover: "rgba(255, 255, 255, 0.6)" },
                        smooth: { enabled: true, type: "dynamic", roundness: 0.5 }
                    },
                    interaction: {
                        hover: true,
                        hoverConnectedEdges: true,
                        selectConnectedEdges: true
                    },
                    physics: {
                        enabled: true,
                        solver: "forceAtlas2Based",
                        forceAtlas2Based: {
                            gravitationalConstant: -100,
                            centralGravity: 0.015,
                            springLength: 120,
                            springConstant: 0.08
                        },
                        stabilization: {
                            enabled: true,
                            iterations: 200,
                            updateInterval: 10
                        }
                    }
                };

                const network = new vis.Network(container, graphData, options);

                network.on("stabilizationProgress", function (params) {
                    setLoadingStatus("stabilizing");
                    const progress = Math.round((params.iterations / params.total) * 100);
                    setStabilizationPercent(progress);
                });

                network.on("stabilizationIterationsDone", function () {
                    setLoadingStatus("done");
                });

                // Fallback timeout to guarantee loading overlay disappears after 2 seconds
                const fallbackTimeout = setTimeout(() => {
                    setLoadingStatus("done");
                }, 2000);

                network.on("click", function (params) {
                    if (params.nodes.length > 0) {
                        const selectedId = params.nodes[0];

                        // Highlights selected node & neighbors, dims all other nodes
                        const connectedNodes = network.getConnectedNodes(selectedId);
                        const neighbors = new Set(connectedNodes);
                        neighbors.add(selectedId);

                        const updatedNodes = nodesWithColors.map(node => {
                            const isNeighbor = neighbors.has(node.id);
                            const baseColor = groupColors[node.group] || "#94a3b8";
                            return {
                                id: node.id,
                                color: {
                                    background: isNeighbor ? "#0f172a" : "rgba(15, 23, 42, 0.15)",
                                    border: isNeighbor ? baseColor : "rgba(148, 163, 184, 0.15)",
                                    highlight: {
                                        background: baseColor,
                                        border: "#ffffff"
                                    },
                                    hover: {
                                        background: isNeighbor ? "rgba(30, 41, 59, 1)" : "rgba(15, 23, 42, 0.15)",
                                        border: isNeighbor ? "#ffffff" : "rgba(148, 163, 184, 0.15)"
                                    }
                                },
                                font: {
                                    color: isNeighbor ? "#ffffff" : "rgba(255, 255, 255, 0.15)",
                                    face: "Outfit",
                                    size: 13,
                                    strokeWidth: 4,
                                    strokeColor: isNeighbor ? "#050b18" : "rgba(5, 11, 24, 0.15)"
                                }
                            };
                        });
                        graphData.nodes.update(updatedNodes);

                        // Highlight connected edges, dims others
                        const updatedEdges = filteredEdges.map(edge => {
                            const isConnected = edge.from === selectedId || edge.to === selectedId;
                            return {
                                id: edge.id,
                                color: {
                                    color: isConnected ? "rgba(59, 130, 246, 0.95)" : "rgba(255, 255, 255, 0.05)",
                                    highlight: "#3b82f6"
                                },
                                width: isConnected ? 3 : 1
                            };
                        });
                        graphData.edges.update(updatedEdges);

                        const nodeObj = rawNodes.find(n => n.id === selectedId);
                        setSelectedNode(nodeObj);
                        setIsEditingNode(false);
                        setIsAddingNode(false);
                    } else {
                        // Reset all nodes
                        const resetNodes = nodesWithColors.map(node => {
                            const baseColor = groupColors[node.group] || "#94a3b8";
                            return {
                                id: node.id,
                                color: {
                                    background: "#0f172a",
                                    border: baseColor
                                },
                                font: {
                                    color: "#ffffff",
                                    face: "Outfit",
                                    size: 13,
                                    strokeWidth: 4,
                                    strokeColor: "#050b18"
                                }
                            };
                        });
                        graphData.nodes.update(resetNodes);

                        // Reset all edges
                        const resetEdges = filteredEdges.map(edge => {
                            return {
                                id: edge.id,
                                color: {
                                    color: "rgba(255, 255, 255, 0.35)"
                                },
                                width: 2
                            };
                        });
                        graphData.edges.update(resetEdges);

                        setSelectedNode(null);
                        setIsEditingNode(false);
                    }
                });

                network.on("hoverNode", function (params) {
                    const nodeId = params.node;
                    const nodeObj = rawNodes.find(n => n.id === nodeId);
                    setHoveredNode(nodeObj);
                });

                network.on("blurNode", function () {
                    setHoveredNode(null);
                });

                return () => {
                    clearTimeout(fallbackTimeout);
                    network.destroy();
                };
            }, [rawNodes, rawEdges, activeFilters]);

            const handleToggleFilter = (group) => {
                const nextFilters = new Set(activeFilters);
                if (nextFilters.has(group)) {
                    nextFilters.delete(group);
                } else {
                    nextFilters.add(group);
                }
                setActiveFilters(nextFilters);
            };

            const handleSelectAllFilters = () => {
                const allGroups = new Set(rawNodes.map(n => n.group));
                setActiveFilters(allGroups);
            };

            const handleClearAllFilters = () => {
                setActiveFilters(new Set());
            };

            // Get relations for the selected node
            const getSelectedNodeRelations = () => {
                if (!selectedNode) return [];
                const nodeId = selectedNode.id;
                const relations = [];

                rawEdges.forEach(edge => {
                    if (edge.from === nodeId) {
                        relations.push({
                            type: "source",
                            rel: edge.label || edge.title || "CONNECTED_TO",
                            target: edge.to
                        });
                    } else if (edge.to === nodeId) {
                        relations.push({
                            type: "target",
                            rel: edge.label || edge.title || "CONNECTED_TO",
                            source: edge.from
                        });
                    }
                });

                return relations;
            };

            // CRUD Handlers
            const handleSaveNode = async (e) => {
                e.preventDefault();
                if (!editName.trim() || !editGroup) {
                    setEditError("Name and category are required.");
                    return;
                }
                setIsSaving(true);
                setEditError("");
                setEditSuccess("");

                try {
                    const response = await authenticatedFetch(`/api/knowledge/graph/node?chatbot_id=${botId}`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            old_name: selectedNode.id,
                            name: editName.trim(),
                            label: editGroup,
                            properties: { description: editDesc.trim() }
                        }),
                    });
                    const result = await response.json();
                    if (response.ok && result.status === "success") {
                        setEditSuccess("Node updated successfully!");
                        setTimeout(() => {
                            loadGraphData();
                        }, 800);
                    } else {
                        setEditError(result.message || "Failed to update node.");
                    }
                } catch (err) {
                    setEditError("Network error. Failed to save node.");
                } finally {
                    setIsSaving(false);
                }
            };

            const handleDeleteNode = () => {
                if (!selectedNode) return;
                setDeleteNodeTarget({
                    id: selectedNode.id,
                    label: selectedNode.label || selectedNode.id
                });
            };

            const closeDeleteNodeModal = () => {
                if (isDeletingGraphItem) return;
                setDeleteNodeTarget(null);
            };

            const confirmDeleteNode = async () => {
                if (!deleteNodeTarget || isDeletingGraphItem) return;
                setIsDeletingGraphItem(true);
                setEditError("");

                try {
                    const response = await authenticatedFetch(`/api/knowledge/graph/node?chatbot_id=${botId}&name=${encodeURIComponent(deleteNodeTarget.id)}`, {
                        method: "DELETE",
                    });
                    const result = await response.json();
                    if (response.ok && result.status === "success") {
                        setDeleteNodeTarget(null);
                        setSelectedNode(null);
                        loadGraphData();
                    } else {
                        alert(result.message || "Failed to delete node.");
                    }
                } catch (err) {
                    alert("Network error. Failed to delete node.");
                } finally {
                    setIsDeletingGraphItem(false);
                }
            };

            const handleAddNode = async (e) => {
                e.preventDefault();
                if (!newName.trim() || !newGroup) {
                    alert("Name and category are required.");
                    return;
                }
                setIsSaving(true);

                try {
                    const response = await authenticatedFetch(`/api/knowledge/graph/node?chatbot_id=${botId}`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            name: newName.trim(),
                            label: newGroup,
                            properties: { description: newDesc.trim() }
                        }),
                    });
                    const result = await response.json();
                    if (response.ok && result.status === "success") {
                        setNewName("");
                        setNewDesc("");
                        setIsAddingNode(false);
                        loadGraphData();
                    } else {
                        alert(result.message || "Failed to add node.");
                    }
                } catch (err) {
                    alert("Network error. Failed to add node.");
                } finally {
                    setIsSaving(false);
                }
            };

            const handleAddRelation = (e) => {
                e.preventDefault();
                const target = newRelTarget;
                const relType = newRelType === "CUSTOM" ? customRelType.trim().toUpperCase() : newRelType;

                if (!target) {
                    alert("Please select a target entity.");
                    return;
                }
                if (!relType) {
                    alert("Please specify a relation type.");
                    return;
                }

                const targetObj = rawNodes.find(n => n.id === target);
                const targetLabel = targetObj ? targetObj.label : target;
                const sourceLabel = selectedNode.label || selectedNode.id;

                setConfirmDetails({
                    sourceLabel,
                    targetLabel,
                    relType
                });
                setShowConfirmModal(true);
            };

            const submitAddRelation = async () => {
                setShowConfirmModal(false);
                setIsSaving(true);
                const target = newRelTarget;
                const relType = newRelType === "CUSTOM" ? customRelType.trim().toUpperCase() : newRelType;

                try {
                    const response = await authenticatedFetch(`/api/knowledge/graph/edge?chatbot_id=${botId}`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            source_name: selectedNode.id,
                            target_name: target,
                            rel_type: relType
                        }),
                    });
                    const result = await response.json();
                    if (response.ok && result.status === "success") {
                        setNewRelTarget("");
                        setCustomRelType("");
                        loadGraphData();
                    } else {
                        alert(result.message || "Failed to create relationship.");
                    }
                } catch (err) {
                    alert("Network error. Failed to create relationship.");
                } finally {
                    setIsSaving(false);
                }
            };

            const handleDeleteRelation = (rel) => {
                if (!selectedNode || !rel) return;
                const src = rel.type === "source" ? selectedNode.id : rel.source;
                const tgt = rel.type === "source" ? rel.target : selectedNode.id;
                setDeleteRelationTarget({
                    sourceName: src,
                    targetName: tgt,
                    relType: rel.rel.trim().toUpperCase().replace(/ /g, '_'),
                    sourceLabel: capitalize(src),
                    targetLabel: capitalize(tgt),
                    displayRel: rel.rel
                });
            };

            const closeDeleteRelationModal = () => {
                if (isDeletingGraphItem) return;
                setDeleteRelationTarget(null);
            };

            const confirmDeleteRelation = async () => {
                if (!deleteRelationTarget || isDeletingGraphItem) return;
                setIsDeletingGraphItem(true);

                try {
                    const response = await authenticatedFetch(`/api/knowledge/graph/edge?chatbot_id=${botId}`, {
                        method: "DELETE",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            source_name: deleteRelationTarget.sourceName,
                            target_name: deleteRelationTarget.targetName,
                            rel_type: deleteRelationTarget.relType
                        }),
                    });
                    const result = await response.json();
                    if (response.ok && result.status === "success") {
                        setDeleteRelationTarget(null);
                        loadGraphData();
                    } else {
                        alert(result.message || "Failed to delete relationship.");
                    }
                } catch (err) {
                    alert("Network error. Failed to delete relationship.");
                } finally {
                    setIsDeletingGraphItem(false);
                }
            };

            const selectedRelations = getSelectedNodeRelations();
            const categories = Object.keys(nodeCounts).sort();

            const groupColors = {
                "Company": "#3b82f6",
                "Brand": "#60a5fa",
                "Category": "#93c5fd",
                "Product": "#10b981",
                "Service": "#8b5cf6",
                "Package": "#f59e0b",
                "Accessory": "#34d399",
                "Price": "#06b6d4",
                "Warranty": "#14b8a6",
                "Promotion": "#fb7185",
                "Branch": "#ec4899",
                "Supplier": "#a855f7",
                "Customer Segment": "#c084fc",
                "Policy": "#ef4444",
                "FAQ": "#f97316",
                "Staff": "#fbbf24",
                "Schedule": "#a7f3d0",
                "Location": "#22c55e",
                "Requirement": "#f43f5e",
                "Event": "#d946ef"
            };

            return (
                <div style={{ display: "flex", gap: "20px", height: "650px", position: "relative", marginTop: "10px" }}>
                    {loadingStatus !== "done" && (
                        <div style={{ position: "absolute", top: "0", left: "0", width: "100%", height: "100%", background: "rgba(5, 11, 24, 0.7)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: "12px", zIndex: 10, borderRadius: "24px", backdropFilter: "blur(4px)" }}>
                            <span className="spinner" style={{ width: "32px", height: "32px" }}></span>
                            <span style={{ fontWeight: 600, fontSize: "0.95rem", color: "#f8fafc" }}>
                                {loadingStatus === "fetching" ? "Fetching graph data..." : `Positioning nodes: ${stabilizationPercent}%`}
                            </span>
                            {loadingStatus === "stabilizing" && (
                                <div style={{ width: "180px", height: "4px", background: "rgba(255,255,255,0.1)", borderRadius: "2px", overflow: "hidden" }}>
                                    <div style={{ width: `${stabilizationPercent}%`, height: "100%", background: "var(--primary)", transition: "width 0.15s ease" }} />
                                </div>
                            )}
                        </div>
                    )}

                    {error ? (
                        <div style={{ margin: "auto", textAlign: "center", color: "var(--text-dim)", maxWidth: "450px", padding: "20px" }}>
                            <div style={{ fontSize: "40px", marginBottom: "16px" }}>🕸️</div>
                            <div style={{ fontSize: "16px", fontWeight: "600", marginBottom: "8px", color: "var(--text-main)" }}>
                                {error.includes("402") || error.toLowerCase().includes("payment required") || error.toLowerCase().includes("failed") && (error.toLowerCase().includes("credit") || error.toLowerCase().includes("extract")) ? "Payment Required" : "Graph Empty or Unavailable"}
                            </div>
                            <p style={{ fontSize: "14px", lineHeight: "1.5", marginBottom: "16px" }}>{error}</p>
                            {(error.includes("402") || error.toLowerCase().includes("payment required") || error.toLowerCase().includes("credit")) && (
                                <a href={`pricing.html?bot_id=${botId}`} className="btn btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: "6px", padding: "8px 18px", fontSize: "0.85rem", textDecoration: "none", borderRadius: "8px" }}>
                                    💳 Upgrade Plan / Recharge Credits
                                </a>
                            )}
                        </div>
                    ) : (
                        <>
                            {/* Left Network Canvas */}
                            <div style={{ flexGrow: 1, height: "100%", position: "relative" }}>
                                <div id="network-graph-canvas" style={{ width: "100%", height: "100%", background: "rgba(15, 23, 42, 0.4)", borderRadius: "24px", border: "1px solid var(--glass-border)", backdropFilter: "blur(10px)" }} />

                                {/* Floating Hover Tooltip (Top Left of Canvas) */}
                                {hoveredNode && (
                                    <div style={{ position: "absolute", top: "16px", left: "16px", background: "rgba(15, 23, 42, 0.95)", border: `1.5px solid ${groupColors[hoveredNode.group] || "#94a3b8"}`, padding: "12px 16px", borderRadius: "14px", maxWidth: "320px", zIndex: 5, backdropFilter: "blur(5px)", animation: "fadeIn 0.15s ease-out" }}>
                                        <div style={{ fontSize: "10px", textTransform: "uppercase", letterSpacing: "1px", color: "#94a3b8", fontWeight: "700" }}>{hoveredNode.group}</div>
                                        <div style={{ fontSize: "14px", fontWeight: "700", margin: "4px 0", color: "#f8fafc" }}>{hoveredNode.label}</div>
                                        {hoveredNode.title && (
                                            <div style={{ fontSize: "12px", color: "var(--text-dim)", lineHeight: "1.4" }}>
                                                {hoveredNode.title.split('\n').slice(1).join('\n')}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* Right Panel: Legend, Filters, Details */}
                            <div style={{ width: "320px", display: "flex", flexDirection: "column", gap: "16px", height: "100%" }}>

                                {/* Categories Filter */}
                                <div className="glass-card" style={{ padding: "20px", background: "var(--card-bg)", borderRadius: "20px", border: "1px solid var(--glass-border)", display: "flex", flexDirection: "column", gap: "12px", maxHeight: "280px", overflowY: "auto" }}>
                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid rgba(255,255,255,0.08)", paddingBottom: "6px" }}>
                                        <span style={{ fontSize: "0.85rem", fontWeight: "700", textTransform: "uppercase", letterSpacing: "0.5px" }}>Categories</span>
                                        <div style={{ display: "flex", gap: "8px" }}>
                                            <button
                                                onClick={handleSelectAllFilters}
                                                style={{
                                                    background: "rgba(59, 130, 246, 0.15)",
                                                    border: "1px solid rgba(59, 130, 246, 0.3)",
                                                    color: "#60a5fa",
                                                    fontSize: "0.72rem",
                                                    fontWeight: "700",
                                                    cursor: "pointer",
                                                    padding: "3px 8px",
                                                    borderRadius: "12px",
                                                    transition: "all 0.2s"
                                                }}
                                                onMouseOver={(e) => { e.currentTarget.style.background = "rgba(59, 130, 246, 0.3)"; }}
                                                onMouseOut={(e) => { e.currentTarget.style.background = "rgba(59, 130, 246, 0.15)"; }}
                                            >
                                                All
                                            </button>
                                            <button
                                                onClick={handleClearAllFilters}
                                                style={{
                                                    background: "rgba(255, 255, 255, 0.05)",
                                                    border: "1px solid rgba(255, 255, 255, 0.15)",
                                                    color: "var(--text-dim)",
                                                    fontSize: "0.72rem",
                                                    fontWeight: "700",
                                                    cursor: "pointer",
                                                    padding: "3px 8px",
                                                    borderRadius: "12px",
                                                    transition: "all 0.2s"
                                                }}
                                                onMouseOver={(e) => { e.currentTarget.style.background = "rgba(255, 255, 255, 0.15)"; }}
                                                onMouseOut={(e) => { e.currentTarget.style.background = "rgba(255, 255, 255, 0.05)"; }}
                                            >
                                                None
                                            </button>
                                        </div>
                                    </div>
                                    <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                                        {categories.map(cat => {
                                            const color = groupColors[cat] || "#94a3b8";
                                            const active = activeFilters.has(cat);
                                            return (
                                                <div
                                                    key={cat}
                                                    onClick={() => handleToggleFilter(cat)}
                                                    style={{ display: "flex", alignItems: "center", gap: "10px", padding: "6px 8px", borderRadius: "8px", background: active ? "rgba(255,255,255,0.03)" : "transparent", cursor: "pointer", transition: "0.2s" }}
                                                >
                                                    <div style={{ width: "12px", height: "12px", borderRadius: "50%", background: color, border: active ? "1.5px solid #fff" : "none" }}></div>
                                                    <span style={{ fontSize: "0.85rem", fontWeight: active ? "600" : "400", color: active ? "#f8fafc" : "var(--text-dim)", flexGrow: 1 }}>{cat}</span>
                                                    <span style={{ fontSize: "0.75rem", opacity: 0.6 }}>{nodeCounts[cat]}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Node Details / Add Node Panel */}
                                <div className="glass-card" style={{ padding: "20px", background: "var(--card-bg)", borderRadius: "20px", border: "1px solid var(--glass-border)", flexGrow: 1, display: "flex", flexDirection: "column", gap: "12px", overflowY: "auto" }}>
                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid rgba(255,255,255,0.08)", paddingBottom: "6px" }}>
                                        <span style={{ fontSize: "0.85rem", fontWeight: "700", textTransform: "uppercase", letterSpacing: "0.5px" }}>Entity Details</span>
                                        {!isAddingNode && (
                                            <button
                                                onClick={() => { setSelectedNode(null); setIsAddingNode(true); }}
                                                style={{ background: "rgba(16, 185, 129, 0.15)", border: "1px solid rgba(16, 185, 129, 0.3)", color: "var(--accent)", fontSize: "0.72rem", fontWeight: "700", cursor: "pointer", padding: "3px 8px", borderRadius: "12px", transition: "all 0.2s" }}
                                                onMouseOver={(e) => { e.currentTarget.style.background = "rgba(16, 185, 129, 0.3)"; }}
                                                onMouseOut={(e) => { e.currentTarget.style.background = "rgba(16, 185, 129, 0.15)"; }}
                                            >
                                                + New Entity
                                            </button>
                                        )}
                                    </div>

                                    {isAddingNode ? (
                                        <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                                            <h3 style={{ fontSize: "1.0rem", fontWeight: "700" }}>Add New Entity</h3>
                                            <form onSubmit={handleAddNode} style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
                                                <div className="input-group" style={{ marginBottom: "6px" }}>
                                                    <label style={{ fontSize: "0.75rem", marginBottom: "4px" }}>Entity Name</label>
                                                    <input
                                                        type="text"
                                                        className="modal-input"
                                                        value={newName}
                                                        onChange={(e) => setNewName(e.target.value)}
                                                        placeholder="e.g. Premium Support"
                                                        required
                                                        style={{ padding: "8px 12px" }}
                                                    />
                                                </div>
                                                <div className="input-group" style={{ marginBottom: "6px" }}>
                                                    <label style={{ fontSize: "0.75rem", marginBottom: "4px" }}>Category</label>
                                                    <select
                                                        className="modal-input"
                                                        value={newGroup}
                                                        onChange={(e) => setNewGroup(e.target.value)}
                                                        style={{ padding: "8px 12px", background: "var(--input-bg)" }}
                                                    >
                                                        {ALLOWED_GROUPS.map(g => (
                                                            <option key={g} value={g} style={{ background: "#0f172a" }}>{g}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                                <div className="input-group" style={{ marginBottom: "6px" }}>
                                                    <label style={{ fontSize: "0.75rem", marginBottom: "4px" }}>Description</label>
                                                    <textarea
                                                        className="modal-input"
                                                        value={newDesc}
                                                        onChange={(e) => setNewDesc(e.target.value)}
                                                        placeholder="Brief details about the entity..."
                                                        style={{ padding: "8px 12px", height: "80px", resize: "none" }}
                                                    />
                                                </div>
                                                <div style={{ display: "flex", gap: "8px", marginTop: "4px" }}>
                                                    <button type="submit" className="btn btn-primary" style={{ flex: 1, padding: "8px 12px", borderRadius: "10px", fontSize: "0.85rem" }} disabled={isSaving}>Save</button>
                                                    <button type="button" className="btn" onClick={() => setIsAddingNode(false)} style={{ flex: 1, padding: "8px 12px", borderRadius: "10px", fontSize: "0.85rem" }}>Cancel</button>
                                                </div>
                                            </form>
                                        </div>
                                    ) : isEditingNode ? (
                                        <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                                            <h3 style={{ fontSize: "1.0rem", fontWeight: "700" }}>Edit Entity</h3>
                                            <form onSubmit={handleSaveNode} style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
                                                {editError && <div style={{ fontSize: "0.8rem", color: "var(--error)" }}>{editError}</div>}
                                                {editSuccess && <div style={{ fontSize: "0.8rem", color: "var(--accent)" }}>{editSuccess}</div>}
                                                <div className="input-group" style={{ marginBottom: "6px" }}>
                                                    <label style={{ fontSize: "0.75rem", marginBottom: "4px" }}>Name</label>
                                                    <input
                                                        type="text"
                                                        className="modal-input"
                                                        value={editName}
                                                        onChange={(e) => setEditName(e.target.value)}
                                                        required
                                                        style={{ padding: "8px 12px" }}
                                                    />
                                                </div>
                                                <div className="input-group" style={{ marginBottom: "6px" }}>
                                                    <label style={{ fontSize: "0.75rem", marginBottom: "4px" }}>Category</label>
                                                    <select
                                                        className="modal-input"
                                                        value={editGroup}
                                                        onChange={(e) => setEditGroup(e.target.value)}
                                                        style={{ padding: "8px 12px", background: "var(--input-bg)" }}
                                                    >
                                                        {ALLOWED_GROUPS.map(g => (
                                                            <option key={g} value={g} style={{ background: "#0f172a" }}>{g}</option>
                                                        ))}
                                                    </select>
                                                </div>

        function KnowledgeRefinement({ botId, hasAccess }) {
            if (!hasAccess) {
                return (
                    <div className="glass-card" style={{ padding: "40px", marginTop: "20px", textAlign: "center" }}>
                        <div style={{ fontSize: "50px", marginBottom: "16px" }}>🔒</div>
                        <h3 style={{ margin: "0 0 10px 0", fontSize: "1.3rem", fontWeight: "700", color: "#f8fafc" }}>
                            Pro Feature: Interactive Knowledge Refinement
                        </h3>
                        <p style={{ margin: "0 auto 24px auto", fontSize: "0.9rem", color: "var(--text-dim)", maxWidth: "480px", lineHeight: "1.5" }}>
                            Auditing your knowledge graph for gaps and filling details using interactive Q&A is a Pro feature. Upgrade your plan to get full access to this and other advanced automation tools.
                        </p>
                        <a href={`pricing.html?bot_id=${botId}`} className="btn btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: "6px", padding: "10px 24px", fontSize: "0.9rem", textDecoration: "none", borderRadius: "10px" }}>
                            💳 Upgrade to Pro Plan
                        </a>
                    </div>
                );
            }

            const [questions, setQuestions] = useState([]);
            const [answers, setAnswers] = useState({});
            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(false);
            const [submitting, setSubmitting] = useState(false);
            const [error, setError] = useState("");
            const [successMsg, setSuccessMsg] = useState("");
            const logEndRef = React.useRef(null);

            React.useEffect(() => {
                if (logEndRef.current) {
                    logEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [logs]);

            const fetchQuestions = async () => {
                setLoading(true);
                setError("");
                setSuccessMsg("");
                setQuestions([]);
                setLogs(["Initializing verification scan..."]);

                try {
                    const response = await authenticatedFetch(`/api/knowledge/refinement/questions?chatbot_id=${botId}`);

                    if (!response.ok) {
                        const errData = await response.json();
                        setError(errData.message || "Failed to generate questions.");
                        setLoading(false);
                        return;
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder("utf-8");
                    let buffer = "";

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split("\n");
                        buffer = lines.pop(); // Save trailing unfinished line

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (trimmed.startsWith("data:")) {
                                const dataStr = trimmed.slice(5).trim();
                                try {
                                    const parsed = JSON.parse(dataStr);
                                    if (parsed.type === "log") {
                                        setLogs(prev => [...prev, parsed.message]);
                                    } else if (parsed.type === "error") {
                                        setError(parsed.message);
                                    } else if (parsed.type === "complete") {
                                        setQuestions(parsed.questions || []);
                                        const initialAnswers = {};
                                        (parsed.questions || []).forEach((q, idx) => {
                                            initialAnswers[idx] = "";
                                        });
                                        setAnswers(initialAnswers);
                                    }
                                } catch (e) {
                                    console.error("Failed to parse SSE line:", e);
                                }
                            }
                        }
                    }
                } catch (err) {
                    setError("Network error. Please make sure the backend is running.");
                } finally {
                    setLoading(false);
                }
            };

            const handleAnswerChange = (idx, value) => {
                setAnswers(prev => ({
                    ...prev,
                    [idx]: value
                }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSubmitting(true);
                setError("");
                setSuccessMsg("");

                const qaPairs = questions.map((q, idx) => ({
                    question: q.question,
                    answer: answers[idx] || ""
                })).filter(item => item.answer.trim() !== "");

                if (qaPairs.length === 0) {
                    setError("Please answer at least one question before submitting.");
                    setSubmitting(false);
                    return;
                }

                try {
                    const response = await authenticatedFetch(`/api/knowledge/refinement/submit?chatbot_id=${botId}`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ answers: qaPairs }),
                    });
                    const data = await response.json();
                    if (response.ok && data.status === "success") {
                        setSuccessMsg(data.message || "Refinement saved successfully!");
                        setAnswers({});
                        setQuestions([]);
                    } else {
                        setError(data.message || "Failed to submit answers.");
                    }
                } catch (err) {
                    setError("Network error occurred during submission.");
                } finally {
                    setSubmitting(false);
                }
            };

            return (
                <div className="glass-card" style={{ padding: "30px", marginTop: "20px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "24px" }}>
                        <div>
                            <h3 style={{ margin: 0, fontSize: "1.2rem", fontWeight: "600", color: "var(--text)" }}>
                                Interactive Knowledge Refinement
                            </h3>
                            <p style={{ margin: "4px 0 0 0", fontSize: "0.85rem", color: "var(--text-dim)" }}>
                                Scan the knowledge graph to detect ambiguities, fill in the blanks, and make your AI chatbot smarter.
                            </p>
                        </div>
                        <button
                            className="btn btn-primary"
                            type="button"
                            onClick={fetchQuestions}
                            disabled={loading || submitting}
                        >
                            {loading ? (
                                <span>
                                    <span className="spinner"></span> Scanning...
                                </span>
                            ) : "🔍 Scan Graph for Gaps"}
                        </button>
                    </div>

                    {error && (
                        <div style={{ padding: "16px 20px", borderRadius: "12px", background: "rgba(220, 53, 69, 0.08)", border: "1px solid rgba(220, 53, 69, 0.25)", marginBottom: "20px", fontSize: "0.9rem" }}>
                            <div style={{ display: "flex", alignItems: "flex-start", gap: "12px" }}>
                                <span style={{ fontSize: "1.2rem", marginTop: "-2px" }}>⚠️</span>
                                <div style={{ flex: 1 }}>
                                    <div style={{ fontWeight: "700", color: "#ff6b6b", marginBottom: "6px", textTransform: "uppercase", fontSize: "0.82rem", letterSpacing: "0.5px" }}>
                                        {error.includes("402") || error.toLowerCase().includes("payment required") || error.toLowerCase().includes("credit") ? "Payment Required" :
                                         (error.toLowerCase().includes("feature") || error.toLowerCase().includes("plan") || error.toLowerCase().includes("subscription") ? "Upgrade Required" : "Error Encountered")}
                                    </div>
                                    <div style={{ color: "rgba(255,255,255,0.7)", fontSize: "0.86rem", lineHeight: "1.5" }}>
                                        {error}
                                    </div>
                                    {(error.includes("402") || error.toLowerCase().includes("payment required") || error.toLowerCase().includes("credit") ||
                                      error.toLowerCase().includes("feature") || error.toLowerCase().includes("plan") || error.toLowerCase().includes("subscription")) && (
                                        <div style={{ marginTop: "12px" }}>
                                            <a href={`pricing.html?bot_id=${botId}`} className="btn btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: "6px", padding: "6px 14px", fontSize: "0.82rem", textDecoration: "none", borderRadius: "8px" }}>
                                                💳 Upgrade Plan / Recharge Credits
                                            </a>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {successMsg && (
                        <div style={{ padding: "12px 16px", borderRadius: "8px", background: "rgba(40, 167, 69, 0.1)", border: "1px solid rgba(40, 167, 69, 0.2)", color: "#2ebd59", marginBottom: "20px", fontSize: "0.9rem" }}>
                            ✅ {successMsg}
                        </div>
                    )}

                    {loading && (
                        <div style={{ textAlign: "center", padding: "30px 20px" }}>
                            <div className="spinner" style={{ width: "36px", height: "36px", margin: "0 auto 16px auto" }}></div>
                            <p style={{ color: "var(--text-dim)", fontSize: "0.95rem", marginBottom: "20px" }}>
                                Auditing the Knowledge Graph & PDF Content...
                            </p>

                            <div style={{
                                background: "#0b0b0c",
                                border: "1px solid rgba(255,255,255,0.08)",
                                borderRadius: "8px",
                                padding: "15px 20px",
                                maxHeight: "220px",
                                overflowY: "auto",
                                textAlign: "left",
                                fontFamily: "Consolas, Monaco, monospace",
                                fontSize: "0.85rem",
                                color: "#00E676",
                                lineHeight: "1.6",
                                boxShadow: "inset 0 2px 8px rgba(0,0,0,0.8)"
                            }}>
                                {logs.map((log, lIdx) => (
                                    <div key={lIdx} style={{ whiteSpace: "pre-wrap" }}>
                                        <span style={{ color: "rgba(255,255,255,0.3)", marginRight: "8px" }}>&gt;</span>
                                        {log}
                                    </div>
                                ))}
                                <div ref={logEndRef} />
                            </div>
                        </div>
                    )}

                    {!loading && questions.length === 0 && !successMsg && (
                        <div style={{ textAlign: "center", padding: "40px 20px", border: "1px dashed var(--border)", borderRadius: "12px" }}>
                            <div style={{ fontSize: "40px", marginBottom: "16px" }}>🎯</div>
                            <h4 style={{ margin: "0 0 8px 0", fontSize: "1rem", color: "var(--text)" }}>Ready to Refine Knowledge</h4>
                            <p style={{ margin: 0, fontSize: "0.85rem", color: "var(--text-dim)", maxWidth: "480px", marginLeft: "auto", marginRight: "auto", lineHeight: "1.5" }}>
                                Click the "Scan Graph for Gaps" button above. The AI will look at your active PDF's entities and relations to find missing or ambiguous information that needs clarification.
                            </p>
                        </div>
                    )}

                    {questions.length > 0 && (
                        <form onSubmit={handleSubmit}>
                            <div style={{ display: "flex", flexDirection: "column", gap: "20px", marginBottom: "24px" }}>
                                {questions.map((q, idx) => (
                                    <div key={idx} className="glass-card" style={{ padding: "20px", background: "rgba(255,255,255,0.02)", border: "1px solid var(--border)" }}>
                                        <div style={{ display: "flex", gap: "8px", alignItems: "flex-start", marginBottom: "12px" }}>
                                            <span style={{ background: "rgba(0, 123, 255, 0.15)", color: "var(--primary)", fontSize: "0.75rem", fontWeight: "700", padding: "3px 8px", borderRadius: "20px" }}>
                                                GAP DETECTED
                                            </span>
                                            <span style={{ fontSize: "0.85rem", color: "var(--text-dim)" }}>
                                                {q.context}
                                            </span>
                                        </div>
                                        <label style={{ display: "block", fontSize: "0.95rem", fontWeight: "500", color: "var(--text)", marginBottom: "8px" }}>
                                            {q.question}
                                        </label>
                                        <textarea
                                            className="form-control"
                                            rows="3"
                                            placeholder="Type the answer here..."
                                            style={{ width: "100%", background: "rgba(0,0,0,0.2)", color: "white", border: "1px solid var(--border)", borderRadius: "8px", padding: "10px", fontSize: "0.9rem", resize: "vertical", fontFamily: "inherit" }}
                                            value={answers[idx] || ""}
                                            onChange={(e) => handleAnswerChange(idx, e.target.value)}
                                        />
                                    </div>
                                ))}
                            </div>

                            <div style={{ display: "flex", justifyContent: "flex-end", gap: "12px" }}>
                                <button
                                    className="btn"
