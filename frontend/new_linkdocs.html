                                            <span style={{ fontSize: "0.85rem", color: "var(--text-dim)", whiteSpace: "nowrap" }}>
                                                {readmeMatchIndices.length > 0
                                                    ? `${readmeCurrentMatchIdx + 1} of ${readmeMatchIndices.length}`
                                                    : "0 matches"
                                                }
                                            </span>

                                            <button
                                                className="btn"
                                                disabled={readmeMatchIndices.length <= 1}
                                                onClick={() => {
                                                    setReadmeCurrentMatchIdx(prev => {
                                                        const next = prev - 1;
                                                        return next < 0 ? readmeMatchIndices.length - 1 : next;
                                                    });
                                                }}
                                                style={{
                                                    padding: "6px 12px",
                                                    fontSize: "0.8rem",
                                                    borderRadius: "8px",
                                                    background: "rgba(255,255,255,0.05)",
                                                    cursor: readmeMatchIndices.length > 1 ? "pointer" : "not-allowed"
                                                }}
                                                title="Previous Match"
                                            >
                                                ◀ Prev
                                            </button>

                                            <button
                                                className="btn"
                                                disabled={readmeMatchIndices.length <= 1}
                                                onClick={() => {
                                                    setReadmeCurrentMatchIdx(prev => {
                                                        const next = prev + 1;
                                                        return next >= readmeMatchIndices.length ? 0 : next;
                                                    });
                                                }}
                                                style={{
                                                    padding: "6px 12px",
                                                    fontSize: "0.8rem",
                                                    borderRadius: "8px",
                                                    background: "rgba(255,255,255,0.05)",
                                                    cursor: readmeMatchIndices.length > 1 ? "pointer" : "not-allowed"
                                                }}
                                                title="Next Match"
                                            >
                                                Next ▶
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {loadingReadme ? (
                                <div style={{ flexGrow: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "250px", gap: "12px" }}>
                                    <span className="spinner" style={{ width: "32px", height: "32px" }}></span>
                                    <span style={{ color: "var(--text-dim)", fontSize: "0.95rem" }}>Compiling and reading README content...</span>
                                </div>
                            ) : (
                                <div style={{ flexGrow: 1, overflowY: "auto", background: "rgba(0,0,0,0.2)", border: "1px solid rgba(255,255,255,0.05)", borderRadius: "16px", padding: "20px", maxHeight: "60vh", textAlign: "left" }}>
                                    {renderMarkdownContent(readmeText)}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* History Pop-out Modal */}
                    <div className={`modal-backdrop ${isHistoryOpen ? "open" : ""}`} onClick={() => setIsHistoryOpen(false)}>
                        <div className="modal-content" style={{ maxWidth: "600px", width: "90%", maxHeight: "80vh", display: "flex", flexDirection: "column", padding: "30px", border: "1px solid var(--glass-border)", background: "var(--card-bg)" }} onClick={(e) => e.stopPropagation()}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid var(--glass-border)", paddingBottom: "12px", marginBottom: "16px" }}>
                                <h3 style={{ margin: 0, fontSize: "1.2rem", fontWeight: "700" }}>Document Modification History</h3>
                                <button className="btn" onClick={() => setIsHistoryOpen(false)} style={{ padding: "4px 12px", fontSize: "0.85rem", background: "rgba(255,255,255,0.05)", border: "1px solid var(--glass-border)" }}>✕ Close</button>
                            </div>
                            {/* Filter Pills */}
                            <div style={{ display: "flex", gap: "8px", flexWrap: "wrap", marginBottom: "16px" }}>
                                {["All", "Graph Modifications", "Q&A Submissions", "Admin State Changes"].map((category) => {
                                    const isActive = activeHistoryFilter === category;
                                    const count = category === "All"
                                        ? historyLogs.length
                                        : historyLogs.filter(log => log.category === category).length;
                                    return (
                                        <button
                                            key={category}
                                            type="button"
                                            onClick={() => setActiveHistoryFilter(category)}
                                            style={{
                                                padding: "6px 14px",
                                                fontSize: "0.78rem",
                                                borderRadius: "20px",
                                                border: isActive ? "1px solid var(--primary)" : "1px solid rgba(255,255,255,0.08)",
                                                background: isActive ? "linear-gradient(135deg, var(--primary) 0%, #1e1b4b 100%)" : "rgba(255,255,255,0.03)",
                                                color: isActive ? "#ffffff" : "#94a3b8",
                                                transition: "all 0.2s ease",
                                                cursor: "pointer",
                                                display: "inline-flex",
                                                alignItems: "center",
                                                gap: "6px",
                                                fontWeight: isActive ? "600" : "400"
                                            }}
                                        >
                                            <span>{category}</span>
                                            <span style={{
                                                fontSize: "0.7rem",
                                                background: isActive ? "rgba(255,255,255,0.2)" : "rgba(255,255,255,0.08)",
                                                padding: "1px 6px",
                                                borderRadius: "10px",
                                                color: isActive ? "#ffffff" : "#64748b"
                                            }}>
                                                {count}
                                            </span>
                                        </button>
                                    );
                                })}
                            </div>

                            {loadingHistory ? (
                                <div style={{ flexGrow: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "200px", gap: "12px" }}>
                                    <span className="spinner" style={{ width: "32px", height: "32px" }}></span>
                                    <span style={{ color: "var(--text-dim)", fontSize: "0.95rem" }}>Loading history logs...</span>
                                </div>
                            ) : (
                                <div style={{ flexGrow: 1, overflowY: "auto", background: "rgba(0,0,0,0.2)", border: "1px solid rgba(255,255,255,0.05)", borderRadius: "16px", padding: "20px", maxHeight: "50vh", textAlign: "left" }}>
                                    {(() => {
                                        const filteredLogs = activeHistoryFilter === "All"
                                            ? historyLogs
                                            : historyLogs.filter(log => log.category === activeHistoryFilter);

                                        if (filteredLogs.length === 0) {
                                            return (
                                                <div style={{ textAlign: "center", color: "var(--text-dim)", padding: "40px 0" }}>
                                                    <span style={{ fontSize: "2rem", display: "block", marginBottom: "12px" }}>⏳</span>
                                                    No events found matching "{activeHistoryFilter}".
                                                </div>
                                            );
                                        }

                                        return (
                                            <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
                                                {filteredLogs.map((log, idx) => {
                                                    const isQA = log.category === "Q&A Submissions";
                                                    const hasDetails = isQA && Array.isArray(log.details) && log.details.length > 0;
                                                    const isExpanded = expandedHistoryIdx === idx;

                                                    return (
                                                        <div
                                                            key={idx}
                                                            onClick={() => {
                                                                if (hasDetails) {
                                                                    setExpandedHistoryIdx(isExpanded ? null : idx);
                                                                }
                                                            }}
                                                            style={{
                                                                padding: "12px 16px",
                                                                borderRadius: "12px",
                                                                background: isExpanded ? "rgba(16, 185, 129, 0.04)" : "rgba(255,255,255,0.02)",
                                                                border: isExpanded ? "1px solid rgba(16, 185, 129, 0.2)" : "1px solid rgba(255,255,255,0.05)",
                                                                display: "flex",
                                                                flexDirection: "column",
                                                                gap: "6px",
                                                                cursor: hasDetails ? "pointer" : "default",
                                                                transition: "all 0.25s ease"
                                                            }}
                                                        >
                                                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                                                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                                                                    <span style={{ fontSize: "0.78rem", color: isQA ? "var(--accent)" : "var(--primary)", fontWeight: "600", letterSpacing: "0.5px" }}>
                                                                        {log.category?.toUpperCase() || "ADMIN STATE CHANGES"}
                                                                    </span>
                                                                    {hasDetails && (
                                                                        <span style={{
                                                                            fontSize: "0.65rem",
                                                                            background: "rgba(16, 185, 129, 0.12)",
                                                                            color: "var(--accent)",
                                                                            padding: "2px 7px",
                                                                            borderRadius: "6px",
                                                                            fontWeight: "700",
                                                                            letterSpacing: "0.3px"
                                                                        }}>
                                                                            {log.details.length} PAIR{log.details.length !== 1 ? "S" : ""}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                                                                    <span style={{ fontSize: "0.75rem", color: "var(--text-dim)" }}>{log.timestamp}</span>
                                                                    {hasDetails && (
                                                                        <span style={{
                                                                            fontSize: "0.7rem",
                                                                            color: "var(--accent)",
                                                                            transition: "transform 0.25s ease",
                                                                            transform: isExpanded ? "rotate(180deg)" : "rotate(0deg)",
                                                                            display: "inline-block"
                                                                        }}>▼</span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                            <div style={{ fontSize: "0.88rem", color: "#f8fafc", lineHeight: "1.4" }}>
                                                                {log.action}
                                                            </div>
                                                            {hasDetails && (
                                                                <div style={{
                                                                    maxHeight: isExpanded ? `${log.details.length * 120 + 40}px` : "0px",
                                                                    overflow: "hidden",
                                                                    transition: "max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease",
                                                                    opacity: isExpanded ? 1 : 0
                                                                }}>
                                                                    <div style={{
                                                                        marginTop: "10px",
                                                                        borderRadius: "10px",
                                                                        background: "rgba(0, 0, 0, 0.25)",
                                                                        border: "1px solid rgba(16, 185, 129, 0.12)",
                                                                        overflow: "hidden"
                                                                    }}>
                                                                        {/* Header */}
                                                                        <div style={{
                                                                            padding: "8px 14px",
                                                                            background: "rgba(16, 185, 129, 0.06)",
                                                                            borderBottom: "1px solid rgba(16, 185, 129, 0.1)",
                                                                            display: "flex",
                                                                            alignItems: "center",
                                                                            gap: "8px"
                                                                        }}>
                                                                            <span style={{ fontSize: "0.72rem", fontWeight: "700", color: "var(--accent)", letterSpacing: "0.8px", textTransform: "uppercase" }}>Q&A Diff — Additions</span>
                                                                            <span style={{ fontSize: "0.68rem", color: "var(--text-dim)" }}>({log.details.length} entr{log.details.length !== 1 ? "ies" : "y"})</span>
                                                                        </div>
                                                                        {/* Q&A Pairs */}
                                                                        {log.details.map((pair, pIdx) => (
                                                                            <div key={pIdx} style={{
                                                                                padding: "10px 14px",
                                                                                borderBottom: pIdx < log.details.length - 1 ? "1px solid rgba(255,255,255,0.04)" : "none",
                                                                                borderLeft: "3px solid rgba(16, 185, 129, 0.5)",
                                                                                display: "flex",
                                                                                flexDirection: "column",
                                                                                gap: "6px"
                                                                            }}>
                                                                                <div style={{ display: "flex", alignItems: "flex-start", gap: "8px" }}>
                                                                                    <span style={{
                                                                                        fontSize: "0.72rem",
                                                                                        fontWeight: "800",
                                                                                        color: "#34d399",
                                                                                        fontFamily: "'Consolas', 'Monaco', monospace",
                                                                                        lineHeight: "1.5",
                                                                                        flexShrink: 0,
                                                                                        userSelect: "none"
                                                                                    }}>+ Q:</span>
                                                                                    <span style={{
                                                                                        fontSize: "0.82rem",
                                                                                        color: "#a7f3d0",
                                                                                        fontWeight: "600",
                                                                                        lineHeight: "1.5"
                                                                                    }}>{pair.question}</span>
                                                                                </div>
                                                                                <div style={{ display: "flex", alignItems: "flex-start", gap: "8px", paddingLeft: "4px" }}>
                                                                                    <span style={{
                                                                                        fontSize: "0.72rem",
                                                                                        fontWeight: "800",
                                                                                        color: "rgba(52, 211, 153, 0.6)",
                                                                                        fontFamily: "'Consolas', 'Monaco', monospace",
                                                                                        lineHeight: "1.5",
                                                                                        flexShrink: 0,
                                                                                        userSelect: "none"
                                                                                    }}>  A:</span>
                                                                                    <span style={{
                                                                                        fontSize: "0.82rem",
                                                                                        color: "var(--text-dim)",
                                                                                        lineHeight: "1.5"
                                                                                    }}>{pair.answer}</span>
                                                                                </div>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        );
                                    })()}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Custom Delete Confirmation Modal */}
                    <div className={`modal-backdrop ${fileToDelete ? "open" : ""}`} onClick={(e) => { if (e.target === e.currentTarget) setFileToDelete(null); }}>
                        <div className="modal-content" style={{ maxWidth: "420px", textAlign: "center", padding: "40px 30px" }}>
                            <div style={{ fontSize: "48px", marginBottom: "20px" }}>🗑️</div>
                            <h2 style={{ marginBottom: "12px" }}>Delete Document?</h2>
                            <p style={{ color: "var(--text-dim)", fontSize: "0.95rem", marginBottom: "32px", lineHeight: "1.5" }}>
                                Are you sure you want to delete <strong>{fileToDelete}</strong>?<br />
                                This action cannot be undone.
                            </p>
                            <div className="modal-footer" style={{ justifyContent: "center", gap: "16px" }}>
                                <button className="btn" type="button" onClick={() => setFileToDelete(null)}>
                                    Cancel
                                </button>
                                <button className="btn btn-danger" type="button" onClick={confirmDeleteFile}>
                                    Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
