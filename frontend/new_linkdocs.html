<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links & Documents | AI CHATBOT</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="sidebar-component.js"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --bg: #050b18;
            --sidebar-bg: rgba(15, 23, 42, 0.82);
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #10b981;
            --input-bg: rgba(15, 23, 42, 0.6);
            --error: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        #root {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(to right, #60a5fa, #10b981);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-list {
            list-style: none;
            flex-grow: 1;
        }

        .nav-item {
            margin-bottom: 8px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dim);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transform: translateX(5px);
        }

        .nav-link.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .dropdown-container {
            margin-bottom: 8px;
        }

        .dropdown-toggle {
            width: 100%;
            justify-content: space-between;
            background: transparent;
            border: none;
            cursor: pointer;
            text-align: left;
        }

        .dropdown-content {
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease-in-out;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dropdown-container.open .dropdown-content {
            max-height: 500px;
            margin-top: 8px;
            padding-bottom: 8px;
        }

        .chevron {
            transition: transform 0.3s;
            opacity: 0.5;
        }

        .dropdown-container.open .chevron {
            transform: rotate(180deg);
            opacity: 1;
        }

        .sub-link {
            font-size: 0.9rem;
            padding: 10px 16px;
        }

        .logout-btn {
            margin-top: auto;
            color: #ef4444;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            text-decoration: none;
            font-weight: 600;
            border-radius: 12px;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .main-container {
            flex: 1;
            padding: 50px 60px;
            display: flex;
            flex-direction: column;
        }

        .header {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .header p {
            color: var(--text-dim);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .tabs-nav {
            display: flex;
            gap: 30px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
        }

        .tab-item {
            padding-bottom: 12px;
            color: var(--text-main);
            font-weight: 700;
            position: relative;
        }

        .tab-item::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary);
            border-radius: 4px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transition: all 0.3s;
        }

        .btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-primary:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 6px 20px var(--primary-glow);
            background: var(--primary);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.08);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .table-area {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            flex-grow: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(0, 0, 0, 0.2);
        }

        th {
            text-align: left;
            padding: 16px 24px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
        }

        .status-badge.pending {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .status-badge.inactive {
            background: rgba(148, 163, 184, 0.12);
            color: var(--text-dim);
        }

        .status-message {
            margin-bottom: 18px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }

        .status-message.success { color: var(--accent); }
        .status-message.error { color: var(--error); }
        .status-message.deleted { color: var(--error); }

        .name-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .table-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .table-actions .btn {
            padding: 8px 14px;
            font-size: 0.84rem;
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            width: 100%;
            max-width: 540px;
            padding: 40px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .modal-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
        }

        .modal-tab {
            padding-bottom: 10px;
            cursor: pointer;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
            background: transparent;
            border: none;
        }

        .modal-tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .modal-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .modal-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .drop-zone {
            border: 2px dashed var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            color: var(--text-dim);
            cursor: pointer;
            transition: 0.3s;
        }

        .drop-zone:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 1200px) {
            .stats-row {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-height: auto;
                position: relative;
                padding: 24px 20px;
            }
            .main-container {
                padding: 28px 20px;
            }
        }

        @media (max-width: 700px) {
            .stats-row {
                grid-template-columns: 1fr;
            }
            th:nth-child(2), td:nth-child(2),
            th:nth-child(4), td:nth-child(4) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [file, setFile] = useState(null);
            const [status, setStatus] = useState({ type: "", text: "", action: "" });
            const [isUploading, setIsUploading] = useState(false);
            const [files, setFiles] = useState([]);
            const [activeFile, setActiveFile] = useState("");
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [fileToDelete, setFileToDelete] = useState(null);
            const [activeTab, setActiveTab] = useState("file");
            const [linkUrl, setLinkUrl] = useState("");

            const openModal = () => {
                setStatus({ type: "", text: "", action: "" });
                setFile(null);
                setLinkUrl("");
                setActiveTab("file");
                setIsModalOpen(true);
            };

            const closeModal = () => {
                if (isUploading) return;
                setIsModalOpen(false);
                setFile(null);
                setLinkUrl("");
                setActiveTab("file");
            };

            const handleFileSelect = (input) => {
                const selectedFile = input?.files?.[0];
                if (!selectedFile) return;

                if (selectedFile.type !== "application/pdf") {
                    setStatus({ type: "error", text: "Please select a valid PDF file.", action: "" });
                    return;
                }

                setFile(selectedFile);
                setStatus({ type: "", text: "", action: "" });
            };

            const fetchFiles = async () => {
                try {
                    const res = await fetch("http://127.0.0.1:8000/api/knowledge/files");
                    const data = await res.json();

                    const activeRes = await fetch("http://127.0.0.1:8000/api/knowledge/active");
                    const activeData = await activeRes.json();

                    if (data.status === "success") {
                        setFiles(data.data || []);
                    }

                    if (activeData.status === "success") {
                        setActiveFile(activeData.data?.file_name || "");
                    }
                } catch (error) {
                    setStatus({ type: "error", text: "Failed to load files from backend.", action: "" });
                }
            };

            const handleUpload = async () => {
                if (activeTab === "link") {
                    setStatus({ type: "error", text: "Website link training is not connected yet. Please use PDF upload for now.", action: "" });
                    return;
                }

                if (!file) {
                    setStatus({ type: "error", text: "Please select a PDF file first.", action: "" });
                    return;
                }

                setIsUploading(true);
                setStatus({ type: "", text: "", action: "" });

                const formData = new FormData();
                formData.append("pdf_file", file);

                try {
                    const response = await fetch("http://127.0.0.1:8000/upload-pdf", {
                        method: "POST",
                        body: formData,
                    });

                    if (response.ok) {
                        setStatus({ type: "success", text: "PDF uploaded successfully. Please set it active if needed.", action: "upload" });
                        setFile(null);
                        setIsModalOpen(false);
                        await fetchFiles();
                    } else {
                        const data = await response.json();
                        setStatus({ type: "error", text: `Upload failed: ${data.message || "Unknown error"}`, action: "" });
                    }
                } catch (error) {
                    setStatus({ type: "error", text: "Network connection failed. Is the backend running?", action: "" });
                } finally {
                    setIsUploading(false);
                }
            };

            const handleSetActive = async (fileName) => {
                try {
                    const response = await fetch("http://127.0.0.1:8000/api/knowledge/set-active", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ file_name: fileName }),
                    });

                    const data = await response.json();

                    if (response.ok) {
                        setStatus({ type: "success", text: data.data?.message || `${fileName} is now active.`, action: "setActive" });
                        await fetchFiles();
                    } else {
                        setStatus({ type: "error", text: data.message || "Failed to set active PDF.", action: "" });
                    }
                } catch (error) {
                    setStatus({ type: "error", text: "Failed to connect to backend.", action: "" });
                }
            };

            const triggerDeleteFile = (fileName) => {
                setFileToDelete(fileName);
            };

            const confirmDeleteFile = async () => {
                if (!fileToDelete) return;
                const fileName = fileToDelete;
                setFileToDelete(null);

                try {
                    const response = await fetch(`http://127.0.0.1:8000/api/knowledge/files/${encodeURIComponent(fileName)}`, {
                        method: "DELETE",
                    });

                    const data = await response.json();

                    if (response.ok) {
                        setStatus({ type: "deleted", text: data.data?.message || `${fileName} deleted successfully.`, action: "delete" });
                        await fetchFiles();
                    } else {
                        setStatus({ type: "error", text: data.message || "Failed to delete PDF.", action: "" });
                    }
                } catch (error) {
                    setStatus({ type: "error", text: "Failed to connect to backend.", action: "" });
                }
            };

            useEffect(() => {
                fetchFiles();
            }, []);

            const totalItems = files.length;
            const trainedCount = files.length;
            const pendingCount = 0;
            const failedCount = 0;
            const totalChars = files.reduce((sum, f) => sum + Number(f.size || 0), 0);

            return (
                <>
                    <chatbot-sidebar></chatbot-sidebar>


                    <main className="main-container">
                        <div className="header">
                            <h1>Links & Documents</h1>
                            <p>Manage the source material your AI chatbot uses for its knowledge base.</p>
                        </div>

                        {status.text && (
                            <div className={`status-message ${status.type}`}>
                                {status.type === "success" ? "✨" : status.type === "deleted" ? "🗑️" : "⚠️"} {status.text}
                            </div>
                        )}

                        {status.type === "success" && status.action === "setActive" && (
                            <div
                                style={{
                                    marginBottom: "20px",
                                    padding: "18px",
                                    borderRadius: "16px",
                                    background: "rgba(37, 99, 235, 0.08)",
                                    border: "1px solid var(--glass-border)",
                                    textAlign: "left"
                                }}
                            >
                                <div style={{ fontSize: "18px", fontWeight: "700", marginBottom: "8px" }}>
                                    Next step
                                </div>
                                <div style={{ fontSize: "15px", color: "var(--text-dim)", marginBottom: "14px", lineHeight: "1.5" }}>
                                    Please review Bot Configuration so the chatbot matches this uploaded document.
                                </div>
                                <a
                                    href="new_prompt.html"
                                    style={{
                                        display: "inline-block",
                                        padding: "10px 16px",
                                        borderRadius: "10px",
                                        textDecoration: "none",
                                        background: "var(--primary)",
                                        color: "white",
                                        fontSize: "14px",
                                        fontWeight: "600"
                                    }}
                                >
                                    Open Bot Configuration
                                </a>
                            </div>
                        )}

                        <div className="stats-row">
                            <div className="glass-card">
                                <div className="stat-label">Files</div>
                                <div className="stat-value">{totalItems}</div>
                            </div>
                            <div className="glass-card">
                                <div className="stat-label">Trained</div>
                                <div className="stat-value">{trainedCount}</div>
                            </div>
                            <div className="glass-card">
                                <div className="stat-label">Pending</div>
                                <div className="stat-value">{pendingCount}</div>
                            </div>
                            <div className="glass-card">
                                <div className="stat-label">Failed</div>
                                <div className="stat-value">{failedCount}</div>
                            </div>
                            <div className="glass-card">
                                <div className="stat-label">Total Size</div>
                                <div className="stat-value">{(totalChars / 1024).toFixed(1)} KB</div>
                            </div>
                        </div>

                        <div className="tabs-nav">
                            <div className="tab-item">Links / Docs</div>
                        </div>

                        <div className="action-bar">
                            <div style={{ display: "flex", gap: "12px", alignItems: "center", flexWrap: "wrap" }}>
                                <span style={{ fontWeight: 500, fontSize: "0.95rem", marginRight: "12px" }}>
                                    Total items: {totalItems}
                                </span>
                            </div>

                            <button className="btn btn-primary" type="button" onClick={openModal}>
                                ➕ Add Links / Upload Docs
                            </button>
                        </div>

                        <div className="table-area">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Size</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {files.length === 0 ? (
                                        <tr>
                                            <td colSpan="4" style={{ color: "var(--text-dim)" }}>
                                                No files uploaded yet.
                                            </td>
                                        </tr>
                                    ) : (
                                        files.map((f, index) => (
                                            <tr key={index}>
                                                <td>
                                                    <div className="name-cell">
                                                        <span>📄</span>
                                                        <span>{f.file_name}</span>
                                                    </div>
                                                </td>
                                                <td className="char-count">
                                                    {f.size ? `${(Number(f.size) / 1024).toFixed(1)} KB` : "-"}
                                                </td>
                                                <td>
                                                    <span className={`status-badge ${f.file_name === activeFile ? "" : "inactive"}`}>
                                                        {f.file_name === activeFile ? "ACTIVE" : "AVAILABLE"}
                                                    </span>
                                                </td>
                                                <td>
                                                    <div className="table-actions">
                                                        <button
                                                            className="btn btn-primary"
                                                            type="button"
                                                            onClick={() => handleSetActive(f.file_name)}
                                                            disabled={f.file_name === activeFile}
                                                            title={f.file_name === activeFile ? "This file is already active." : "Set this file as active"}
                                                        >
                                                            Set Active
                                                        </button>

                                                        <button
                                                            className="btn btn-danger"
                                                            type="button"
                                                            onClick={() => triggerDeleteFile(f.file_name)}
                                                            disabled={f.file_name === activeFile}
                                                            title={f.file_name === activeFile ? "Active file cannot be deleted." : "Delete this file"}
                                                        >
                                                            Delete
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>

                        <div style={{ marginTop: "12px", textAlign: "right", fontSize: "0.8rem", opacity: 0.6 }}>
                            {files.length === 0 ? "0 items" : `1-${files.length} of ${files.length} items`}
                        </div>
                    </main>

                    <div className={`modal-backdrop ${isModalOpen ? "open" : ""}`} onClick={(e) => { if (e.target === e.currentTarget) closeModal(); }}>
                        <div className="modal-content">
                            <h2 style={{ marginBottom: "8px" }}>Add New Resource</h2>
                            <p style={{ color: "var(--text-dim)", fontSize: "0.9rem", marginBottom: "24px" }}>
                                Expand your chatbot's knowledge base.
                            </p>

                            <div className="modal-tabs">
                                <button
                                    className={`modal-tab ${activeTab === "link" ? "active" : ""}`}
                                    type="button"
                                    onClick={() => setActiveTab("link")}
                                >
                                    Website Link
                                </button>
                                <button
                                    className={`modal-tab ${activeTab === "file" ? "active" : ""}`}
                                    type="button"
                                    onClick={() => setActiveTab("file")}
                                >
                                    Upload Document
                                </button>
                            </div>

                            {activeTab === "link" ? (
                                <div className="input-group">
                                    <label>Website URL</label>
                                    <input
                                        type="text"
                                        className="modal-input"
                                        value={linkUrl}
                                        onChange={(e) => setLinkUrl(e.target.value)}
                                        placeholder="https://example.com/blog/article-1"
                                    />
                                    <div style={{ marginTop: "10px", color: "var(--text-dim)", fontSize: "0.85rem" }}>
                                        Link training UI is ready, but backend is not connected yet.
                                    </div>
                                </div>
                            ) : (
                                <div>
                                    <div className="drop-zone" onClick={() => document.getElementById("file-input").click()}>
                                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{ marginBottom: "12px", opacity: 0.5 }}>
                                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                            <polyline points="17 8 12 3 7 8"></polyline>
                                            <line x1="12" y1="3" x2="12" y2="15"></line>
                                        </svg>
                                        <p>Click to Upload PDF</p>
                                        <input
                                            type="file"
                                            id="file-input"
                                            style={{ display: "none" }}
                                            accept=".pdf"
                                            onChange={(e) => handleFileSelect(e.target)}
                                        />
                                    </div>

                                    {file && (
                                        <div style={{ marginTop: "12px", fontSize: "0.85rem", color: "var(--primary)", fontWeight: 600 }}>
                                            📄 Selected: {file.name}
                                        </div>
                                    )}
                                </div>
                            )}

                            <div className="modal-footer">
                                <button className="btn" type="button" onClick={closeModal}>
                                    Cancel
                                </button>
                                <button
                                    className="btn btn-primary"
                                    type="button"
                                    onClick={handleUpload}
                                    disabled={isUploading || (activeTab === "file" && !file)}
                                >
                                    {isUploading ? <span><span className="spinner"></span> Uploading...</span> : "Add Resource"}
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Custom Delete Confirmation Modal */}
                    <div className={`modal-backdrop ${fileToDelete ? "open" : ""}`} onClick={(e) => { if (e.target === e.currentTarget) setFileToDelete(null); }}>
                        <div className="modal-content" style={{ maxWidth: "420px", textAlign: "center", padding: "40px 30px" }}>
                            <div style={{ fontSize: "48px", marginBottom: "20px" }}>🗑️</div>
                            <h2 style={{ marginBottom: "12px" }}>Delete Document?</h2>
                            <p style={{ color: "var(--text-dim)", fontSize: "0.95rem", marginBottom: "32px", lineHeight: "1.5" }}>
                                Are you sure you want to delete <strong>{fileToDelete}</strong>?<br/>
                                This action cannot be undone.
                            </p>
                            <div className="modal-footer" style={{ justifyContent: "center", gap: "16px" }}>
                                <button className="btn" type="button" onClick={() => setFileToDelete(null)}>
                                    Cancel
                                </button>
                                <button className="btn btn-danger" type="button" onClick={confirmDeleteFile}>
                                    Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
