# Fly.io deployment for the chatbot SaaS.
#
# Three invariants drive this file. Two are correctness, one is privacy, and
# all three were learned by breaking them:
#
#  1. Exactly ONE machine. The volume is single-attach, and wsgi.py runs the
#     Wasender retry loop in-process - a second machine retries the same
#     messages and the customer receives duplicates.
#  2. The volume MUST mount at /app/data. That is where knowledge PDFs and
#     media_uploads live (app/storage_paths.py). Mount it elsewhere and tenant
#     uploads are wiped on every deploy while the database rows holding their
#     /media/ URLs survive.
#  3. Region is a privacy decision, not a latency one. See primary_region.

# Owned by "aibot EMAIL" (organization slug: personal).
# "wa-chatbot-my" was taken - Fly app names are unique across all of Fly.io.
# The name IS the hostname, and that hostname gets written
# into PUBLIC_BASE_URL, every Telegram setWebhook call and every widget embed
# snippet. Renaming later means re-pointing every channel by hand.
app = "aibot-chatbot-my"

# Singapore application compute. Supabase and other providers retain their own
# configured regions; this setting does not determine their data residency.
# It DOES decide where message content is processed: changing it moves personal
# data into another jurisdiction and may need a transfer basis under PDPA/GDPR.
# Do not change it for latency without checking that first.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  DOCUMENT_STORAGE_BACKEND = "r2"
  # The one-time cutover to R2 is DONE (43 files, 8,622,343 bytes, verified by
  # SHA-256 readback). It stays at "0" because wsgi.py runs the migration at
  # import on EVERY boot, and its only guard is the marker file living on the
  # volume. Replace or restore that volume and a "1" here re-arms two failure
  # modes: the app refuses to boot when the inventory is under the minimum
  # below, and -- worse -- a re-run re-uploads stale local cache copies over
  # current R2 objects, which can resurrect a document the tenant deleted.
  # Set it to "1" only for a deliberate, supervised re-migration.
  R2_INITIAL_MIGRATION = "0"
  R2_MIGRATION_MIN_FILES = "43"
  PORT = "8000"
  FLASK_DEBUG = "false"
  # The gunicorn process is the ONLY runner for these jobs - there is no
  # [processes] block, no cron and no worker machine. Setting either to "false"
  # here does not defer the work, it deletes it: Wasender replies that fail once
  # are never retried, and the billing scheduler stops doing subscription
  # transitions, order reconciliation and the owner notifications added in
  # b01dd75. To pause them for a handover, do it on one machine
  # (`fly deploy --env BILLING_SCHEDULER_ENABLED=false`) - never as the
  # committed default that every later deploy silently inherits.
  WASENDER_RETRY_WORKER_ENABLED = "true"
  PUBLIC_BASE_URL = "https://aibot-chatbot-my.fly.dev"
  FRONTEND_URL = "https://aibot-chatbot-my.fly.dev"
  CORS_ORIGINS = "https://aibot-chatbot-my.fly.dev"
  # Fly's proxy is exactly one hop. Raising this trusts a forged
  # X-Forwarded-For and hands out an unauthenticated rate-limit bypass.
  TRUSTED_PROXY_HOPS = "1"
  # ENABLE_DEV_BILLING_ROUTES is deliberately ABSENT, not "false".
  # app/config.py tests the raw string for truthiness, so even the string
  # "false" is truthy and raises RuntimeError at boot.

[mounts]
  source = "chatbot_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Never scale to zero: the retry worker is an in-process loop, and a stopped
  # machine silently stops retrying failed customer sends.
  # Never scale out: invariant 1.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  # 1GB, not 512MB: the image loads PyMuPDF and the Google GenAI client at
  # import time and OOMs on the smaller size.
  memory = "1gb"
